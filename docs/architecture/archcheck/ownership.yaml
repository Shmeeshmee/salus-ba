# Every table created in migrations/ and the one package that owns it. Only the owner's repository reads or
# writes the table; everyone else goes through the owner's service. A new table is added here in the same
# commit as its migration. archcheck checks this file against every CREATE TABLE in migrations/.
#
# owner: a domain in internal/, or `river` for River's job queue tables (written only through River's
# client; job arguments carry opaque ids, never personal data). dropped: true for a table a later
# migration removes.
#
# personal_data: true|false, required on every table a domain owns. A table with personal data needs a rule
# in internal/retention/rules.go (archcheck), and its personal fields a line in the feature's SPEC.md.
tables:
  account: {owner: auth, personal_data: true}
  allergy_intolerance: {owner: allergyintolerance, personal_data: true} # 00043, SAL-41
  allergy_intolerance_provenance: {owner: allergyintolerance, personal_data: true} # 00053, SAL-41
  appointment: {owner: appointment, personal_data: true}
  appointment_action_token: {owner: appointment, personal_data: true} # a reminder's one-time link (00054, SAL-32)
  appointment_change: {owner: appointment, personal_data: true} # an appointment's history (00054, SAL-32)
  audit_event: {owner: auditevent, personal_data: true}
  binary: {owner: binary, personal_data: true}
  chat_consent: {owner: consent, personal_data: true}
  clinic_appointment_stat: {owner: clinicstats, personal_data: true} # 00048, SAL-20
  clinic_diagnosis_stat: {owner: clinicstats, personal_data: true} # 00048, SAL-20
  communication: {owner: communication, personal_data: true}
  communication_revision: {owner: communication, personal_data: true}
  condition: {owner: condition, personal_data: true}
  consent: {owner: consent, personal_data: true}
  conversation: {owner: communication, personal_data: true}
  conversation_participant: {owner: communication, personal_data: true}
  diagnosis_group: {owner: terminology, personal_data: false}
  diagnosis_group_name: {owner: terminology, personal_data: false}
  diagnosis_group_range: {owner: terminology, personal_data: false}
  document_draft: {owner: composition, personal_data: true}
  document_template: {owner: composition, personal_data: false}
  document_template_translation: {owner: composition, personal_data: false}
  encounter: {owner: encounter, personal_data: true}
  history_consent: {owner: consent, personal_data: true} # 00043, SAL-42
  history_consent_encounter: {owner: consent, personal_data: true} # 00043, SAL-42
  invite: {owner: auth, personal_data: true}
  medication_statement: {owner: medicationstatement, personal_data: true} # 00043, SAL-41
  medication_statement_provenance: {owner: medicationstatement, personal_data: true} # 00053, SAL-41
  organization: {owner: organization, personal_data: false}
  organization_appointment_settings: {owner: organization, personal_data: false} # reminder, reschedule, waitlist, no-show rules (00054)
  organization_chat_settings: {owner: organization, personal_data: false} # chat hours and delays (00047)
  patient: {owner: patient, personal_data: true}
  place: {owner: terminology, personal_data: false}
  practitioner: {owner: practitioner, personal_data: true}
  push_device: {owner: notification, personal_data: true} # an account's device token (00047)
  practitioner_role: {owner: practitionerrole, personal_data: true}
  questionnaire: {owner: questionnaire, personal_data: false}
  questionnaire_default: {owner: questionnaire, personal_data: false}
  questionnaire_response: {owner: questionnaireresponse, personal_data: true}
  questionnaire_translation: {owner: questionnaire, personal_data: false}
  schedule: {owner: schedule, personal_data: true}
  session: {owner: auth, personal_data: true}
  slot: {owner: slot, personal_data: true}
  suggestion: {owner: suggestion, personal_data: true}
  term: {owner: terminology, personal_data: true} # reviewed_by, the reviewer's account (00037)
  term_explanation: {owner: terminology, personal_data: true} # reviewed_by
  term_label: {owner: terminology, personal_data: false}
  term_reviewer: {owner: auth, personal_data: true} # the reviewer permission of a staff account (00039)
  term_translation: {owner: terminology, personal_data: true} # reviewed_by
  transcript_segment: {owner: transcript, personal_data: true}
  transcription_consent: {owner: consent, personal_data: true}
  trends_cell: {owner: trends, personal_data: true}
  trends_period: {owner: trends, personal_data: false}
  trends_rise: {owner: trends, personal_data: true}
  video_session: {owner: videosession, personal_data: true}
  webhook_dead_letter: {owner: notification, personal_data: true} # ids of a patient's message (00047)
  webhook_endpoint: {owner: notification, personal_data: true} # created_by (00047)
  river_job: {owner: river}
  river_leader: {owner: river}
  river_queue: {owner: river}
  river_notification: {owner: river}
  river_client: {owner: river, dropped: true}
  river_client_queue: {owner: river, dropped: true}
  # River 005 recreates its own ledger only when that table already exists; River 001 is not applied here
  # (docs/bootstrap/PROGRESS.md), so it never does.
  river_migration: {owner: river, dropped: true}
