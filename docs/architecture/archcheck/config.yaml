# The bounded contexts are lists of domain packages under internal/; the tree stays flat. CLAUDE.md
# ("Go architecture") names the planned domains; a domain is listed here in the same commit that adds its
# package. archcheck fails on a package under internal/ that is in no list.
contexts: {}

# Packages under internal/ that are not domains: configuration and composition roots.
infrastructure: [api, config, worker]

# Table owners that are libraries rather than domains (their tables are written only through the library).
library_owners: [river]
