# Web app (build/package/web.Dockerfile). Included in nginx's http block as default.conf. Static files only:
# Caddy sends the API paths (web/vite.config.ts) to the api service before a request reaches this server.
# No access log: a request line can carry an appointment or encounter id, and the client address is personal data
# (GDPR); behind Caddy the error log sees only Caddy's container address.

# Vite's hashed files never change under the same name; everything else (index.html) is revalidated on every load,
# so a deploy reaches the browser at once.
map $uri $salus_cache_control {
    ~^/assets/ "public, max-age=31536000, immutable";
    default   "no-cache";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Every add_header sits here: nginx drops the server's headers in a location that adds its own. Cache-Control
    # goes on successful responses only, so a 404 under /assets/ is not cached for a year.
    # The app loads only its own files. It calls the API on this origin (fetch and the consultation's WebSocket)
    # and LiveKit on livekit.SALUS_DOMAIN (wss:, and https: for its connection checks); the domain is not known when
    # the image is built, so connect-src allows any TLS origin and nothing in clear text. Camera and microphone
    # are for the consultation, on this origin only.
    add_header Cache-Control $salus_cache_control;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; font-src 'self'; connect-src 'self' https: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # A missing hashed file is a 404, never index.html cached for a year.
    location /assets/ {
        try_files $uri =404;
    }

    # Every other path is a screen of the app (/appointments/<id>, /questionnaires, ...): the SPA routes it.
    location / {
        try_files $uri /index.html;
    }
}
