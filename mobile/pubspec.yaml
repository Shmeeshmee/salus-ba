name: salus
description: "Salus app for patients"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The app's languages (docs/i18n/SPEC.md §3): Material's and Cupertino's own texts, right to left for Arabic, and
  # the catalogs generated from lib/l10n/*.arb (l10n.yaml). Shipped with the Flutter SDK.
  flutter_localizations:
    sdk: flutter
  # Plurals, dates, times and numbers in the UI language; the generated catalogs need it. Pinned exact, the
  # version flutter_localizations resolves.
  intl: 0.20.3

  # Generated from api/openapi.yaml by `make gen-clients`.
  salus_api:
    path: packages/salus_api

  # The session token, in the Keychain (iOS) or the Keystore (Android); never in shared preferences.
  # Pinned exact.
  flutter_secure_storage: 11.2.0

  # IANA time zones: times are shown in the clinic's zone (docs/booking/SPEC.md "Time"), which Dart's
  # DateTime (UTC or the device's zone only) cannot do. Pinned exact.
  timezone: 0.11.2

  # Opens the privacy notice (PRIVACY_NOTICE_URL) in the device's browser from the consent screen
  # (docs/booking/SPEC.md "Consent shape"). Flutter's own plugin; opening a URL needs platform code on iOS and
  # Android otherwise. Pinned exact.
  url_launcher: 6.3.3

  # Video consultations (docs/consultation/SPEC.md "Mobile client"): LiveKit's Flutter SDK, reached only
  # through lib/call.dart. Pinned exact.
  livekit_client: 2.13.2

  # Camera and microphone permissions: whether they are still to be asked (M35 before the system prompt on
  # Android), and the device settings when they were denied (M11), which neither livekit_client nor
  # url_launcher can open on Android. Reached only through lib/call.dart. Pinned exact.
  permission_handler: 13.0.2

  # livekit_client logs through package:logging, which it already depends on; lib/call.dart turns that log off
  # (its connection steps carry the signalling URL with the token), and the logger's level can only be set with
  # hierarchical logging on. Pinned exact, the version livekit_client resolves.
  logging: 1.3.0

  # Questionnaire attachments (docs/attachments/SPEC.md §2 "Mobile"; docs/attachments/PROGRESS.md, package 1.7, has
  # the reasoning). Reached only through lib/files.dart. Pinned exact.
  # The camera (photo and video) and the photo library: Flutter's own plugin, the system pickers on both platforms.
  image_picker: 1.2.4
  # PDFs from the documents: the system document picker on both platforms.
  file_picker: 13.1.0
  # The streamed upload with its Content-Length (lib/booking.dart): the generated client's own HTTP package, now
  # used directly. Pinned exact, the version the client resolves.
  http: 1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Generates lib/l10n/app_localizations*.dart from the catalogs (l10n.yaml).
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

  # Arabic letters (docs/i18n/SPEC.md §3 "Fonts"): Noto Sans Arabic v2.013, the unhinted static fonts from the
  # notofonts/arabic release, under the SIL Open Font License (assets/fonts/NotoSansArabic-OFL.txt). Bundled:
  # no font is loaded from the network. The theme names it as a fallback (lib/app.dart).
  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
