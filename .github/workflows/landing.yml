# Landing page: lint, typecheck, tests and the prerendering build.
# Runs on every pull request so its required checks always report; the jobs skip when no path matching the
# filter changed (a skipped job counts as passed). Everything runs through make in Docker, as locally.
name: landing

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        run: bash scripts/ci-changed.sh '^landing/|^build/package/(node|landing)\.Dockerfile$|^deployments/|^(Makefile|\.github/workflows/landing\.yml)$' >> "$GITHUB_OUTPUT"

  landing:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make landing-lint
      - run: make landing-typecheck
      - run: make landing-test
      - run: make landing-build
