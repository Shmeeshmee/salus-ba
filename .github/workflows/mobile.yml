# Mobile: flutter analyze (after the catalog check), flutter test, the generated Dart client, and the debug APK.
# Runs on every pull request so its required checks always report; the jobs skip when no path matching the
# filter changed (a skipped job counts as passed). Everything runs through make in Docker, as locally.
name: mobile

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        run: bash scripts/ci-changed.sh '^mobile/|^api/openapi\.yaml$|^scripts/i18n-check\.|^build/package/flutter\.Dockerfile$|^deployments/|^(Makefile|\.github/workflows/mobile\.yml)$' >> "$GITHUB_OUTPUT"

  mobile:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make mobile-analyze
      - run: make mobile-test
      - run: make gen-client-dart
      - name: Generated client is up to date
        run: git status --porcelain && test -z "$(git status --porcelain)"

  # The debug APK (owner, 2026-11-07, docs/attachments package 4.1): proves the Android build (compileSdk, the
  # Kotlin of MainActivity, Media3) on every change under mobile/. Not through make: the flutter image is built with
  # `precache --no-android` and has no Android SDK, so this job uses the runner's Android SDK with Java and Flutter
  # pinned by the two actions (by commit, as every action here) and the version of build/package/flutter.Dockerfile.
  # Gradle installs the SDK platform, NDK and CMake the build asks for. The APK is uploaded as the `app-debug`
  # artifact, kept 14 days, for the owner's phone walks (owner, 2026-11-08): `gh run download <run> -n app-debug`.
  apk:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
      - name: flutter build apk --debug
        working-directory: mobile
        run: |
          flutter config --no-analytics
          flutter build apk --debug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
