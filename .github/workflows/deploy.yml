# Deploy: puts a release of main on the production server (docs/deploy/README.md, docs/adr/0011-single-server-deployment.md).
#
# When: after every Images run of main whose release job succeeded (images built, scanned and pushed for main's head;
# see images.yml), and by hand (workflow_dispatch) with a commit SHA, default main's head, whose images exist. Nothing
# runs until the repository variable DEPLOY_ENABLED is `true`: until the server and the secrets exist, the resolve job
# says so and the deploy job is skipped.
#
# The deploy job runs in the GitHub environment `production`, which needs the owner's approval (a required reviewer
# set on the environment, docs/deploy/README.md). It checks out the release, checks that the env file secret has
# every variable of deployments/production/.env.production.example, uploads deployments/production/ and the env
# file to /opt/salus/releases/<sha>/ over SSH as the deploy user (host key pinned), logs the server in to GHCR with
# this run's token (read-only, expires with the run; logged out at the end), and runs deploy.sh there: pull, migrate
# as a one-shot through `up`, `up -d --wait` for every healthcheck, and on a failure the previous release's images
# and files back without migrate. Then it checks the public endpoints from outside and rolls back if they fail.
# Deploys never run at the same time and are never cancelled half-way.
name: Deploy

on:
  workflow_run:
    workflows: [Images]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to deploy (default main's head); its images must exist
        required: false
      migrate:
        description: Run migrations (off to go back to an older release, whose code must accept the newer schema)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  GHCR_OWNER: ${{ vars.GHCR_OWNER || 'shmeeshmee' }}

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      deploy: ${{ steps.release.outputs.deploy }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Which release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ENABLED: ${{ vars.DEPLOY_ENABLED }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          skip() { echo "deploy=false" >> "$GITHUB_OUTPUT"; echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }
          if [ "$ENABLED" != true ]; then
            skip "Not deployed: the repository variable DEPLOY_ENABLED is not \`true\` (docs/deploy/README.md)."
          fi
          if [ "$EVENT" = workflow_run ]; then
            [ "$RUN_CONCLUSION" = success ] || skip "Not deployed: the Images run did not succeed."
            [ "$RUN_EVENT" = push ] || skip "Not deployed: the Images run was not for a push to main."
            release=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate \
              --jq '.jobs[] | select(.name == "release") | .conclusion')
            [ "$release" = success ] || skip "Not deployed: the Images run released nothing (not main's head)."
            sha=$RUN_SHA
          else
            [ "$REF" = refs/heads/main ] || { echo "A manual deploy runs from main only." >&2; exit 1; }
            sha=${INPUT_SHA:-$(gh api "repos/$REPO/commits/main" --jq .sha)}
          fi
          if ! printf '%s' "$sha" | grep -Eqx '[0-9a-f]{40}'; then
            echo "Not a full commit SHA: $sha" >&2
            exit 1
          fi
          # The environment must exist with a required reviewer: a job naming a missing environment would create it
          # unprotected, and deploy without the owner's approval.
          # Fails closed: an API error (a missing environment is a 404) or anything but a count of at least 1 stops it.
          if ! reviewers=$(gh api "repos/$REPO/environments/production" \
              --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length' 2>/dev/null) ||
            ! [[ $reviewers =~ ^[0-9]+$ ]] || ((reviewers < 1)); then
            echo "The environment production does not exist or has no required reviewer (docs/deploy/README.md step 6)." >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - name: The release's images exist
        if: steps.release.outputs.deploy == 'true'
        env:
          SHA: ${{ steps.release.outputs.sha }}
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin >/dev/null
          for image in salus salus-web salus-landing salus-caddy; do
            docker buildx imagetools inspect "ghcr.io/$GHCR_OWNER/$image:$SHA" >/dev/null ||
              { echo "No image ghcr.io/$GHCR_OWNER/$image:$SHA" >&2; exit 1; }
          done
          docker logout ghcr.io >/dev/null

  deploy:
    needs: resolve
    if: needs.resolve.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production
      url: https://app.${{ vars.SALUS_DOMAIN }}
    permissions:
      contents: read
      packages: read
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
      MIGRATE: ${{ github.event_name == 'workflow_dispatch' && !inputs.migrate && 'no' || 'yes' }}
      DOMAIN: ${{ vars.SALUS_DOMAIN }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
      DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Settings and SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          ENV_FILE: ${{ secrets.SALUS_ENV_FILE }}
        run: |
          for v in DOMAIN DEPLOY_HOST; do
            [ -n "${!v}" ] || { echo "The repository variable for $v is not set (docs/deploy/README.md)." >&2; exit 1; }
          done
          [ -n "$SSH_KEY" ] && [ -n "$KNOWN_HOSTS" ] && [ -n "$ENV_FILE" ] ||
            { echo "DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS and SALUS_ENV_FILE must be set on the production environment." >&2; exit 1; }
          umask 077
          mkdir -p ~/.ssh "$RUNNER_TEMP/salus"
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$ENV_FILE" > "$RUNNER_TEMP/salus/.env"
          # Every variable the example sets must be in the secret, not empty. Only names are printed.
          missing=0
          while read -r key; do
            if ! grep -Eq "^$key=.+" "$RUNNER_TEMP/salus/.env"; then
              echo "SALUS_ENV_FILE has no value for $key" >&2
              missing=1
            fi
          done < <(grep -E '^[A-Z0-9_]+=' deployments/production/.env.production.example | cut -d= -f1)
          [ "$missing" = 0 ]
          if grep -q $'\r' "$RUNNER_TEMP/salus/.env"; then
            echo "SALUS_ENV_FILE has Windows line endings (CR): paste it again with LF only." >&2
            exit 1
          fi
          # A key the example does not know is a typo or a leftover: named, not fatal.
          while read -r key; do
            grep -Eq "^#? ?$key=" deployments/production/.env.production.example ||
              echo "::warning::SALUS_ENV_FILE sets $key, which .env.production.example does not know"
          done < <(grep -oE '^[A-Z0-9_]+=' "$RUNNER_TEMP/salus/.env" | tr -d =)
          value() { sed -n "s/^$1=//p" "$RUNNER_TEMP/salus/.env" | tail -1 | sed -E "s/^\"(.*)\"\$/\\1/; s/^'(.*)'\$/\\1/"; }
          if [ "$(value SALUS_DOMAIN)" != "$DOMAIN" ]; then
            echo "SALUS_ENV_FILE's SALUS_DOMAIN differs from the SALUS_DOMAIN variable." >&2
            exit 1
          fi
          owner=$(value GHCR_OWNER)
          if [ "${owner:-shmeeshmee}" != "$GHCR_OWNER" ]; then
            echo "SALUS_ENV_FILE's GHCR_OWNER differs from the GHCR_OWNER variable (images checked under $GHCR_OWNER)." >&2
            exit 1
          fi
          cat > ~/.ssh/config <<EOF
          Host salus
            HostName $DEPLOY_HOST
            Port $DEPLOY_SSH_PORT
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ServerAliveInterval 30
          EOF
      - name: Upload the release
        run: |
          # shellcheck disable=SC2029 # $SHA is a checked 40-hex SHA, expanded here on purpose
          tar -C deployments/production -cz --exclude=./test --exclude=./bootstrap . |
            ssh salus "mkdir -p /opt/salus/releases/$SHA && tar -xz -C /opt/salus/releases/$SHA"
          # shellcheck disable=SC2029
          ssh salus "umask 077 && cat > /opt/salus/releases/$SHA/.env" < "$RUNNER_TEMP/salus/.env"
      - name: Log the server in to GHCR (this run's token)
        env:
          TOKEN: ${{ github.token }}
        # Any user name goes with a GITHUB_TOKEN.
        run: echo "$TOKEN" | ssh salus "docker login ghcr.io -u salus-deploy --password-stdin" >/dev/null
      - name: Deploy, roll back on failure
        # deploy.sh runs detached on the server (start), so a dropped connection or a cancelled run cannot stop it
        # half-way: it finishes or rolls back on its own. This step follows its status and prints its log.
        run: |
          flag=
          [ "$MIGRATE" = yes ] || flag=--no-migrate
          # A failed start over SSH may still have started it on the server: the status below tells.
          # shellcheck disable=SC2029
          ssh salus "bash /opt/salus/releases/$SHA/deploy.sh start $SHA $flag" || echo "::warning::start over SSH failed"
          status=running
          while ((SECONDS < 35 * 60)); do
            sleep 10
            # shellcheck disable=SC2029
            status=$(ssh salus "bash /opt/salus/releases/$SHA/deploy.sh status $SHA" 2>/dev/null | tail -1) || status=unreachable
            case $status in running | unreachable) continue ;; *) break ;; esac
          done
          # shellcheck disable=SC2029
          ssh salus "cat /opt/salus/releases/$SHA/deploy.log" || true
          case $status in
          0) echo "Deployed." ;;
          1) echo "Not deployed: refused (another deploy runs?), or failed and rolled back (log above)." >&2; exit 1 ;;
          2) echo "Failed, and the rollback failed too: the stack needs a person (log above)." >&2; exit 1 ;;
          died) echo "The deploy on the server stopped without a result (killed or rebooted): check the stack by hand." >&2; exit 1 ;;
          none) echo "The deploy did not start on the server." >&2; exit 1 ;;
          running | unreachable) echo "No result within 35 minutes ($status); the deploy goes on on the server." >&2; exit 1 ;;
          *) echo "Unexpected status from the server: $status" >&2; exit 1 ;;
          esac
      - name: Check the public endpoints
        id: public
        run: |
          for url in "https://$DOMAIN/healthz" "https://app.$DOMAIN/healthz" "https://api.$DOMAIN/healthz"; do
            curl -fsS --retry 10 --retry-delay 6 --retry-all-errors --max-time 10 -o /dev/null "$url" ||
              { echo "$url did not answer 200" >&2; exit 1; }
          done
      - name: Roll back after a failed public check
        if: failure() && steps.public.outcome == 'failure'
        run: |
          # shellcheck disable=SC2029 # $SHA is a checked 40-hex SHA, expanded here on purpose
          ssh salus "bash /opt/salus/releases/$SHA/deploy.sh rollback"
      - name: Log the server out of GHCR
        if: always()
        run: ssh salus "docker logout ghcr.io" >/dev/null 2>&1 || true
      - name: Summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: echo "Release \`$SHA\`, migrate $MIGRATE, $STATUS." >> "$GITHUB_STEP_SUMMARY"
