openapi: 3.1.0
info:
  title: Salus API
  version: 0.1.0
  description: >-
    Non-FHIR endpoints of the Salus API. FHIR endpoints live under /fhir/R4/ and are described by
    api/fhir/CapabilityStatement.json. The TypeScript and Dart clients are generated from this file
    (`make gen-clients`).
servers:
  - url: /
    description: Same origin as the client
security: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness
      description: The process serves requests. Touches no dependency.
      tags: [health]
      security: [] # public: used by orchestrators before any login
      responses:
        "200":
          description: Alive.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Status"}
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness
      description: >-
        Every dependency (Postgres, Redis) answers. A failing check is named; its error is only logged.
      tags: [health]
      security: [] # public: used by orchestrators before any login
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Status"}
        "503":
          description: A dependency is not available.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Unavailable"}
  /auth/register:
    post:
      operationId: register
      summary: Register a patient account
      description: >-
        Creates a patient account. The e-mail is trimmed and lower-cased; the password (12 to 128 characters,
        no composition rules) is stored only as its argon2id hash. A taken e-mail answers 409. Audited.
      tags: [auth]
      security: [] # public: there is no account yet
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegisterRequest"}
      responses:
        "201":
          description: The account was created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Account"}
        "400":
          description: "`invalid_request`, `invalid_email` or `invalid_password`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: "`email_taken`: the e-mail has an account."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          description: "`internal error`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /auth/me:
    get:
      operationId: getMe
      summary: The signed-in account
      description: The account of the session that made the request. Audited.
      tags: [auth]
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Account"}
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          description: "`internal error`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: salus_session
      description: The web app's session (HttpOnly, Secure, SameSite=Strict).
    bearerAuth:
      type: http
      scheme: bearer
      description: The mobile app's session token.
  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: Counted in characters, not bytes.
    Account:
      type: object
      required: [id, email, role, mfaEnrolled]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [admin, practitioner, patient]
        organizationId:
          type: string
          format: uuid
          description: The clinic of a staff account; absent for a patient.
        mfaEnrolled:
          type: boolean
    Error:
      type: object
      required: [error]
      description: Every JSON API error. The code is fixed per case; it never carries internal text.
      properties:
        error:
          type: string
          enum: [invalid_request, invalid_email, invalid_password, email_taken, unauthenticated, internal error, timeout]
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Unavailable:
      type: object
      required: [status, failed]
      properties:
        status:
          type: string
          const: unavailable
        failed:
          type: array
          description: Names of the failing checks.
          items:
            type: string
            enum: [postgres, redis]
