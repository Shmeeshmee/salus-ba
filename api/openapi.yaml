        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: "`forbidden`: a staff account."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
