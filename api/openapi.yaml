openapi: 3.1.0
info:
  title: Salus API
  version: 0.1.0
  description: >-
    Non-FHIR endpoints of the Salus API. FHIR endpoints live under /fhir/R4/ and are described by
    api/fhir/CapabilityStatement.json. The TypeScript and Dart clients are generated from this file
    (`make gen-clients`).
servers:
  - url: /
    description: Same origin as the client
security: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness
      description: The process serves requests. Touches no dependency.
      tags: [health]
      security: [] # public: used by orchestrators before any login
      responses:
        "200":
          description: Alive.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Status"}
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness
      description: >-
        Every dependency (Postgres, Redis) answers. A failing check is named; its error is only logged.
      tags: [health]
      security: [] # public: used by orchestrators before any login
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Status"}
        "503":
          description: A dependency is not available.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Unavailable"}
  /auth/register:
    post:
      operationId: register
      summary: Register a patient account
      description: >-
        Creates a patient account. The e-mail is trimmed and lower-cased; the password (12 to 128 characters,
        no composition rules) is stored only as its argon2id hash. A taken e-mail answers 409. Audited.
      tags: [auth]
      security: [] # public: there is no account yet
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegisterRequest"}
      responses:
        "201":
          description: The account was created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Account"}
        "400":
          description: "`invalid_request`, `invalid_email` or `invalid_password`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: "`email_taken`: the e-mail has an account."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          description: "`internal error`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /auth/me:
    get:
      operationId: getMe
      summary: The signed-in account
      description: The account of the session that made the request. Audited.
      tags: [auth]
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Account"}
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          description: "`internal error`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    patch:
      operationId: updateMe
      summary: Choose the account's language
      description: >-
        Saves the language the user picked (docs/i18n/SPEC.md §3 "Picking and saving"); it wins on every
        device from then on, and e-mails use it. `null` clears it: the app follows the browser's or the
        device's language again. A staff account takes only a staff language. Audited.
      tags: [auth]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateMeRequest"}
      responses:
        "200":
          description: The account, changed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Account"}
        "400":
          description: "`invalid_request`: a body that is not the request (a tag outside the list included)."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "422":
          description: "`language_unavailable`: a staff account chose a language the web app does not offer."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/login:
    post:
      operationId: login
      summary: Sign in with e-mail and password
      description: >-
        Checks the password. A patient without MFA gets the session; an account with MFA gets a challenge
        with `next: verify`, and staff who have not set up MFA one with `next: enrol` (MFA is required for
        staff). The challenge lasts 5 minutes. The web app sends `X-Salus-CSRF: 1` and gets the session in the
        `salus_session` cookie; the mobile app gets the token in the body. Limited per e-mail (5 failures in
        15 minutes) and per client IP (30 attempts): over the limit the password is not checked and the answer
        is 429 with `Retry-After`. Audited.
      tags: [auth]
      security: [] # public: this is how a session starts
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginRequest"}
      responses:
        "200":
          $ref: "#/components/responses/LoginStep"
        "400":
          description: "`invalid_request`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          description: "`wrong_credentials`: an unknown e-mail or a wrong password, alike."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/mfa/enrol:
    post:
      operationId: enrolMfa
      summary: Start TOTP enrolment
      description: >-
        With a login challenge (staff at their first login) or, without one, with a patient's session:
        returns a new TOTP secret and its `otpauth://` URI. The secret is pending until confirmed. Audited.
      tags: [auth]
      security:
        - {}
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EnrolRequest"}
      responses:
        "200":
          description: The pending secret. Not cached.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Enrolment"}
        "400":
          description: "`invalid_request`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          description: "`invalid_challenge` or `unauthenticated`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          $ref: "#/components/responses/CSRF"
        "409":
          description: "`already_enrolled`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/mfa/confirm:
    post:
      operationId: confirmMfa
      summary: Confirm TOTP enrolment with the first code
      description: >-
        Marks MFA as set up. With a challenge it also opens the session (as `/auth/login` does); with a
        session it answers 204. A wrong code counts against the challenge; the fifth ends it. Audited.
      tags: [auth]
      security:
        - {}
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConfirmRequest"}
      responses:
        "200":
          $ref: "#/components/responses/LoginStep"
        "204":
          description: Enrolled from a session.
        "400":
          description: "`invalid_request`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          description: "`invalid_challenge`, `wrong_code` or `unauthenticated`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          $ref: "#/components/responses/CSRF"
        "409":
          description: "`already_enrolled`, or `not_enrolled` before `/auth/mfa/enrol`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/mfa/verify:
    post:
      operationId: verifyMfa
      summary: Finish signing in with a TOTP code
      description: >-
        With the challenge of `/auth/login` and a code: opens the session. A code is accepted one 30-second
        step either way, and only once. A wrong code counts against the challenge; the fifth ends it. Audited.
      tags: [auth]
      security: [] # the challenge is the credential
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VerifyRequest"}
      responses:
        "200":
          $ref: "#/components/responses/LoginStep"
        "400":
          description: "`invalid_request`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          description: "`invalid_challenge` or `wrong_code`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: "`not_enrolled`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/logout:
    post:
      operationId: logout
      summary: Sign out
      description: Ends the session; the next request with it is refused. Clears the cookie. Audited.
      tags: [auth]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "204":
          description: Signed out.
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          $ref: "#/components/responses/CSRF"
        "500":
          $ref: "#/components/responses/InternalError"
  /invites:
    post:
      operationId: createInvite
      summary: Invite a practitioner or an admin to the clinic
      description: >-
        An admin of the clinic invites someone by e-mail: a practitioner with their given and family name, or
        another admin. The invite is open for 72 hours; an open invite for the same e-mail in the clinic is
        replaced. The e-mail with the link (`<web>/invite#<token>`) is sent by the notifier. Whether the e-mail
        already has an account is not disclosed here. Audited.
      tags: [invites]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/InviteRequest"}
      responses:
        "201":
          description: The invite.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Invite"}
        "400":
          description: "`invalid_request`, `invalid_email`, `invalid_role` or `invalid_name`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: "`forbidden`: not an admin of the clinic; or `csrf`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listInvites
      summary: The clinic's open invites
      description: Invites of the admin's clinic that are neither accepted nor expired, oldest first. Audited.
      tags: [invites]
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The open invites.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InviteList"}
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: "`forbidden`: not an admin of the clinic."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /invites/accept:
    post:
      operationId: acceptInvite
      summary: Accept an invite
      description: >-
        With the token from the link's fragment and a password: creates the account (and, for a practitioner,
        the Practitioner and PractitionerRole) and returns a pending TOTP secret with a challenge. Confirm the
        first code with `/auth/mfa/confirm` and the challenge (valid 5 minutes) to finish enrolment and open the
        session; if the challenge lapses, sign in with the password to enrol again. Only the newest link of an
        invite works. Not cached. Audited.
      tags: [invites]
      security: [] # the token is the credential
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AcceptInviteRequest"}
      responses:
        "201":
          description: The account was created; MFA enrolment is pending.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Acceptance"}
        "400":
          description: "`invalid_request` or `invalid_password`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: "`invalid_invite`: the token is unknown, replaced, expired or used."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: "`email_taken`: the e-mail has an account."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /me/patient:
    get:
      operationId: getMyPatient
      summary: The signed-in patient's profile
      description: >-
        The profile of the signed-in patient account, or 404 before it is first saved (a profile exists only
        complete). Patients only. Not cached. Audited, also when refused.
      tags: [patient]
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The profile.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Patient"}
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: "`forbidden`: a staff account."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: "`not_found`: no profile yet."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: saveMyPatient
      summary: Save the signed-in patient's profile
      description: >-
        Creates the profile when `versionId` is absent, with every required field; updates it when
        `versionId` is the current version. Names are trimmed. Patients only. Not cached. Audited, also when
        refused.
      tags: [patient]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SavePatientRequest"}
      responses:
        "200":
          description: The updated profile.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Patient"}
        "201":
          description: The created profile.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Patient"}
        "400":
          description: "`invalid_request`, `invalid_name`, `invalid_birth_date` or `invalid_phone`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: "`forbidden`: a staff account; or `csrf`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: >-
            `version_conflict`: a create when the profile exists, or a `versionId` that is not the current
            one. Read the profile again and retry.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /consents:
    post:
      operationId: grantConsent
      summary: Consent to share the profile and appointments with a clinic, or to transcription
      description: >-
        The signed-in patient consents, for `care` (the default), to share their profile and appointments
        with the clinic (FHIR Consent, docs/booking/SPEC.md "Consent shape"); for `transcription`, to the
        transcription and translation of their consultations with the clinic, with AI assistance for the
        practitioner (SAL-12): the transcription agent joins a call only while both are active. At most one
        consent of each kind per clinic is active; granting again after a revocation creates a new consent,
        so the history is kept. Needs a profile. Patients only. Not cached. Audited, also when refused.
      tags: [consents]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GrantConsentRequest"}
      responses:
        "201":
          description: The active consent.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Consent"}
        "400":
          description: "`invalid_request`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: "`forbidden`: a staff account; or `csrf`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: "`not_found`: no such clinic."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: >-
            `consent_active`: a consent of the kind with the clinic is active already; `profile_required`: the
            patient has no profile yet.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /consents/{id}/revoke:
    post:
      operationId: revokeConsent
      summary: Revoke a consent
      description: >-
        The signed-in patient revokes their active consent. A care consent: the clinic's access to the profile
        and to every future appointment ends at once; past appointments stay, as the clinic's records, with the
        name, times and status only; the transcription consent with the clinic ends with it. A transcription
        consent: the transcription agent leaves the patient's calls with the clinic at once and joins none,
        the calls go on, nothing else changes. Patients only. Not cached. Audited, also when refused.
      tags: [consents]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The revoked consent.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Consent"}
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: "`forbidden`: a staff account; or `csrf`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: "`not_found`: no such consent of the patient."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: "`consent_inactive`: the consent is revoked already."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /me/consents:
    get:
      operationId: listMyConsents
      summary: The signed-in patient's consents
      description: >-
        Every consent of the signed-in patient, of both kinds, active and revoked, the latest granted first;
        none before the profile exists. Patients only. Not cached. Audited.
      tags: [consents]
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The consents.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConsentList"}
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: "`forbidden`: a staff account."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /practitioner-roles/{id}/specialty:
    put:
      operationId: setPractitionerRoleSpecialty
      summary: Set a practitioner role's specialty
      description: >-
        The clinic's admin sets the specialty of a role of the clinic: one of the twelve SNOMED CT codes the
        directory offers (FHIR R4 ValueSet c80-practice-codes). Patients see it when the clinic is listed.
        Send If-Match with the version the role was read at (`PractitionerRole.meta.versionId`); the answer
        carries the new version as its ETag. Audited, also when refused.
      tags: [directory]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          description: The role's version as a weak ETag, `W/"<versionId>"`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SetSpecialtyRequest"}
      responses:
        "200":
          description: The role with its specialty, at its new version.
          headers:
            ETag: {schema: {type: string}, description: 'The new version, W/"<versionId>".'}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RoleSpecialty"}
        "400":
          description: >-
            `invalid_request`: no or an unreadable If-Match, or a body that is not the request;
            `invalid_specialty`: a code that is not one of the directory's specialties.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: "`forbidden`: a member of the clinic who is not its admin; or `csrf`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: "`not_found`: no such role in the caller's clinic."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "412":
          description: "`version_conflict`: the role changed since it was read; read it again."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /specialties:
    get:
      operationId: listSpecialties
      summary: List the specialties a role can have
      description: >-
        The specialties an admin may give a practitioner role, in display order: the directory's SNOMED CT codes
        from FHIR R4 ValueSet c80-practice-codes, with the name the apps show. Fixed and public; needs no
        session. Not audited: it holds no personal data.
      tags: [directory]
      responses:
        "200":
          description: The specialties.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SpecialtyList"}
  /practitioner-roles/{id}/availability:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getAvailability
      summary: Read a practitioner role's weekly availability
      description: >-
        The role's schedule: its slot length and weekly rules, times of day in the clinic's time zone. Before
        the first edit it is empty at version 0 (no `id`, no `slotMinutes`). The practitioner reads their own
        role's, the clinic's admin any role's. The answer carries the version as its ETag. Audited, also when
        refused.
      tags: [scheduling]
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The role's availability.
          headers:
            ETag: {schema: {type: string}, description: 'The version, W/"<versionId>".'}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Availability"}
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: "`forbidden`: a member of the clinic who is neither the role's practitioner nor the admin."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: "`not_found`: no such role in the caller's clinic."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: saveAvailability
      summary: Set a practitioner role's weekly availability
      description: >-
        Sets the slot length and the weekly rules of the role; the first edit creates its schedule. Send
        If-Match with the version read (`W/"0"` before the first edit); the answer carries the new version as
        its ETag. The role's free slots for the next 28 days follow within seconds; booked slots are never
        changed. The practitioner edits their own role's, the clinic's admin any role's. Audited, also when
        refused.
      tags: [scheduling]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - name: If-Match
          in: header
          required: true
          description: The availability's version as a weak ETag, `W/"<versionId>"`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SaveAvailabilityRequest"}
      responses:
        "200":
          description: The availability at its new version.
          headers:
            ETag: {schema: {type: string}, description: 'The new version, W/"<versionId>".'}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Availability"}
        "400":
          description: >-
            `invalid_request`: no or an unreadable If-Match, or a body that is not the request;
            `invalid_slot_minutes`: a slot length outside 5 to 240 or not a multiple of 5;
            `invalid_availability`: a day outside 1 to 7, a time that is not HH:MM, an end not after its start,
            or rules that overlap on a day.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: "`forbidden`: a member of the clinic who is neither the role's practitioner nor the admin; or `csrf`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: "`not_found`: no such role in the caller's clinic."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "412":
          description: "`version_conflict`: the availability changed since it was read; read it again."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /questionnaires:
    post:
      operationId: createQuestionnaire
      summary: Create a questionnaire
      description: >-
        Creates a questionnaire of the caller's clinic as version 1, a draft (FHIR Questionnaire; reads go
        through FHIR). Staff of the clinic, practitioners and admins alike. The body is read up to 256 KiB and
        checked against docs/questionnaire/SPEC.md §2 "Item model", "Limits" and "linkIds". The answer carries
        the version as its ETag. Audited, also when refused.
      tags: [questionnaires]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SaveQuestionnaireRequest"}
      responses:
        "201":
          $ref: "#/components/responses/Questionnaire"
        "400":
          description: "`invalid_request`: a body that is not the request, or over 256 KiB."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/QuestionnaireForbidden"
        "422":
          $ref: "#/components/responses/InvalidQuestionnaire"
        "500":
          $ref: "#/components/responses/InternalError"
  /questionnaires/{id}:
    parameters:
      - $ref: "#/components/parameters/QuestionnaireID"
    put:
      operationId: updateQuestionnaire
      summary: Edit a draft
      description: >-
        Replaces the title, description and items of a draft. Send If-Match with the version read; the answer
        carries the new version as its ETag. A later version keeps each linkId's type (single and multiple
        choice count as different types). Staff of the clinic. Audited, also when refused.
      tags: [questionnaires]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SaveQuestionnaireRequest"}
      responses:
        "200":
          $ref: "#/components/responses/Questionnaire"
        "400":
          description: "`invalid_request`: no or an unreadable If-Match, or a body that is not the request, or over 256 KiB."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/QuestionnaireForbidden"
        "404":
          $ref: "#/components/responses/QuestionnaireNotFound"
        "409":
          description: "`not_draft`: the version is published and can no longer be changed."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "412":
          $ref: "#/components/responses/QuestionnaireChanged"
        "422":
          $ref: "#/components/responses/InvalidQuestionnaire"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteQuestionnaire
      summary: Discard a draft
      description: Deletes a draft. A published version is never deleted. Staff of the clinic. Audited, also when refused.
      tags: [questionnaires]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "204":
          description: The draft is deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/QuestionnaireForbidden"
        "404":
          $ref: "#/components/responses/QuestionnaireNotFound"
        "409":
          description: "`not_draft`: the version is published."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /questionnaires/{id}/publish:
    parameters:
      - $ref: "#/components/parameters/QuestionnaireID"
    post:
      operationId: publishQuestionnaire
      summary: Publish a draft
      description: >-
        Makes the draft, as it was read (If-Match), the questionnaire's active version, and retires the version
        that was active, in one transaction. A published version never changes. Staff of the clinic. Audited,
        also when refused.
      tags: [questionnaires]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          $ref: "#/components/responses/Questionnaire"
        "400":
          description: "`invalid_request`: no or an unreadable If-Match."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/QuestionnaireForbidden"
        "404":
          $ref: "#/components/responses/QuestionnaireNotFound"
        "409":
          description: "`not_draft`: the version is already published."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "412":
          $ref: "#/components/responses/QuestionnaireChanged"
        "422":
          description: >-
            `translation_incomplete`: a translation lacks some of the version's texts; `language` names the
            translation and `linkIds` the items it lacks, in document order (none when only the title is
            missing). A patient never sees a half-translated questionnaire: finish or remove it.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /questionnaires/{id}/retire:
    parameters:
      - $ref: "#/components/parameters/QuestionnaireID"
    post:
      operationId: retireQuestionnaire
      summary: Retire the active version
      description: >-
        Retires an active version: it is no longer requested, also as a role's default; requests already made
        keep it. Staff of the clinic. Audited, also when refused.
      tags: [questionnaires]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "200":
          $ref: "#/components/responses/Questionnaire"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/QuestionnaireForbidden"
        "404":
          $ref: "#/components/responses/QuestionnaireNotFound"
        "409":
          description: "`not_active`: the version is not active."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /questionnaires/{id}/revise:
    parameters:
      - $ref: "#/components/parameters/QuestionnaireID"
    post:
      operationId: reviseQuestionnaire
      summary: Edit as new version
      description: >-
        Copies an active version into the next version, a draft with the same items and linkIds. The active
        version stays active until the draft is published. Staff of the clinic. Audited, also when refused.
      tags: [questionnaires]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "201":
          $ref: "#/components/responses/Questionnaire"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/QuestionnaireForbidden"
        "404":
          $ref: "#/components/responses/QuestionnaireNotFound"
        "409":
          description: "`not_active`: the version is not active; `draft_exists`: the questionnaire already has a draft."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /practitioner-roles/{id}/questionnaire:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getRoleQuestionnaire
      summary: Read a practitioner role's default questionnaire
      description: >-
        The questionnaire requested with every booking with the role, as its canonical url (its active version
        is requested); no url while the role has none. The practitioner reads their own role's, the clinic's
        admin any role's. Audited, also when refused.
      tags: [questionnaires]
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/QuestionnaireDefault"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/QuestionnaireForbidden"
        "404":
          description: "`not_found`: no such role in the caller's clinic, or another practitioner's."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: setRoleQuestionnaire
      summary: Set a practitioner role's default questionnaire
      description: >-
        Makes the questionnaire of `questionnaireId` (any of its versions) the role's default: from now on its
        active version is requested with every booking with the role. Who may is as for the read. Audited, also
        when refused.
      tags: [questionnaires]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SetRoleQuestionnaireRequest"}
      responses:
        "200":
          $ref: "#/components/responses/QuestionnaireDefault"
        "400":
          description: "`invalid_request`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/QuestionnaireForbidden"
        "404":
          description: "`not_found`: no such role or questionnaire in the caller's clinic, or another practitioner's role."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: "`not_active`: the questionnaire has no active version."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: clearRoleQuestionnaire
      summary: Clear a practitioner role's default questionnaire
      description: Removes the role's default, if it has one. Who may is as for the read. Audited, also when refused.
      tags: [questionnaires]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "204":
          description: The role has no default.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/QuestionnaireForbidden"
        "404":
          description: "`not_found`: no such role in the caller's clinic, or another practitioner's."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /appointments:
    post:
      operationId: bookAppointment
      summary: Book a free slot
      description: >-
        The signed-in patient books a free slot of a listed clinic (FHIR Appointment, docs/booking/SPEC.md
        "Booking rules"): booked at once, the slot held in the same transaction. Needs a profile and an active
        consent with the clinic. A confirmation is e-mailed, and a reminder 24 hours before the start when that
        is ahead. Patients only. Not cached. Audited, also when refused.
      tags: [appointments]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BookAppointmentRequest"}
      responses:
        "201":
          description: The booked appointment.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Appointment"}
        "400":
          description: "`invalid_request`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: "`forbidden`: a staff account; or `csrf`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: >-
            `profile_required`: the patient has no profile yet; `consent_required`: no active consent with the
            slot's clinic (consent, then book again); `slot_unavailable`: the slot is not free, has started, or
            its clinic is not listed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /appointments/{id}/cancel:
    post:
      operationId: cancelAppointment
      summary: Cancel an appointment
      description: >-
        Cancels a booked appointment: the patient their own up to 24 hours before the start (reason `pat`), the
        appointment's practitioner and the clinic's admin at any time (reason `prov`). The slot is freed while
        its start is ahead, and the patient is e-mailed. Not cached. Audited, also when refused.
      tags: [appointments]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The cancelled appointment.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Appointment"}
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: >-
            `forbidden`: the clinic sees the appointment at the name, times and status only (a past one after a
            revocation); or `csrf`.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: "`not_found`: no such appointment the caller may see."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: >-
            `cancellation_window_closed`: a patient, less than 24 hours before the start; `appointment_closed`:
            the appointment is no longer booked.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /appointments/{id}/status:
    post:
      operationId: setAppointmentStatus
      summary: Mark an appointment fulfilled or no-show
      description: >-
        The appointment's practitioner marks it `fulfilled` or `noshow` once its start has passed, once. Not
        cached. Audited, also when refused.
      tags: [appointments]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SetAppointmentStatusRequest"}
      responses:
        "200":
          description: The appointment in its new status.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Appointment"}
        "400":
          description: "`invalid_request`; `invalid_status`: a status other than fulfilled and noshow."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: >-
            `forbidden`: a patient or an admin; the clinic sees the appointment at the name, times and status
            only; or `csrf`.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: "`not_found`: no such appointment of the practitioner."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: >-
            `appointment_not_started`: the start has not passed; `appointment_closed`: the appointment is no
            longer booked.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /appointments/{id}/consultation:
    get:
      operationId: getConsultation
      summary: Where an appointment's video consultation stands
      description: >-
        The state of the consultation (`not_started` before anyone asked for a token, `open` while its room
        exists, `ended`), when the patient and the practitioner first joined, when and why it ended, and why the
        patient was removed. For the appointment's patient, its practitioner and the clinic's admin, as they may
        see the appointment (after a revocation, a past one too); and for its practitioner once they joined the
        room, also after a revocation hid the appointment from the clinic. The clients read `reason` when the
        other side leaves or the room closes. Not cached. Audited as a read of the appointment, also when
        refused.
      tags: [consultation]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppointmentID"
      responses:
        "200":
          description: The consultation's state.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConsultationStatus"}
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: "`not_found`: no such appointment the caller may see."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /appointments/{id}/consultation/join:
    post:
      operationId: joinConsultation
      summary: A token to join an appointment's video consultation
      description: >-
        A LiveKit join token for the appointment's room, to its patient or to its practitioner only, while the
        appointment is booked, the patient's consent with the clinic is active, and the join window is open
        (10 minutes before the start to 30 minutes after the end). The token grants that one room, camera and
        microphone, for 5 minutes. The first request creates the room. `peerName` is the other person's name:
        the practitioner's public name for the patient, the patient's name for the practitioner (a read of the
        patient, audited). Not cached. Audited, also when refused.
      tags: [consultation]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/AppointmentID"
      responses:
        "200":
          description: The token and what the client needs with it.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConsultationJoin"}
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          description: >-
            `not_found`: no such appointment, or the caller is not its patient or its practitioner (the clinic's
            admin included).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: >-
            `consent_required`: the patient's consent with the clinic is not active; `join_window_not_open`: more
            than 10 minutes before the start; `consultation_ended`: the consultation ended, the window closed, or
            the appointment is no longer booked; `practitioner_did_not_join`: the consultation ended because the
            practitioner never joined.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /appointments/{id}/consultation/end:
    post:
      operationId: endConsultation
      summary: End an appointment's video consultation
      description: >-
        The appointment's practitioner ends the consultation once they joined (also after the patient revoked
        the consent): the room is closed for both, the Encounter finishes and the appointment becomes
        `fulfilled`, or `noshow` if the patient never joined (unless it was marked by hand). Repeated, it
        answers 200 again. Not cached. Audited, also when refused.
      tags: [consultation]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/AppointmentID"
      responses:
        "200":
          description: The ended consultation.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConsultationStatus"}
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          description: "`not_found`: no such appointment, or the caller is not its practitioner."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: "`consultation_not_started`: the practitioner has not joined the consultation."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /appointments/{id}/questionnaires:
    post:
      operationId: requestQuestionnaire
      summary: Ask the patient to fill in a questionnaire
      description: >-
        The appointment's practitioner asks the patient to fill in an active questionnaire of the clinic before
        the appointment starts (FHIR QuestionnaireResponse, in progress, no answers; reads go through FHIR).
        The appointment must be booked and not started, and the patient's consent with the clinic active. Not
        cached. Audited, also when refused.
      tags: [questionnaires]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/AppointmentID"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RequestQuestionnaireRequest"}
      responses:
        "201":
          $ref: "#/components/responses/QuestionnaireResponse"
        "400":
          description: "`invalid_request`: a body that is not the request."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          description: "`not_found`: no such appointment or questionnaire, or the caller is not the appointment's practitioner."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: >-
            `already_requested`: the appointment has a request of that questionnaire (a withdrawn one may be
            requested again); `not_active`: the version is a draft or retired; `appointment_started`: the
            appointment has started; `appointment_closed`: it is no longer booked; `consent_required`: the
            patient's consent with the clinic is not active.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /questionnaire-responses/{id}/start:
    parameters:
      - $ref: "#/components/parameters/QuestionnaireResponseID"
    post:
      operationId: startQuestionnaire
      summary: Choose the language to answer in
      description: >-
        The patient starts their questionnaire in a language it has: its original language or one of its
        complete translations (docs/i18n/SPEC.md §3 "The patient's language"). The language may be chosen
        again until the first answer is saved, not after. The appointment's practitioner reads the questions
        in it. Not cached. Audited, also when refused.
      tags: [questionnaires]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StartQuestionnaireRequest"}
      responses:
        "200":
          $ref: "#/components/responses/QuestionnaireResponse"
        "400":
          description: "`invalid_request`: a body that is not the request (a tag outside the list included)."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AnswersForbidden"
        "404":
          $ref: "#/components/responses/QuestionnaireResponseNotFound"
        "409":
          description: >-
            `language_locked`: an answer or a file is saved, so the language stays; and the answers' `submitted`,
            `withdrawn`, `appointment_closed`, `past_due`, `consent_required`.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422":
          description: "`language_unavailable`: the questionnaire is neither written nor completely translated in it."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /encounters/{id}/events:
    get:
      operationId: followConsultationEvents
      summary: The consultation's live events, over a WebSocket
      description: >-
        A WebSocket (RFC 6455) upgrade: the encounter's Redis Stream, live, to the encounter's practitioner only,
        with the patient's active consent (not the clinic's admin, not the patient). Every entry of the stream
        is sent as two text frames: a `cursor` message with the entry's stream id, then the entry's message
        (`ConsultMessage`) exactly as its producer wrote it; together they are `ConsultFrame`. A client keeps the
        id of a cursor once the message after it has arrived, and on reconnecting passes it as `after`: it gets
        every entry after that one, in order, then the live ones, with no gap and no duplicate. Without `after`
        it gets every entry still on the stream (the stream is capped and expires after the encounter; the
        stored transcript is `GET /encounters/{id}/transcript`). The handshake must come from the API's own
        origin, or carry no Origin (no browser). Access is checked again after every read of the stream: when
        it ends (a revocation, a cancellation) nothing more is sent and the socket closes within a second, with
        code 4403 and reason `consent_required` or `forbidden`, or 4404 `not_found`; 1011 on a server error.
        Each subscription is audited as an operation on the encounter, also when refused. The client may send
        text frames of `ConsultCommand` (at most 512 bytes; a longer frame ends the socket): a
        `suggestion_status` message dismisses, pins or unpins a suggestion of the encounter, under the same rule,
        audited, refusals included. It is answered with nothing on success (the suggestion with its new status
        comes on the stream, to every open view), and with a `command_error` frame otherwise.
      tags: [consultation]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EncounterID"
        - name: after
          in: query
          required: false
          description: The stream id of the last entry received (`<milliseconds>-<sequence>`), or `0` for all.
          schema:
            type: string
            pattern: "^(0|[0-9]+-[0-9]+)$"
      responses:
        "101":
          description: >-
            Switching protocols: the WebSocket, carrying `ConsultFrame` text frames.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConsultFrame"}
        "400":
          description: "`websocket_required`: no WebSocket handshake; `invalid_cursor`: `after` is no stream id."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: >-
            `origin`: the handshake comes from another origin; `consent_required`: the encounter's practitioner
            after the patient revoked their consent; `forbidden`: anyone else who sees the encounter.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: "`not_found`: no such encounter the caller may see."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /encounters/{id}/transcript:
    get:
      operationId: exportTranscript
      summary: The consultation's stored transcript
      description: >-
        Every final segment of the encounter's transcript, in the order it was said, with its translation, as
        `TranscriptEvent`s (`is_final` true). For the encounter's practitioner with the patient's active consent,
        and for the encounter's patient (their copy, whatever the consent) while the clinic shares transcripts
        with its patients (the Organization's organization-patient-transcript-copy extension, off by default).
        Not cached. Audited as a read with the number of segments, also when refused.
      tags: [consultation]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EncounterID"
      responses:
        "200":
          description: The transcript.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Transcript"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: >-
            `consent_required`: the encounter's practitioner after the patient revoked their consent;
            `forbidden`: the patient while the clinic does not share transcripts, and anyone else who sees the
            encounter.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: "`not_found`: no such encounter the caller may see."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /document-templates:
    get:
      operationId: listDocumentTemplates
      summary: The clinic's document templates
      description: >-
        The caller's clinic's templates (a referral, a findings report), by title, with their translations. Staff
        of the clinic, practitioners and admins alike. Not audited: a template holds no personal data.
      tags: [documents]
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The templates.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DocumentTemplates"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/DocumentForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createDocumentTemplate
      summary: Create a document template
      description: >-
        Creates a template of the caller's clinic as version 1. Staff of the clinic. A translation must be
        complete: its title, every field's label, and an instruction exactly where the original has one. Any
        language of the enum but Arabic, whose script the PDF does not set yet. The answer carries the version as
        its ETag. Audited, also when refused.
      tags: [documents]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SaveDocumentTemplateRequest"}
      responses:
        "201":
          $ref: "#/components/responses/DocumentTemplate"
        "400":
          $ref: "#/components/responses/DocumentInvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/DocumentForbidden"
        "422":
          $ref: "#/components/responses/InvalidDocumentTemplate"
        "500":
          $ref: "#/components/responses/InternalError"
  /document-templates/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      operationId: updateDocumentTemplate
      summary: Edit a document template
      description: >-
        Replaces the template's content and translations as its next version. Send If-Match with the version
        read. Drafts keep the texts they were drafted with. Staff of the clinic. Audited, also when refused.
      tags: [documents]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SaveDocumentTemplateRequest"}
      responses:
        "200":
          $ref: "#/components/responses/DocumentTemplate"
        "400":
          $ref: "#/components/responses/DocumentInvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/DocumentForbidden"
        "404":
          description: "`template_not_found`: the clinic has no such template."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "412":
          description: "`version_mismatch`: the template changed since it was read."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422":
          $ref: "#/components/responses/InvalidDocumentTemplate"
        "500":
          $ref: "#/components/responses/InternalError"
  /encounters/{id}/drafts:
    parameters:
      - $ref: "#/components/parameters/EncounterID"
    post:
      operationId: generateDraft
      summary: Draft a document from the transcript
      description: >-
        Drafts (or redrafts) a template from the encounter's stored transcript so far, during or after the call,
        and answers with the draft once it is stored; it is also pushed on the encounter's event stream as a
        `DraftMessage`. The model fills the fields, each filled field citing the transcript segments it came
        from; a value without sources, citing a segment the transcript does not have, or not of its field's type
        is not kept, and the field stays missing. A redraft replaces the open draft of the template as its next
        version. Without a transcript every field is missing. For the encounter's practitioner with the patient's
        active consent and active transcription consent only (SAL-12; checked again once the model answered).
        Audited, also when refused.
      tags: [documents]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GenerateDraftRequest"}
      responses:
        "200":
          $ref: "#/components/responses/Draft"
        "400":
          $ref: "#/components/responses/DocumentInvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: >-
            `consent_required`: the encounter's practitioner after the patient revoked their consent;
            `transcription_consent_required`: the patient has not agreed to transcription and AI assistance, or
            withdrew it, so nothing is drafted; `forbidden`: anyone else who sees the encounter.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: >-
            `not_found`: no such encounter the caller may see; `template_not_found`: the clinic has no such
            template.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422":
          description: "`language_unavailable`: the template has neither its original nor a translation in the language asked for."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: "`drafting_unavailable`: the drafting model failed or took too long; nothing was stored."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    get:
      operationId: listDrafts
      summary: The encounter's drafts
      description: >-
        Every draft of the encounter, oldest first, preliminary or final, for the encounter's practitioner with
        the patient's active consent; what a page reads when the event stream has expired. Audited, also when
        refused.
      tags: [documents]
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The drafts.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Drafts"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/DocumentRecordForbidden"
        "404":
          description: "`not_found`: no such encounter the caller may see."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /drafts/{id}/sign:
    parameters:
      - name: id
        in: path
        required: true
        description: The draft's id (FHIR Composition.id).
        schema: {type: string, format: uuid}
    post:
      operationId: signDraft
      summary: Sign a draft
      description: >-
        Signs the draft, as it was read (If-Match), with the value the practitioner left in every field: a value
        as drafted keeps its sources, an edited or typed one has none, an empty one is missing. The draft becomes
        the final FHIR Composition, attested by the encounter's practitioner; its PDF is stored encrypted as a
        DocumentReference, and a Provenance records the signature. The final draft is pushed on the event
        stream. For the encounter's practitioner with the patient's active consent only. Audited, also when
        refused.
      tags: [documents]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SignDraftRequest"}
      responses:
        "200":
          $ref: "#/components/responses/Draft"
        "400":
          $ref: "#/components/responses/DocumentInvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/DocumentRecordForbidden"
        "404":
          description: "`not_found`: no such draft the caller may see."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: "`not_preliminary`: the draft is already signed or discarded."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "412":
          description: "`version_mismatch`: the draft changed since it was read (a redraft)."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422":
          description: >-
            `invalid_values`: a value of no field, a field without or with two values, or a value not of its
            field's type; `required_missing`: a required field left empty. `keys` names the fields.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KeyedError"}
        "500":
          $ref: "#/components/responses/InternalError"
  /document-references/{id}/content:
    parameters:
      - name: id
        in: path
        required: true
        description: The signed document's FHIR DocumentReference.id.
        schema: {type: string, format: uuid}
    get:
      operationId: downloadDocument
      summary: A signed document's PDF
      description: >-
        The PDF of a signed document (the DocumentReference's attachment url), decrypted as it is sent, as a
        download. For the encounter's practitioner with the patient's active consent, and for the encounter's
        patient whatever the consent (their own record). Audited as a read of the DocumentReference, also when
        refused.
      tags: [documents]
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The PDF.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            Content-Disposition: {schema: {type: string}}
          content:
            application/pdf:
              schema: {type: string, format: binary}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/DocumentRecordForbidden"
        "404":
          description: "`not_found`: no such signed document the caller may see."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /compositions/{id}/terms:
    parameters:
      - name: id
        in: path
        required: true
        description: The document's FHIR Composition.id.
        schema: {type: string, format: uuid}
    get:
      operationId: getDocumentTerms
      summary: The explained terms of a document
      description: >-
        Where the terms with a plain-language explanation are in a document (SAL-13), per field and line, tagged in
        the language it was written in: an overlay for the tooltip, the document is never changed. Under the
        Composition's rule and audited as its read: the encounter's practitioner with the patient's active consent,
        and the encounter's patient for a signed document only.
      tags: [documents]
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The terms.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DocumentTerms"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/DocumentRecordForbidden"
        "404":
          description: "`not_found`: no such document the caller may see."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /questionnaire-responses/{id}/answers:
    parameters:
      - $ref: "#/components/parameters/QuestionnaireResponseID"
    put:
      operationId: saveQuestionnaireAnswers
      summary: Save the answers
      description: >-
        The patient replaces the saved answers of their questionnaire while it is in progress, while the
        appointment is booked and before it starts, with an active consent. Send If-Match with the version read; the answer carries the
        new version as its ETag. Each answer is checked against its item's type and limits; required questions
        and conditions are checked on submit. The body is read up to 256 KiB. Not cached. Audited, also when
        refused.
      tags: [questionnaires]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SaveAnswersRequest"}
      responses:
        "200":
          $ref: "#/components/responses/QuestionnaireResponse"
        "400":
          description: >-
            `invalid_request`: no or an unreadable If-Match, a body that is not the request (an integer outside
            32 bits included), or over 256 KiB.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AnswersForbidden"
        "404":
          $ref: "#/components/responses/QuestionnaireResponseNotFound"
        "409":
          $ref: "#/components/responses/AnswersClosed"
        "412":
          $ref: "#/components/responses/QuestionnaireResponseChanged"
        "422":
          $ref: "#/components/responses/AnswersInvalid"
        "500":
          $ref: "#/components/responses/InternalError"
  /questionnaire-responses/{id}/submit:
    parameters:
      - $ref: "#/components/parameters/QuestionnaireResponseID"
    post:
      operationId: submitQuestionnaireAnswers
      summary: Submit the answers
      description: >-
        The patient submits the saved answers, as they were read (If-Match): every shown required question
        must be answered (a shown required attachment item needs a file); the answers and files of hidden
        questions are removed. Final: no later change. The appointment's practitioner reads the answers from
        then on. Not cached. Audited, also when refused.
      tags: [questionnaires]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          $ref: "#/components/responses/QuestionnaireResponse"
        "400":
          description: "`invalid_request`: no or an unreadable If-Match."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AnswersForbidden"
        "404":
          $ref: "#/components/responses/QuestionnaireResponseNotFound"
        "409":
          description: >-
            `submitted`, `withdrawn`, `appointment_closed`, `past_due`, `consent_required` as for the answers;
            `attachments_pending`: a file is still being checked for malware; submit once every file is clean.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "412":
          $ref: "#/components/responses/QuestionnaireResponseChanged"
        "422":
          $ref: "#/components/responses/AnswersInvalid"
        "500":
          $ref: "#/components/responses/InternalError"
  /questionnaire-responses/{id}/withdraw:
    parameters:
      - $ref: "#/components/parameters/QuestionnaireResponseID"
    post:
      operationId: withdrawQuestionnaire
      summary: Withdraw a questionnaire request
      description: >-
        The appointment's practitioner withdraws a request the patient has not submitted: it is stopped and its
        answers are cleared at once. Not cached. Audited, also when refused.
      tags: [questionnaires]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "200":
          $ref: "#/components/responses/QuestionnaireResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`forbidden`: the caller sees the request but may not withdraw it (the patient, the clinic's admin); or `csrf`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          $ref: "#/components/responses/QuestionnaireResponseNotFound"
        "409":
          description: "`submitted`: the patient has submitted it; `withdrawn`: it is already withdrawn."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /questionnaire-responses/{id}/items/{linkId}/attachments:
    parameters:
      - $ref: "#/components/parameters/QuestionnaireResponseID"
      - $ref: "#/components/parameters/LinkID"
    post:
      operationId: uploadAttachment
      summary: Attach a file to an answer
      description: >-
        The patient attaches one file to an attachment item of their questionnaire while it is in progress,
        while the appointment is booked and before it starts, with an active consent (FHIR Binary; the answer
        is a valueAttachment). The body is the file's bytes, streamed; `Content-Length` is required. The type is
        detected from the bytes, never from `Content-Type` or the name: PDF, JPEG, PNG or MP4 (H.264 video, AAC
        audio), as the item accepts. Limits: 20 MB per photo or document, 200 MB per video, the item's
        `maxFiles`, 500 MB per response. The title is the `filename*` of `Content-Disposition` (RFC 6266), cut
        to 200 characters, the path removed; never put it in the query string. The file is encrypted, stored and
        `quarantined` until the malware scan says it is `clean` (`GET /binaries/{id}`). An upload identical to a
        file already on the item (same SHA-1 and size) returns that file with 200 and stores nothing new, so the
        app may retry the whole file. Not cached. Audited, also when refused.
      tags: [attachments]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - name: Content-Length
          in: header
          required: true
          description: The file's size in bytes.
          schema: {type: integer, format: int64, minimum: 1}
        - name: Content-Disposition
          in: header
          required: false
          description: "`attachment; filename*=UTF-8''<percent-encoded name>`, the file's name as its title."
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        "200":
          $ref: "#/components/responses/BinaryRetried"
        "201":
          $ref: "#/components/responses/Binary"
        "400":
          description: "`invalid_request`: the body ended before `Content-Length` bytes."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AnswersForbidden"
        "404":
          $ref: "#/components/responses/QuestionnaireResponseNotFound"
        "409":
          description: >-
            `submitted`, `withdrawn`, `appointment_closed`, `past_due`, `consent_required` as for the answers;
            `too_many_files`: the item already holds `maxFiles` files.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "411":
          description: "`length_required`: no `Content-Length`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "413":
          description: >-
            `too_large`: larger than the limit of the file's kind (or, before the bytes are read, of every kind
            the item accepts); `response_full`: the response's files would pass 500 MB.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "415":
          description: >-
            `unsupported_type`: the bytes are no type the item accepts, or an MP4 whose video is not H.264 or whose
            audio is not AAC.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422":
          description: "`not_attachment_item`: `linkId` is no attachment item of the response's questionnaire."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /binaries/{id}:
    parameters:
      - $ref: "#/components/parameters/BinaryID"
    get:
      operationId: getBinary
      summary: Read a file's status
      description: >-
        A file's type, size, title and scan status, for whoever may read its questionnaire response in full:
        the patient, and the appointment's practitioner once the response is submitted. The app polls it until
        the file is `clean` or `rejected`. Not cached. Audited.
      tags: [attachments]
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Binary"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/BinaryNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteBinary
      summary: Remove a file from an answer
      description: >-
        The patient removes a file from their questionnaire while they may still change its answers; the file
        is deleted. Audited, also when refused.
      tags: [attachments]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "204":
          description: The file is removed and deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AnswersForbidden"
        "404":
          $ref: "#/components/responses/BinaryNotFound"
        "409":
          $ref: "#/components/responses/AnswersClosed"
        "500":
          $ref: "#/components/responses/InternalError"
  /binaries/{id}/content:
    parameters:
      - $ref: "#/components/parameters/BinaryID"
    get:
      operationId: getBinaryContent
      summary: Download a file
      description: >-
        The file's bytes, decrypted, once the scan says it is `clean`, for whoever may read its questionnaire
        response in full. One `Range` (`bytes=a-b`, `a-` or `-n`) gives 206 with that part, so a video seeks; a
        request with several ranges gets the whole file. Shown inline, never sniffed, never cached. Every
        request is audited, ranges included.
      tags: [attachments]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: Range
          in: header
          required: false
          description: One byte range, `bytes=<first>-<last>`, `bytes=<first>-` or `bytes=-<suffix length>`.
          schema: {type: string}
      responses:
        "200":
          $ref: "#/components/responses/BinaryContent"
        "206":
          $ref: "#/components/responses/BinaryContent"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: "`not_found`: no such file, a rejected one, or the caller may not read it."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: "`scanning`: the file is still being checked; try again later."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "416":
          description: "`range_not_satisfiable`: the range starts past the end of the file."
          headers:
            Content-Range: {schema: {type: string}, description: "`bytes */<size>`."}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /terminology/search:
    get:
      operationId: searchTerminology
      summary: Search the medical terminology
      description: >-
        The cheatsheet's search (docs/terminology/SPEC.md §3 "API and UI"). Matches q against every label of every
        term in every language, case and accents aside: an exact label first, then a label that starts with q,
        then a word within trigram distance (later words of a label, misspellings), then the more common term.
        Each match carries its labels in the requested languages. Staff only (practitioners and admins). Not
        audited: it reads no patient data. The search text is never logged or stored, and no error repeats it.
      tags: [terminology]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          description: The search text, 1 to 100 characters.
          schema: {type: string, minLength: 1, maxLength: 100}
        - name: languages
          in: query
          required: false
          description: >-
            The languages whose labels come back, in the order the client shows them. Default: la, the caller's
            UI language, en.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 11
            uniqueItems: true
            items: {$ref: "#/components/schemas/TermLanguage"}
        - name: category
          in: query
          required: false
          description: Only terms of this category; any when absent.
          schema: {$ref: "#/components/schemas/TermCategory"}
        - name: limit
          in: query
          required: false
          description: How many terms at most.
          schema: {type: integer, format: int32, minimum: 1, maximum: 25, default: 10}
      responses:
        "200":
          description: The matching terms, best first; an empty list when none match.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TermList"}
        "400":
          description: "`invalid_request`: q missing, blank or longer than 100 characters, or an unknown language, category or limit."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: "`forbidden`: the caller is not staff of a clinic (a patient)."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /terminology/explanations:
    get:
      operationId: getTermExplanations
      summary: The plain-language explanations of the terms
      description: >-
        Every term's plain-language explanation in the viewer's language, else in English (SAL-13,
        docs/terminology/SPEC.md §3 "Explanations"), for the tooltip on the terms that transcripts and documents
        mark (TermSpan). For any signed-in account, a patient's too. Reference data: no patient data is sent or
        read, nothing is audited, and the browser may cache it for five minutes. An explanation that needs changes
        is left out.
      tags: [terminology]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: language
          in: query
          required: true
          description: The viewer's language, an app language (not Latin).
          schema: {$ref: "#/components/schemas/TermLanguage"}
      responses:
        "200":
          description: The explanations.
          headers:
            Cache-Control: {schema: {type: string, const: "private, max-age=300"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExplainedTermList"}
        "400":
          description: "`invalid_request`: no language, Latin or a language the app does not have."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /terminology/review:
    get:
      operationId: listTermReview
      summary: The review queue of the medical terms in one language
      description: >-
        The review panel's queue (docs/terminology/SPEC.md §3 "Review"): one entry per term in the language, with
        the term's labels in that language, Latin and English, the review of those labels (the translation) and the
        term's explanation in that language. An entry's status is `needs_changes` when its translation or its
        explanation needs changes, else `unreviewed` when the term has no label in the language yet or either is
        unreviewed, else `approved` (an explanation that does not exist yet does not count). Entries that need
        changes first, then the unreviewed ones, then the approved ones, each the more common term first. Every staff
        member reads; only a reviewer writes. Not audited: reference data, no patient data.
      tags: [terminology]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: language
          in: query
          required: true
          schema: {$ref: "#/components/schemas/TermLanguage"}
        - name: status
          in: query
          required: false
          description: Only entries with this status; any when absent.
          schema: {$ref: "#/components/schemas/ReviewStatus"}
        - name: after
          in: query
          required: false
          description: The `next` of the page before; the first page when absent.
          schema: {type: string, maxLength: 200}
        - name: limit
          in: query
          required: false
          schema: {type: integer, format: int32, minimum: 1, maximum: 100, default: 25}
      responses:
        "200":
          description: The page of the queue.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TermReviewPage"}
        "400":
          description: "`invalid_request`: a missing or unknown language, an unknown status, a limit outside 1 to 100 or an unreadable `after`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`forbidden`: the caller is not staff of a clinic (a patient)."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /terminology/review/progress:
    get:
      operationId: getTermReviewProgress
      summary: How far the review is in each language
      description: >-
        Per term language, how many terms there are and how many of their entries in that language are approved
        or need changes (statuses as in listTermReview). Staff only. Not audited.
      tags: [terminology]
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: One row per language, in the enum's order.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TermReviewProgress"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`forbidden`: the caller is not staff of a clinic (a patient)."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /terminology/terms/{id}/translations/{language}:
    parameters:
      - $ref: "#/components/parameters/TermID"
      - name: language
        in: path
        required: true
        schema: {$ref: "#/components/schemas/TermLanguage"}
    put:
      operationId: editTermTranslation
      summary: Edit a term's labels in one language
      description: >-
        Replaces the term's preferred label and synonyms in the language. If-Match is the translation's version
        read, `W/"0"` when the term has no label in the language yet. A change sets the translation to `unreviewed`,
        an approved one included, and keeps its last review; the same labels again change nothing. The term's own
        status follows its translations (docs/terminology/SPEC.md §3 "Review"). Reviewers only. Audited.
      tags: [terminology]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TermLabelsEdit"}
      responses:
        "200":
          description: The translation as stored.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TermTranslation"}
        "400":
          description: "`invalid_request`: no or an unreadable If-Match, or labels that are blank, repeated, longer than 300 characters, hold `|` or are more than 20."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`forbidden`: the caller is not a reviewer; `csrf`: a write with the session cookie and no `X-Salus-CSRF: 1`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: "`not_found`: no such term."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "412":
          description: "`version_conflict`: the translation changed since it was read."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /terminology/terms/{id}/translations/{language}/review:
    parameters:
      - $ref: "#/components/parameters/TermID"
      - name: language
        in: path
        required: true
        schema: {$ref: "#/components/schemas/TermLanguage"}
    post:
      operationId: reviewTermTranslation
      summary: Approve a term's labels in one language, or mark them as needing changes
      description: >-
        Sets the translation's status with the reviewer as `reviewedBy`, now as `reviewedAt` and the note (needed
        for `needs_changes`, optional for `approved`, cleared when absent). If-Match is the version read. Reviewers
        only. Audited.
      tags: [terminology]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReviewDecision"}
      responses:
        "200":
          description: The translation as stored.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TermTranslation"}
        "400":
          description: "`invalid_request`: no or an unreadable If-Match, a status other than approved or needs_changes, or a note longer than 500 characters."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`forbidden`: the caller is not a reviewer; `csrf`: a write with the session cookie and no `X-Salus-CSRF: 1`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: "`not_found`: no such term, or it has no label in the language."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "412":
          description: "`version_conflict`: the translation changed since it was read."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422":
          description: "`note_required`: needs_changes without a note."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /terminology/terms/{id}/explanations/{language}:
    parameters:
      - $ref: "#/components/parameters/TermID"
      - name: language
        in: path
        required: true
        schema: {$ref: "#/components/schemas/Language"}
    put:
      operationId: writeTermExplanation
      summary: Write a term's explanation in one language
      description: >-
        Writes the plain-language explanation, trimmed, 1 to 500 characters. If-Match is the explanation's version
        read, `W/"0"` when there is none yet. A new or changed explanation is `unreviewed`, an approved one
        included, and keeps its last review; the same text again changes nothing. Reviewers only. Audited.
      tags: [terminology]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TermExplanationEdit"}
      responses:
        "200":
          description: The explanation as stored.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TermExplanation"}
        "400":
          description: "`invalid_request`: no or an unreadable If-Match, or a text that is blank or longer than 500 characters."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`forbidden`: the caller is not a reviewer; `csrf`: a write with the session cookie and no `X-Salus-CSRF: 1`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: "`not_found`: no such term."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "412":
          description: "`version_conflict`: the explanation changed since it was read."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /terminology/terms/{id}/explanations/{language}/review:
    parameters:
      - $ref: "#/components/parameters/TermID"
      - name: language
        in: path
        required: true
        schema: {$ref: "#/components/schemas/Language"}
    post:
      operationId: reviewTermExplanation
      summary: Approve a term's explanation, or mark it as needing changes
      description: >-
        As reviewTermTranslation, for the explanation in the language. Reviewers only. Audited.
      tags: [terminology]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReviewDecision"}
      responses:
        "200":
          description: The explanation as stored.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TermExplanation"}
        "400":
          description: "`invalid_request`: no or an unreadable If-Match, a status other than approved or needs_changes, or a note longer than 500 characters."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`forbidden`: the caller is not a reviewer; `csrf`: a write with the session cookie and no `X-Salus-CSRF: 1`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: "`not_found`: no such term, or it has no explanation in the language."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "412":
          description: "`version_conflict`: the explanation changed since it was read."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422":
          description: "`note_required`: needs_changes without a note."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /webhooks/livekit:
    post:
      operationId: receiveLiveKitWebhook
      summary: LiveKit's webhook
      description: >-
        Called only by our LiveKit server, never by the clients. No session and no CSRF header: the
        `Authorization` header is LiveKit's JWT, signed with the API key pair and carrying the body's SHA-256,
        verified before the body is read. The body is read up to 64 KiB. Handled idempotently and in any
        order: a participant's join is recorded (the practitioner's first one starts the Encounter; a patient
        whose access has gone is removed from the room), and once the join window has closed the last one
        leaving ends the consultation. Every other event, and one for a room we do not know, has no effect.
      tags: [consultation]
      security:
        - livekitWebhook: []
      requestBody:
        required: true
        content:
          application/webhook+json:
            schema: {$ref: "#/components/schemas/LiveKitWebhookEvent"}
      responses:
        "200":
          description: Handled, also when it had no effect.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WebhookReceived"}
        "400":
          description: "`invalid_request`: a body over 64 KiB."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          description: "`unauthenticated`: a missing, expired or wrong signature, or one for another body."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
components:
  parameters:
    CSRF:
      name: X-Salus-CSRF
      in: header
      required: false
      description: >-
        Sent as `1` by the web app on every write. Required with the session cookie on POST, PUT, PATCH and
        DELETE (403 `csrf` without it). On the login steps it asks for the session in the cookie instead of
        the body.
      schema:
        type: string
        const: "1"
    QuestionnaireID:
      name: id
      in: path
      required: true
      description: The version's id (FHIR Questionnaire.id).
      schema:
        type: string
        format: uuid
    QuestionnaireResponseID:
      name: id
      in: path
      required: true
      description: The response's id (FHIR QuestionnaireResponse.id).
      schema:
        type: string
        format: uuid
    LinkID:
      name: linkId
      in: path
      required: true
      description: The attachment item's linkId.
      schema:
        type: string
        pattern: "^[A-Za-z0-9-]{1,64}$"
    BinaryID:
      name: id
      in: path
      required: true
      description: The file's id (FHIR Binary.id).
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The version read, as a weak ETag, `W/"<versionId>"`.
      schema:
        type: string
    TermID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    AppointmentID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EncounterID:
      name: id
      in: path
      required: true
      description: The encounter's id (FHIR Encounter.id).
      schema:
        type: string
        format: uuid
  responses:
    DocumentTemplate:
      description: The template; its ETag is its version.
      headers:
        ETag: {schema: {type: string}}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/DocumentTemplate"}
    Draft:
      description: The draft; its ETag is its version.
      headers:
        ETag: {schema: {type: string}}
        Cache-Control: {schema: {type: string, const: no-store}}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/DraftEvent"}
    DocumentInvalidRequest:
      description: "`invalid_request`: no or an unreadable If-Match where one is needed, or a body that is not the request, or over 1 MiB."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    DocumentForbidden:
      description: "`forbidden`: a patient."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    DocumentRecordForbidden:
      description: >-
        `consent_required`: the encounter's practitioner after the patient revoked their consent; `forbidden`:
        anyone else who sees the encounter.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    InvalidDocumentTemplate:
      description: "`invalid_template`: the template breaks a rule; `keys` names the offending fields (none for the template as a whole)."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/KeyedError"}
    Unauthenticated:
      description: "`unauthenticated`: no valid session."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Questionnaire:
      description: The questionnaire's version.
      headers:
        ETag: {schema: {type: string}, description: 'The version, W/"<versionId>".'}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Questionnaire"}
    QuestionnaireDefault:
      description: The role's default questionnaire.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/QuestionnaireDefault"}
    QuestionnaireForbidden:
      description: "`forbidden`: the caller is not staff of a clinic (a patient); or `csrf`."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    QuestionnaireNotFound:
      description: "`not_found`: no such questionnaire in the caller's clinic."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    QuestionnaireChanged:
      description: "`version_conflict`: the version changed since it was read; read it again."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    InvalidQuestionnaire:
      description: >-
        `invalid_questionnaire`: the content breaks a rule of docs/questionnaire/SPEC.md §2 "Item model",
        "Limits" or "linkIds"; `linkIds` names the offending items (none when the title, the description, the
        number of items or a malformed linkId is at fault).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    QuestionnaireResponse:
      description: The questionnaire request and its answers.
      headers:
        ETag: {schema: {type: string}, description: 'The version, W/"<versionId>".'}
        Cache-Control: {schema: {type: string, const: no-store}}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/QuestionnaireResponse"}
    QuestionnaireResponseNotFound:
      description: "`not_found`: no such questionnaire request, or the caller may not see it."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    QuestionnaireResponseChanged:
      description: "`version_conflict`: the answers changed since they were read; read them again."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    AnswersForbidden:
      description: "`forbidden`: the caller sees the request but is not its patient (staff); or `csrf`."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    AnswersClosed:
      description: >-
        `submitted`: already submitted; `withdrawn`: the practitioner withdrew it; `appointment_closed`: the
        appointment is no longer booked (cancelled); `past_due`: the appointment has started;
        `consent_required`: the patient's consent with the clinic is not active.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    AnswersInvalid:
      description: >-
        `answers_invalid`: an answer does not fit its item's type or limits (docs/questionnaire/SPEC.md §2
        "Limits"), an answer is given to an attachment item (files go through
        `/questionnaire-responses/{id}/items/{linkId}/attachments`), or, on submit, a shown required question
        is unanswered; `linkIds` names them in document order (an answer to no item of the questionnaire is
        refused without being named).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Binary:
      description: The file, as stored.
      headers:
        Cache-Control: {schema: {type: string, const: no-store}}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Binary"}
    BinaryRetried:
      description: An identical file the item already holds; nothing new was stored.
      headers:
        Cache-Control: {schema: {type: string, const: no-store}}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Binary"}
    BinaryNotFound:
      description: "`not_found`: no such file, or the caller may not see it."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    BinaryContent:
      description: >-
        The whole file (200) or the requested range (206), in the type detected on upload. Served with
        `X-Content-Type-Options: nosniff`, `Cross-Origin-Resource-Policy: same-origin`, `Content-Disposition:
        inline` with the title as `filename*`, and `Content-Security-Policy: default-src 'none'`.
      headers:
        Content-Length: {schema: {type: integer, format: int64}}
        Content-Range: {schema: {type: string}, description: "206 only: `bytes <first>-<last>/<size>`."}
        Accept-Ranges: {schema: {type: string, const: bytes}}
        ETag: {schema: {type: string}, description: "The file's SHA-1, a strong ETag."}
        Cache-Control: {schema: {type: string, const: "private, no-store"}}
      content:
        application/pdf:
          schema: {type: string, format: binary}
        image/jpeg:
          schema: {type: string, format: binary}
        image/png:
          schema: {type: string, format: binary}
        video/mp4:
          schema: {type: string, format: binary}
    LoginStep:
      description: >-
        The next step (`verify` or `enrol`, with the challenge), or `done` with the session: in the
        `salus_session` cookie (HttpOnly, Secure, SameSite=Strict) when `X-Salus-CSRF: 1` was sent, else as
        `token`. Not cached.
      headers:
        Cache-Control: {schema: {type: string, const: no-store}}
        Set-Cookie: {schema: {type: string}, description: "salus_session, for the web app"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/LoginResponse"}
    RateLimited:
      description: "`rate_limited`: too many attempts; the password was not checked."
      headers:
        Retry-After: {schema: {type: integer}, description: Seconds until the window ends.}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    CSRF:
      description: "`csrf`: a write with the session cookie and no `X-Salus-CSRF: 1`."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    InternalError:
      description: "`internal error`."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: salus_session
      description: The web app's session (HttpOnly, Secure, SameSite=Strict).
    bearerAuth:
      type: http
      scheme: bearer
      description: The mobile app's session token.
    livekitWebhook:
      type: apiKey
      in: header
      name: Authorization
      description: LiveKit's webhook signature, a JWT of the API key pair with the body's SHA-256 (no Bearer prefix).
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
        password:
          type: string
        language:
          $ref: "#/components/schemas/Language"
          description: The language the user picked on the device before signing in; saved as their choice.
        detectedLanguage:
          $ref: "#/components/schemas/Language"
          description: >-
            The language the client matched from the browser's or the device's languages; saved for e-mails
            while the user has no choice of their own.
    LoginResponse:
      type: object
      required: [next]
      properties:
        next:
          type: string
          enum: [done, verify, enrol]
        challenge:
          type: string
          description: For `verify` and `enrol`; valid 5 minutes.
        token:
          type: string
          description: "The session token, for `done` without `X-Salus-CSRF`; send it as `Authorization: Bearer <token>`."
        expiresAt:
          type: string
          format: date-time
          description: For `done`. Absolute; 12 hours for staff, 30 days for patients.
    EnrolRequest:
      type: object
      additionalProperties: false
      properties:
        challenge:
          type: string
          description: The login challenge; omitted when enrolling from a session.
    Enrolment:
      type: object
      required: [secret, uri]
      properties:
        secret:
          type: string
          description: Base32, for manual entry.
        uri:
          type: string
          description: The otpauth:// URI, for a QR code.
    ConfirmRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        challenge:
          type: string
          description: The login challenge; omitted when enrolling from a session.
        code:
          type: string
          description: Six digits from the authenticator app.
    VerifyRequest:
      type: object
      required: [challenge, code]
      additionalProperties: false
      properties:
        challenge:
          type: string
        code:
          type: string
          description: Six digits from the authenticator app.
    RegisterRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: Counted in characters, not bytes.
        language:
          $ref: "#/components/schemas/Language"
          description: The language the user picked on the device before signing in; saved as their choice.
        detectedLanguage:
          $ref: "#/components/schemas/Language"
          description: >-
            The language the client matched from the browser's or the device's languages; saved for e-mails
            while the user has no choice of their own.
    InviteRequest:
      type: object
      required: [email, role]
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 254
        role:
          type: string
          enum: [admin, practitioner]
        givenName:
          type: string
          maxLength: 200
          description: Required for a practitioner; absent for an admin.
        familyName:
          type: string
          maxLength: 200
          description: Required for a practitioner; absent for an admin.
    Invite:
      type: object
      required: [id, email, role, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [admin, practitioner]
        givenName:
          type: string
        familyName:
          type: string
        expiresAt:
          type: string
          format: date-time
    InviteList:
      type: object
      required: [invites]
      properties:
        invites:
          type: array
          items: {$ref: "#/components/schemas/Invite"}
    AcceptInviteRequest:
      type: object
      required: [token, password]
      additionalProperties: false
      properties:
        token:
          type: string
          description: From the invite link's fragment.
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: Counted in characters, not bytes.
        language:
          $ref: "#/components/schemas/Language"
          description: The language the user picked on the device before signing in; saved as their choice.
        detectedLanguage:
          $ref: "#/components/schemas/Language"
          description: >-
            The language the client matched from the browser's or the device's languages; saved for e-mails
            while the user has no choice of their own.
    Acceptance:
      type: object
      required: [challenge, secret, uri]
      properties:
        challenge:
          type: string
          description: For `/auth/mfa/confirm`; valid 5 minutes.
        secret:
          type: string
          description: Base32, for manual entry.
        uri:
          type: string
          description: The otpauth:// URI, for a QR code.
    Account:
      type: object
      required: [id, email, role, mfaEnrolled]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [admin, practitioner, patient]
        organizationId:
          type: string
          format: uuid
          description: The clinic of a staff account; absent for a patient.
        practitionerId:
          type: string
          format: uuid
          description: >-
            The directory's Practitioner of a practitioner account, for searches by practitioner; absent
            otherwise.
        mfaEnrolled:
          type: boolean
        language:
          $ref: "#/components/schemas/Language"
          description: >-
            The language the user chose; absent while they follow the browser's or the device's language,
            which the client then matches itself.
        termReviewer:
          type: boolean
          description: >-
            True for a reviewer of the medical term list, a permission only the operator grants (salusctl
            term-reviewer); absent otherwise.
    UpdateMeRequest:
      type: object
      required: [language]
      additionalProperties: false
      properties:
        language:
          description: The language chosen, or `null` to follow the browser's or the device's language again.
          oneOf:
            - $ref: "#/components/schemas/Language"
            - type: "null"
    Language:
      type: string
      enum: [bs, hr, sr-Latn, sr-Cyrl, en, de, ar, tr, it, fr]
      description: >-
        A BCP 47 tag (docs/i18n/SPEC.md §3 "Tags"). Staff accounts and a clinic's default language take only
        the staff languages, the first five: bs, hr, sr-Latn, sr-Cyrl, en. Serbian is ijekavian in both scripts.
    TermLanguage:
      type: string
      enum: [la, bs, hr, sr-Latn, sr-Cyrl, en, de, ar, tr, it, fr]
      description: A label's language (docs/terminology/SPEC.md §3 "Database"), Latin then the ten app languages.
    TermCategory:
      type: string
      enum: [anatomy, diagnosis, symptom, procedure, drug]
    TermCodes:
      type: object
      description: >-
        The codes that identify the term, each absent when it has none; several codes of one kind are joined
        with ", ". Identifiers only, from Wikidata (docs/terminology/SOURCES.md).
      properties:
        wikidata: {type: string, description: "The Wikidata item, e.g. Q9368."}
        icd10: {type: string}
        ta98: {type: string, description: Terminologia Anatomica 98.}
        atc: {type: string}
        pcs: {type: string, description: An ICD-10-PCS or ICD-9-CM procedure code.}
    TermLabels:
      type: object
      required: [language, preferred, synonyms]
      properties:
        language: {$ref: "#/components/schemas/TermLanguage"}
        preferred: {type: string, description: "The preferred label in this language; the first alphabetically when none is marked."}
        synonyms:
          type: array
          description: The other labels in this language, alphabetically; empty when there are none.
          items: {type: string}
    Term:
      type: object
      required: [id, category, reviewStatus, codes, labels]
      properties:
        id: {type: string, format: uuid}
        category: {$ref: "#/components/schemas/TermCategory"}
        reviewStatus:
          allOf: [{$ref: "#/components/schemas/ReviewStatus"}]
          description: "Anything but `approved` is marked \"Not reviewed yet\" in the UI."
        codes: {$ref: "#/components/schemas/TermCodes"}
        labels:
          type: array
          description: >-
            One entry per requested language that has a label, in the order requested. A language with no label
            is absent: gaps are never filled by machine translation.
          items: {$ref: "#/components/schemas/TermLabels"}
    ReviewStatus:
      type: string
      enum: [unreviewed, approved, needs_changes]
      description: >-
        Where a term, a translation or an explanation is in its review (docs/plans/v1-finish.md "Contract"): one
        status for all three. Editing an approved entry sets it back to `unreviewed`.
    Review:
      type: object
      required: [status]
      properties:
        status: {$ref: "#/components/schemas/ReviewStatus"}
        reviewedBy:
          type: string
          format: uuid
          description: The account that last set the status; absent when the curator's file set it or before the first review.
        reviewedAt:
          type: string
          format: date-time
          description: When it was last approved or marked as needing changes; kept when the entry goes back to unreviewed.
        note: {type: string, description: "The reviewer's note, e.g. what needs to change."}
    TermTranslation:
      type: object
      required: [termId, language, review, versionId, lastUpdated]
      description: >-
        The review of a term's labels in one language. A term and language with labels and no translation stored is
        unreviewed.
      properties:
        termId: {type: string, format: uuid}
        language: {$ref: "#/components/schemas/TermLanguage"}
        review: {$ref: "#/components/schemas/Review"}
        versionId: {type: integer, format: int32, minimum: 1, description: "For If-Match on an edit."}
        lastUpdated: {type: string, format: date-time}
    ExplainedTerm:
      type: object
      description: >-
        A term's plain-language explanation as a viewer reads it (SAL-13): informational, never a diagnosis.
        Shown with "Not reviewed yet" unless `reviewStatus` is `approved`.
      required: [termId, language, text, reviewStatus]
      properties:
        termId: {type: string, format: uuid}
        language:
          $ref: "#/components/schemas/TermLanguage"
          description: The language of `text`; English when the viewer's language has no explanation of the term.
        text: {type: string, minLength: 1, maxLength: 500}
        reviewStatus:
          type: string
          enum: [unreviewed, approved]
          description: An explanation that needs changes is not given.
    ExplainedTermList:
      type: object
      required: [explanations]
      properties:
        explanations:
          type: array
          description: One per term with an explanation in the language or in English, by term id.
          items: {$ref: "#/components/schemas/ExplainedTerm"}
    DocumentTerms:
      type: object
      required: [sections]
      properties:
        sections:
          type: array
          description: One per field, in the Composition's section order.
          items: {$ref: "#/components/schemas/DocumentTermsSection"}
    DocumentTermsSection:
      type: object
      description: >-
        The explained terms of one field: per line of its value, as the Composition's section narrative has them
        (a paragraph or a list item per line), the spans in that line; no lines for a field left empty.
      required: [key, lines]
      properties:
        key: {type: string, description: The field's template key.}
        lines:
          type: array
          items:
            type: array
            items: {$ref: "#/components/schemas/TermSpan"}
    TermExplanation:
      type: object
      required: [termId, language, text, review, versionId, lastUpdated]
      description: >-
        A short plain-language explanation of a term in an app language, for patients and staff: informational,
        never a diagnosis (CLAUDE.md "Copy"), and labelled as such wherever it is shown.
      properties:
        termId: {type: string, format: uuid}
        language: {$ref: "#/components/schemas/Language"}
        text: {type: string, minLength: 1, maxLength: 500}
        review: {$ref: "#/components/schemas/Review"}
        versionId: {type: integer, format: int32, minimum: 1, description: "For If-Match on an edit."}
        lastUpdated: {type: string, format: date-time}
    TermList:
      type: object
      required: [terms]
      properties:
        terms:
          type: array
          items: {$ref: "#/components/schemas/Term"}
    TermLabelsEdit:
      type: object
      required: [preferred, synonyms]
      additionalProperties: false
      description: A term's labels in one language, each trimmed with its white space collapsed.
      properties:
        preferred: {type: string, minLength: 1, maxLength: 300}
        synonyms:
          type: array
          maxItems: 20
          items: {type: string, minLength: 1, maxLength: 300}
    TermExplanationEdit:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: {type: string, minLength: 1, maxLength: 500}
    ReviewDecision:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [approved, needs_changes]
        note: {type: string, maxLength: 500, description: "Needed with needs_changes: what has to change."}
    TermReviewEntry:
      type: object
      required: [term, status]
      description: >-
        A term in the queue's language: the term with its labels in that language (first, when it has any), Latin
        and English, the review of its labels in the language (absent while it has none) and its explanation there
        (absent while there is none).
      properties:
        term: {$ref: "#/components/schemas/Term"}
        status: {$ref: "#/components/schemas/ReviewStatus"}
        translation: {$ref: "#/components/schemas/TermTranslation"}
        explanation: {$ref: "#/components/schemas/TermExplanation"}
    TermReviewPage:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: {$ref: "#/components/schemas/TermReviewEntry"}
        next: {type: string, description: "Pass as `after` for the next page; absent on the last."}
    TermReviewProgress:
      type: object
      required: [languages]
      properties:
        languages:
          type: array
          items:
            type: object
            required: [language, terms, approved, needsChanges]
            properties:
              language: {$ref: "#/components/schemas/TermLanguage"}
              terms: {type: integer, format: int32, description: Every term.}
              approved: {type: integer, format: int32}
              needsChanges: {type: integer, format: int32}
    Patient:
      type: object
      required: [id, givenName, familyName, birthDate, versionId, lastUpdated]
      description: The patient's profile (docs/booking/SPEC.md "Profile"). Health data.
      properties:
        id:
          type: string
          format: uuid
        givenName:
          type: string
        familyName:
          type: string
        birthDate:
          type: string
          format: date
        phone:
          type: string
          description: E.164; absent when none was given.
        versionId:
          type: integer
          format: int32
        lastUpdated:
          type: string
          format: date-time
    SavePatientRequest:
      type: object
      required: [givenName, familyName, birthDate]
      additionalProperties: false
      properties:
        givenName:
          type: string
          description: 1 to 100 characters after trimming.
        familyName:
          type: string
          description: 1 to 100 characters after trimming.
        birthDate:
          type: string
          format: date
          description: Before today (UTC), not before 1900-01-01.
        phone:
          type: string
          pattern: "^\\+[0-9]{8,15}$"
          description: Optional, E.164 (+ and 8 to 15 digits, no spaces); absent for none.
        versionId:
          type: integer
          format: int32
          minimum: 1
          description: The version being updated; absent to create the profile.
    GrantConsentRequest:
      type: object
      required: [organizationId]
      additionalProperties: false
      properties:
        organizationId:
          type: string
          format: uuid
          description: The clinic the profile and appointments are shared with.
        kind:
          $ref: "#/components/schemas/ConsentKind"
    ConsentKind:
      type: string
      enum: [care, transcription]
      default: care
      description: >-
        What the consent is for: `care`, sharing the profile and appointments with the clinic; `transcription`,
        transcription and translation of the consultations with the clinic, with AI assistance for the
        practitioner (suggestions, document drafts), used only with an active care consent (SAL-12).
    Consent:
      type: object
      required: [id, organizationId, kind, status, dateTime]
      description: >-
        A patient's consent with a clinic (FHIR Consent): to share their profile and appointments with it for
        care, or to transcription. Health data: it shows whom the patient consults.
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ConsentKind"
        status:
          type: string
          enum: [active, inactive]
        dateTime:
          type: string
          format: date-time
          description: When it was granted.
        revokedAt:
          type: string
          format: date-time
          description: When it was revoked; absent while active.
    ConsentList:
      type: object
      required: [consents]
      properties:
        consents:
          type: array
          items: {$ref: "#/components/schemas/Consent"}
    AvailabilityRule:
      type: object
      required: [day, start, end]
      additionalProperties: false
      description: One weekly window, in the clinic's time zone.
      properties:
        day:
          type: integer
          minimum: 1
          maximum: 7
          description: ISO weekday, 1 Monday to 7 Sunday.
        start:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          examples: ["09:00"]
        end:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: After start.
          examples: ["12:00"]
    Availability:
      type: object
      required: [practitionerRoleId, availability, versionId]
      properties:
        id:
          type: string
          format: uuid
          description: The schedule's id (FHIR Schedule); absent before the first edit.
        practitionerRoleId:
          type: string
          format: uuid
        slotMinutes:
          type: integer
          format: int32
          description: Absent before the first edit.
        availability:
          type: array
          items: {$ref: "#/components/schemas/AvailabilityRule"}
          description: Sorted by day and start.
        versionId:
          type: integer
          format: int32
          description: 0 before the first edit.
    SaveAvailabilityRequest:
      type: object
      required: [slotMinutes, availability]
      additionalProperties: false
      properties:
        slotMinutes:
          type: integer
          format: int32
          minimum: 5
          maximum: 240
          multipleOf: 5
        availability:
          type: array
          items: {$ref: "#/components/schemas/AvailabilityRule"}
    SetSpecialtyRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          description: A SNOMED CT code, one of the directory's twelve specialties.
          examples: ["394579002"]
    Specialty:
      type: object
      required: [system, code, display, text]
      description: A practitioner role's specialty, a coding from FHIR R4 ValueSet c80-practice-codes.
      properties:
        system:
          type: string
          const: http://snomed.info/sct
        code:
          type: string
        display:
          type: string
          description: The concept's display in the value set.
        text:
          type: string
          description: The name the apps show.
    SpecialtyList:
      type: object
      required: [specialties]
      properties:
        specialties:
          type: array
          items: {$ref: "#/components/schemas/Specialty"}
    RoleSpecialty:
      type: object
      required: [id, versionId]
      properties:
        id:
          type: string
          format: uuid
        specialty:
          $ref: "#/components/schemas/Specialty"
        versionId:
          type: integer
          format: int32
    BookAppointmentRequest:
      type: object
      required: [slotId]
      additionalProperties: false
      properties:
        slotId:
          type: string
          format: uuid
          description: A free slot, as Slot?schedule=…&status=free gives it.
    SetAppointmentStatusRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [fulfilled, noshow]
    Appointment:
      type: object
      required: [id, organizationId, practitionerRoleId, slotId, start, end, status, versionId]
      description: >-
        An appointment after a booking or a change (FHIR Appointment; reads go through FHIR). Health data: it
        shows whom the patient consults. Neither the patient nor who cancelled is in it.
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        practitionerRoleId:
          type: string
          format: uuid
        slotId:
          type: string
          format: uuid
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        status:
          type: string
          enum: [booked, cancelled, fulfilled, noshow]
        cancellationReason:
          type: string
          enum: [pat, prov]
          description: >-
            http://terminology.hl7.org/CodeSystem/appointment-cancellation-reason: `pat` the patient (also by
            revoking consent), `prov` staff. Absent unless cancelled.
        cancelledAt:
          type: string
          format: date-time
          description: Absent unless cancelled.
        versionId:
          type: integer
          format: int32
    SaveQuestionnaireRequest:
      type: object
      required: [title, item]
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 200
          description: Not blank.
        description:
          type: string
          maxLength: 1000
        item:
          type: array
          maxItems: 200
          items: {$ref: "#/components/schemas/QuestionnaireItem"}
          description: At most 200 items in all, sections and instructions included.
        language:
          $ref: "#/components/schemas/Language"
          description: The original language; absent keeps the draft's (a new questionnaire's is the clinic's default language).
        translations:
          type: array
          items: {$ref: "#/components/schemas/QuestionnaireTranslation"}
          description: >-
            The draft's translations, all of them: one per language, none in the original language. A
            translation may be incomplete while the version is a draft; publishing refuses it until complete.
            Absent keeps the draft's.
    QuestionnaireItem:
      type: object
      required: [linkId, text, type]
      additionalProperties: false
      description: >-
        One item, as FHIR Questionnaire.item. Sections (`group`) are top level only and hold questions and
        instructions. Single and multiple choice are both `choice`; `repeats` tells them apart.
      properties:
        linkId:
          type: string
          pattern: "^[A-Za-z0-9-]{1,64}$"
          description: Opaque and random, unique within the questionnaire, kept by later versions.
        text:
          type: string
          maxLength: 500
          description: Not blank.
        type:
          type: string
          enum: [group, display, string, text, boolean, choice, integer, decimal, date, attachment]
        required:
          type: boolean
          description: Questions only.
        repeats:
          type: boolean
          description: Choice only, several answers.
        accept:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          description: >-
            Attachment only, required: the kinds of file it accepts, `photo` (JPEG, PNG), `document` (PDF),
            `video` (MP4).
          items:
            type: string
            enum: [photo, document, video]
        maxFiles:
          type: integer
          format: int32
          minimum: 1
          maximum: 10
          description: Attachment only, required, the number of files it takes.
        help:
          type: string
          maxLength: 500
          description: Help text, on questions and sections.
        answerOption:
          type: array
          minItems: 2
          maxItems: 50
          description: Choice only, each value different.
          items:
            type: object
            required: [valueString]
            additionalProperties: false
            properties:
              valueString:
                type: string
                minLength: 1
                maxLength: 200
        enableWhen:
          type: object
          required: [question]
          additionalProperties: false
          description: >-
            Shown only when the earlier item `question`, a boolean or a choice, is answered `answerBoolean` or
            `answerString` (one of its options); a choice with repeats when any answer matches.
          properties:
            question:
              type: string
            answerBoolean:
              type: boolean
            answerString:
              type: string
        item:
          type: array
          items: {$ref: "#/components/schemas/QuestionnaireItem"}
          description: A section's questions and instructions.
    Questionnaire:
      type: object
      required: [id, url, status, title, item, lastUpdated, version, versionId]
      description: A version of a questionnaire (FHIR Questionnaire; reads go through FHIR).
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          description: The canonical url, the same for every version of the questionnaire.
          examples: ["https://salus.invalid/fhir/Questionnaire/0b6f3a0e-1d1c-4c43-9a51-6d2b9b1d5e7a"]
        status:
          type: string
          enum: [draft, active, retired]
        title:
          type: string
        description:
          type: string
        item:
          type: array
          items: {$ref: "#/components/schemas/QuestionnaireItem"}
        language:
          $ref: "#/components/schemas/Language"
          description: The original language (Questionnaire.language).
        translations:
          type: array
          items: {$ref: "#/components/schemas/QuestionnaireTranslation"}
          description: >-
            Its translations, in the language list's order. A patient reads them through FHIR, as the
            translation extension on each translated element.
        lastUpdated:
          type: string
          format: date-time
        version:
          type: integer
          format: int32
          description: 1, 2, … within the questionnaire.
        versionId:
          type: integer
          format: int32
          description: The version of this row, for If-Match.
    QuestionnaireTranslation:
      type: object
      required: [language, title, items]
      additionalProperties: false
      description: A version's texts in another language (docs/i18n/SPEC.md §3 "Questionnaires").
      properties:
        language:
          $ref: "#/components/schemas/Language"
        title:
          type: string
          maxLength: 200
          description: Empty while not yet translated.
        description:
          type: string
          maxLength: 1000
        items:
          type: object
          description: The items' texts by linkId; an item missing here is not yet translated.
          additionalProperties: {$ref: "#/components/schemas/QuestionnaireItemTranslation"}
    QuestionnaireItemTranslation:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
          description: The item's text, within its limits as in the original.
        help:
          type: string
          description: The help text; for an item that has one.
        options:
          type: array
          items: {type: string}
          description: A choice item's option texts, by the options' position; as many as the item has.
    QuestionnaireDefault:
      type: object
      required: [practitionerRoleId, versionId]
      properties:
        practitionerRoleId:
          type: string
          format: uuid
        url:
          type: string
          description: The canonical url of the default questionnaire; absent while the role has none.
        versionId:
          type: integer
          format: int32
          description: 0 while the role has none.
    SetRoleQuestionnaireRequest:
      type: object
      required: [questionnaireId]
      additionalProperties: false
      properties:
        questionnaireId:
          type: string
          format: uuid
          description: Any version of the questionnaire.
    RequestQuestionnaireRequest:
      type: object
      required: [questionnaireId]
      additionalProperties: false
      properties:
        questionnaireId:
          type: string
          format: uuid
          description: The active version to ask.
    AnswerValue:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      description: >-
        One answer value, as FHIR QuestionnaireResponse.item.answer.value[x], of the item's type: `valueString`
        for string, text and choice (one of its options), `valueBoolean`, `valueInteger`, `valueDecimal`
        (written plainly, at most 15 significant digits), `valueDate` (YYYY-MM-DD).
      properties:
        valueString:
          type: string
          minLength: 1
          maxLength: 4000
        valueBoolean:
          type: boolean
        valueInteger:
          type: integer
          format: int32
        valueDecimal:
          type: number
        valueDate:
          type: string
          format: date
    Answer:
      type: object
      required: [linkId, values]
      additionalProperties: false
      description: The answer to one question; several values only for a choice with repeats.
      properties:
        linkId:
          type: string
        values:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/AnswerValue"}
    StartQuestionnaireRequest:
      type: object
      required: [language]
      additionalProperties: false
      properties:
        language:
          $ref: "#/components/schemas/Language"
    SaveAnswersRequest:
      type: object
      required: [answers]
      additionalProperties: false
      properties:
        answers:
          type: array
          description: Every saved answer; a question left out is unanswered.
          items: {$ref: "#/components/schemas/Answer"}
    QuestionnaireResponse:
      type: object
      required: [id, appointmentId, questionnaireId, status, source, answers, dueAt, lastUpdated, versionId]
      description: >-
        A questionnaire the patient is asked to fill in before an appointment, and their answers (FHIR
        QuestionnaireResponse; reads go through FHIR, the answers nested under the questionnaire's sections).
      properties:
        id:
          type: string
          format: uuid
        appointmentId:
          type: string
          format: uuid
        questionnaireId:
          type: string
          format: uuid
          description: The questionnaire version asked.
        status:
          type: string
          enum: [in-progress, completed, stopped]
          description: In progress, submitted, or withdrawn by the practitioner.
        source:
          type: string
          enum: [default, added]
          description: The practitioner role's default, with the booking, or added by the practitioner.
        answers:
          type: array
          items: {$ref: "#/components/schemas/Answer"}
        dueAt:
          type: string
          format: date-time
          description: The appointment's start; the answers are due before it.
        authored:
          type: string
          format: date-time
          description: When the patient submitted; absent before.
        language:
          $ref: "#/components/schemas/Language"
          description: The language the patient answers in; absent until they start.
        lastUpdated:
          type: string
          format: date-time
        versionId:
          type: integer
          format: int32
          description: The version of the answers, for If-Match.
    Binary:
      type: object
      required: [id, contentType, size, title, status]
      description: A file attached to a questionnaire answer (FHIR Binary; its bytes at `/binaries/{id}/content`).
      properties:
        id:
          type: string
          format: uuid
        contentType:
          type: string
          enum: [application/pdf, image/jpeg, image/png, video/mp4]
          description: Detected from the bytes on upload.
        size:
          type: integer
          format: int64
          description: Bytes.
        title:
          type: string
          maxLength: 200
          description: The file's name as uploaded; may be empty.
        status:
          type: string
          enum: [quarantined, clean, rejected]
          description: >-
            `quarantined` until the malware scan is done; `clean` may be opened; `rejected` was found to hold
            malware and is removed from the answer.
    Error:
      type: object
      required: [error]
      description: Every JSON API error. The code is fixed per case; it never carries internal text.
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_email
            - invalid_password
            - email_taken
            - unauthenticated
            - wrong_credentials
            - rate_limited
            - invalid_challenge
            - wrong_code
            - already_enrolled
            - not_enrolled
            - csrf
            - forbidden
            - invalid_role
            - invalid_name
            - invalid_invite
            - invalid_birth_date
            - invalid_phone
            - not_found
            - version_conflict
            - consent_active
            - consent_inactive
            - profile_required
            - invalid_specialty
            - invalid_slot_minutes
            - invalid_availability
            - consent_required
            - transcription_consent_required
            - slot_unavailable
            - cancellation_window_closed
            - appointment_closed
            - appointment_not_started
            - invalid_status
            - join_window_not_open
            - consultation_ended
            - practitioner_did_not_join
            - consultation_not_started
            - not_draft
            - not_active
            - draft_exists
            - invalid_questionnaire
            - already_requested
            - appointment_started
            - submitted
            - withdrawn
            - past_due
            - answers_invalid
            - not_attachment_item
            - length_required
            - too_large
            - response_full
            - too_many_files
            - unsupported_type
            - scanning
            - range_not_satisfiable
            - attachments_pending
            - language_unavailable
            - language_locked
            - translation_incomplete
            - note_required
            - internal error
            - timeout
        linkIds:
          type: array
          items: {type: string}
          description: >-
            With `invalid_questionnaire`, `answers_invalid` and `translation_incomplete` only, the offending
            items' linkIds in document order.
        language:
          $ref: "#/components/schemas/Language"
          description: With `translation_incomplete` only, the translation that is incomplete.
    ConsultationJoin:
      type: object
      required: [url, token, expiresAt, peerName, role]
      description: >-
        What a client needs to join the room. The token is a secret: it is never logged or stored. Health
        data: it shows whom the patient consults.
      properties:
        url:
          type: string
          description: The LiveKit server the client connects to (ws:// locally, wss:// deployed).
        token:
          type: string
          description: The LiveKit join token, valid 5 minutes for joining.
        expiresAt:
          type: string
          format: date-time
        peerName:
          type: string
          description: >-
            The other person's display name; empty when the caller may not see it (the practitioner after a
            revocation, or a practitioner not in the public directory).
        role:
          type: string
          enum: [patient, practitioner]
          description: The caller's role in the consultation.
    ConsultationStatus:
      type: object
      required: [state]
      description: >-
        Where an appointment's video consultation stands. Health data: it shows that the patient attended. The
        times are absent until they happen.
      properties:
        state:
          type: string
          enum: [not_started, open, ended]
        patientJoinedAt:
          type: string
          format: date-time
          description: When the patient first joined the room.
        practitionerJoinedAt:
          type: string
          format: date-time
          description: When the practitioner first joined the room.
        endedAt:
          type: string
          format: date-time
        endReason:
          type: string
          enum: [practitioner, window_closed, practitioner_absent, time_limit, cancelled]
          description: >-
            Why it ended: the practitioner ended it; the window closed with the room empty; the practitioner never
            joined; the 2-hour limit after the scheduled end; the appointment was cancelled.
        reason:
          type: string
          enum: [consent_withdrawn, cancelled, left, ended, practitioner_did_not_join, time_limit]
          description: >-
            Why the patient was removed or the consultation ended, as the clients show it: the patient was removed
            because their consent was withdrawn (also when that cancelled the appointment), or because the
            appointment was cancelled; while open, the patient who joined left on their own; the practitioner ended
            it or the window closed with the room empty; the window closed without the practitioner; the 2-hour
            limit. Absent while nobody has joined or left.
        transcription:
          type: boolean
          description: >-
            True while the consultation may be transcribed and translated, with AI assistance for the
            practitioner: the patient's care and transcription consents with the clinic are both active (SAL-12).
            Absent otherwise: the call runs without the transcription agent.
    LiveKitWebhookEvent:
      type: object
      description: >-
        LiveKit's WebhookEvent in its JSON form (protojson); only `event`, `room.name`, the participant's
        `identity` and `joinedAt`/`joinedAtMs`, and `createdAt` are read.
      properties:
        event: {type: string, examples: [participant_joined]}
      additionalProperties: true
    WebhookReceived:
      type: object
      description: An empty object.
      additionalProperties: false
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Unavailable:
      type: object
      required: [status, failed]
      properties:
        status:
          type: string
          const: unavailable
        failed:
          type: array
          description: Names of the failing checks.
          items:
            type: string
            enum: [postgres, redis]
    # The consultation's live messages (docs/plans/consult-intelligence.md): pushed to the practitioner's
    # browser over a WebSocket, and carried on the encounter's Redis Stream as the same bytes. Each is a
    # pkg/wire envelope of one event; api/contract_test.go keeps these in step with the Go types.
    ConsultMessage:
      description: One live message of a consultation, told apart by `type`.
      oneOf:
        - {$ref: "#/components/schemas/TranscriptMessage"}
        - {$ref: "#/components/schemas/SuggestionMessage"}
        - {$ref: "#/components/schemas/DraftMessage"}
      discriminator:
        propertyName: type
        mapping:
          transcript: "#/components/schemas/TranscriptMessage"
          suggestion: "#/components/schemas/SuggestionMessage"
          draft: "#/components/schemas/DraftMessage"
    ConsultFrame:
      description: >-
        One text frame of GET /encounters/{id}/events: a live message (one of ConsultMessage's), or the cursor
        sent before each one, told apart by `type`.
      oneOf:
        - {$ref: "#/components/schemas/TranscriptMessage"}
        - {$ref: "#/components/schemas/SuggestionMessage"}
        - {$ref: "#/components/schemas/DraftMessage"}
        # The cursor last: the Dart generator gives the flat model the last variant's payload, as before SAL-7.
        - {$ref: "#/components/schemas/CommandErrorMessage"}
        - {$ref: "#/components/schemas/CursorMessage"}
      discriminator:
        propertyName: type
        mapping:
          transcript: "#/components/schemas/TranscriptMessage"
          suggestion: "#/components/schemas/SuggestionMessage"
          draft: "#/components/schemas/DraftMessage"
          cursor: "#/components/schemas/CursorMessage"
          command_error: "#/components/schemas/CommandErrorMessage"
    # What the client sends on GET /encounters/{id}/events, and the answer to one that failed (SAL-7).
    ConsultCommand:
      description: A text frame the client sends on GET /encounters/{id}/events, told apart by `type`.
      oneOf:
        - {$ref: "#/components/schemas/SuggestionStatusMessage"}
      discriminator:
        propertyName: type
        mapping:
          suggestion_status: "#/components/schemas/SuggestionStatusMessage"
    SuggestionStatusMessage:
      type: object
      description: The practitioner dismisses, pins or unpins (`shown`) a suggestion of the stream's encounter.
      required: [type, version, payload]
      properties:
        type: {type: string, const: suggestion_status}
        version: {type: integer, const: 1}
        payload: {$ref: "#/components/schemas/SuggestionStatus"}
    SuggestionStatus:
      type: object
      required: [id, status]
      properties:
        id: {type: string, format: uuid}
        status:
          type: string
          enum: [shown, dismissed, pinned]
    CommandErrorMessage:
      type: object
      description: Answers a client's message that failed; nothing changed.
      required: [type, version, payload]
      properties:
        type: {type: string, const: command_error}
        version: {type: integer, const: 1}
        payload: {$ref: "#/components/schemas/CommandError"}
    CommandError:
      type: object
      required: [command, error]
      properties:
        command:
          type: string
          description: The failed message's `type`; empty when it was no envelope.
        id:
          type: string
          description: The suggestion the message named, when it named one.
        error:
          type: string
          description: >-
            `invalid_message`: no envelope; `unknown_command`: a type or version the server does not take;
            `invalid`: a payload or status the contract does not allow; `not_found`: no such suggestion of the
            encounter, or an encounter the caller may not see; `consent_required`: after a revocation;
            `forbidden`: not the encounter's practitioner; `internal`: a server error.
          enum: [invalid_message, unknown_command, invalid, not_found, consent_required, forbidden, internal]
    CursorMessage:
      type: object
      description: Sent before each live message, with the stream id of its entry, which a client resumes after.
      required: [type, version, payload]
      properties:
        type: {type: string, const: cursor}
        version: {type: integer, const: 1}
        payload: {$ref: "#/components/schemas/Cursor"}
    Cursor:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: The entry's stream id, `<milliseconds>-<sequence>`.
    Transcript:
      type: object
      required: [segments]
      properties:
        segments:
          type: array
          description: The stored final segments in the order they were said.
          items: {$ref: "#/components/schemas/TranscriptEvent"}
    TranscriptMessage:
      type: object
      required: [type, version, payload]
      properties:
        type: {type: string, const: transcript}
        version: {type: integer, const: 1}
        payload: {$ref: "#/components/schemas/TranscriptEvent"}
    SuggestionMessage:
      type: object
      required: [type, version, payload]
      properties:
        type: {type: string, const: suggestion}
        version: {type: integer, const: 1}
        payload: {$ref: "#/components/schemas/SuggestionEvent"}
    DraftMessage:
      type: object
      required: [type, version, payload]
      properties:
        type: {type: string, const: draft}
        version: {type: integer, const: 1}
        payload: {$ref: "#/components/schemas/DraftEvent"}
    TranscriptEvent:
      type: object
      description: >-
        One segment as it is recognised. Partial segments (`is_final` false) revise each other under the same
        `segment_id` until the final one; only final segments are stored.
      required: [encounter_id, segment_id, speaker, lang, original, translation, is_final, ts_start, ts_end]
      properties:
        encounter_id: {type: string, format: uuid}
        segment_id: {type: string, format: uuid}
        speaker:
          type: string
          enum: [practitioner, patient]
        lang:
          type: string
          description: The language the segment was spoken in, a BCP 47 tag.
        original:
          type: string
        translation:
          type: string
          description: >-
            Into the other participant's language; empty until it is translated. Partial segments and segments
            said in the other participant's language are not translated.
        translation_failed:
          type: boolean
          description: >-
            Present and true on a final segment that should have been translated and was not: the original is
            all there is. Absent otherwise.
        terms:
          $ref: "#/components/schemas/TranscriptTerms"
        is_final:
          type: boolean
        ts_start:
          type: string
          format: date-time
        ts_end:
          type: string
          format: date-time
    TranscriptTerms:
      type: object
      description: >-
        Where the terms with a plain-language explanation are in a final segment (SAL-13), for the tooltip that
        explains them: an overlay, the texts are never changed. Present only when a term was found; never stored.
      properties:
        original:
          type: array
          description: In `original`, in the speaker's language.
          items: {$ref: "#/components/schemas/TermSpan"}
        translation:
          type: array
          description: In `translation`, in the listener's language.
          items: {$ref: "#/components/schemas/TermSpan"}
    TermSpan:
      type: object
      description: >-
        A term found in a text: the UTF-16 offsets [start, end) of the words it was found by (JavaScript and Dart
        index strings so), and the term, whose explanation getTermExplanations gives. Spans do not overlap.
      required: [term_id, start, end]
      properties:
        term_id: {type: string, format: uuid}
        start: {type: integer, minimum: 0}
        end: {type: integer, minimum: 1}
    SuggestionEvent:
      type: object
      description: >-
        AI assistance for the practitioner only: a suggestion from a language model, citing the segments it came
        from; a prompt the practitioner may ignore, never a diagnosis. Whatever shows one labels it as AI
        assistance (`origin`). Pushed when shown and on every change of its status.
      required: [id, encounter_id, type, text, confidence, source_segment_ids, status, origin]
      properties:
        id: {type: string, format: uuid}
        encounter_id: {type: string, format: uuid}
        type:
          type: string
          enum: [diagnosis, question, red_flag, term]
          description: >-
            What the suggestion prompts: a diagnosis to consider (not one made), a question to ask, a red flag to
            check, or a term to explain.
        text:
          type: string
          minLength: 1
          maxLength: 300
        origin:
          type: string
          enum: [ai]
          description: Always `ai`, an AI model's suggestion, shown as AI assistance.
        confidence:
          type: number
          minimum: 0
          maximum: 1
        source_segment_ids:
          type: array
          minItems: 1
          items: {type: string, format: uuid}
        status:
          type: string
          enum: [shown, dismissed, pinned]
    DraftEvent:
      type: object
      description: A document drafted from a clinic's template (a FHIR Composition), pushed on every change.
      required: [draft_id, encounter_id, template_id, status, fields]
      properties:
        draft_id: {type: string, format: uuid}
        encounter_id: {type: string, format: uuid}
        template_id: {type: string, format: uuid}
        status:
          type: string
          enum: [preliminary, final, entered-in-error]
        fields:
          type: array
          minItems: 1
          description: In the template's order.
          items: {$ref: "#/components/schemas/DraftField"}
        version_id:
          type: integer
          format: int32
          description: >-
            The draft's version (Composition meta.versionId): what a sign names in If-Match, and by which a page
            tells a redraft from a replay. Absent only in events from before SAL-8.
    DraftField:
      type: object
      description: >-
        One field by its template key. A filled field has a value and the segments it came from (none when the
        practitioner typed it); a missing one has neither.
      required: [key, value, missing]
      properties:
        key:
          type: string
        value:
          type: string
        source_segment_ids:
          type: array
          items: {type: string, format: uuid}
        missing:
          type: boolean
    DocumentTemplate:
      type: object
      description: >-
        A clinic's document template (no personal data): its fields in its original language, and its
        translations. `status` draft marks wording the clinic has not reviewed yet (the seeded examples are
        placeholders); both statuses can be drafted from.
      required: [id, title, language, status, typeCode, fields, translations, lastUpdated, versionId]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        language: {$ref: "#/components/schemas/Language"}
        status:
          type: string
          enum: [draft, active]
        typeCode:
          type: string
          description: The LOINC code of the document type (Composition.type), e.g. 11488-4 consult note, 57133-1 referral note.
        fields:
          type: array
          items: {$ref: "#/components/schemas/DocumentTemplateField"}
        translations:
          type: array
          items: {$ref: "#/components/schemas/DocumentTemplateTranslation"}
        lastUpdated: {type: string, format: date-time}
        versionId: {type: integer, format: int32}
    DocumentTemplateField:
      type: object
      description: >-
        One field: its key (lowercase letters, digits and underscores, stable across languages), its type (a list
        is one item per line, a date YYYY-MM-DD, a coded term one ICD-10 code), the label and instruction the
        model and the practitioner read, and whether the document needs it (a required field is never guessed:
        it stays missing until the transcript covers it, and a sign needs it).
      required: [key, type, label, required]
      properties:
        key: {type: string, pattern: "^[a-z][a-z0-9_]{0,39}$"}
        type:
          type: string
          enum: [text, list, date, coded]
        label: {type: string, maxLength: 200}
        instruction: {type: string, maxLength: 1000}
        required: {type: boolean}
    DocumentTemplateTranslation:
      type: object
      required: [language, title, fields]
      properties:
        language: {$ref: "#/components/schemas/Language"}
        title: {type: string}
        fields:
          type: object
          description: Each field's texts by key; every field, and an instruction exactly where the original has one.
          additionalProperties: {$ref: "#/components/schemas/DocumentFieldTexts"}
    DocumentFieldTexts:
      type: object
      required: [label]
      properties:
        label: {type: string}
        instruction: {type: string}
    DocumentTemplates:
      type: object
      required: [templates]
      properties:
        templates:
          type: array
          items: {$ref: "#/components/schemas/DocumentTemplate"}
    SaveDocumentTemplateRequest:
      type: object
      required: [title, language, status, typeCode, fields]
      properties:
        title: {type: string, maxLength: 200}
        language: {$ref: "#/components/schemas/Language"}
        status:
          type: string
          enum: [draft, active]
        typeCode: {type: string, pattern: "^[0-9]{1,7}-[0-9]$"}
        fields:
          type: array
          minItems: 1
          maxItems: 50
          items: {$ref: "#/components/schemas/DocumentTemplateField"}
        translations:
          type: array
          items: {$ref: "#/components/schemas/DocumentTemplateTranslation"}
    GenerateDraftRequest:
      type: object
      required: [templateId]
      properties:
        templateId: {type: string, format: uuid}
        language:
          $ref: "#/components/schemas/Language"
          description: The language to write in; the template's original language when absent.
    Drafts:
      type: object
      required: [drafts]
      properties:
        drafts:
          type: array
          items: {$ref: "#/components/schemas/DraftEvent"}
    SignDraftRequest:
      type: object
      required: [fields]
      properties:
        fields:
          type: array
          description: One value per field of the draft, as the practitioner left it; empty for none.
          items: {$ref: "#/components/schemas/DraftValue"}
    DraftValue:
      type: object
      required: [key, value]
      properties:
        key: {type: string}
        value: {type: string}
    KeyedError:
      type: object
      required: [error, keys]
      properties:
        error: {type: string}
        keys:
          type: array
          items: {type: string}
