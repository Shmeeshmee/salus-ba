          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /history-sharing/{organizationId}:
    parameters:
      - $ref: "#/components/parameters/SharingOrganizationID"
    get:
      operationId: previewHistorySharing
      summary: The visits the patient may share with a clinic
      description: >-
        SAL-42. The preview at booking and in settings: every finished visit of the patient's at other clinics, each
        exactly as the clinic would see it marked (date, clinic, specialty, title), with whether it is shared now.
        Patients only. Not cached. Audited.
      tags: [history]
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The candidates, newest first.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SharingCandidateList"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403":
          description: "`forbidden`: a staff account."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: "`not_found`: no such clinic."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: setHistorySharing
      summary: Share exactly these visits with a clinic
      description: >-
        SAL-42. Grants the history consent with the clinic, or changes the visits it lists, to exactly the ones sent:
        each a finished visit of the patient's at another clinic. An empty list revokes it. Takes effect when it
        commits. Needs the care consent with the clinic. To change an existing sharing send If-Match with its
        `versionId` (412 when it changed meanwhile, or when it is missing and a sharing exists); a first grant sends
        none. Every grant, change and revocation is audited.
      tags: [history]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - name: If-Match
          in: header
          required: false
          description: The sharing's version read, as a weak ETag, `W/"<versionId>"`; absent for a first grant.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SetHistorySharingRequest"}
      responses:
        "200":
          description: The sharing now; `shared` empty after a revocation. Its ETag is the version.
          headers:
            ETag: {schema: {type: string}, description: 'W/"<versionId>".'}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HistorySharing"}
        "400":
          description: >-
            `invalid_request`: not the request; `invalid_visit`: a visit that is not a finished one of the patient's at
            another clinic; `care_consent_required`: no active care consent with the clinic.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403":
          description: "`forbidden`: a staff account; or `csrf`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: "`not_found`: no such clinic."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "412":
          description: "`version_conflict`: the sharing changed since it was read, or exists and no If-Match was sent; read it again."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: revokeHistorySharing
      summary: Stop sharing history with a clinic
      description: SAL-42. Revokes the history consent with the clinic; takes effect when it commits. Audited.
      tags: [history]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "204": {description: "Revoked, or nothing was shared."}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403":
          description: "`forbidden`: a staff account; or `csrf`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /webhooks/livekit:
    post:
      operationId: receiveLiveKitWebhook
      summary: LiveKit's webhook
      description: >-
        Called only by our LiveKit server, never by the clients. No session and no CSRF header: the
        `Authorization` header is LiveKit's JWT, signed with the API key pair and carrying the body's SHA-256,
        verified before the body is read. The body is read up to 64 KiB. Handled idempotently and in any
        order: a participant's join is recorded (the practitioner's first one starts the Encounter; a patient
        whose access has gone is removed from the room), and once the join window has closed the last one
        leaving ends the consultation. Every other event, and one for a room we do not know, has no effect.
      tags: [consultation]
      security:
        - livekitWebhook: []
      requestBody:
        required: true
        content:
          application/webhook+json:
            schema: {$ref: "#/components/schemas/LiveKitWebhookEvent"}
      responses:
        "200":
          description: Handled, also when it had no effect.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WebhookReceived"}
        "400":
          description: "`invalid_request`: a body over 64 KiB."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          description: "`unauthenticated`: a missing, expired or wrong signature, or one for another body."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /conversations:
    post:
      operationId: openConversation
      summary: Open the conversation with a patient or a practitioner, or return the one there is
      description: >-
        Staff name the patient and open it with their own role; a patient names the clinic and the practitioner role.
        Allowed with the patient's active care consent with the clinic and an appointment of the patient with that
        role, of any time or status (docs/plans/chat.md). One conversation per patient, role and encounter (none
        counts as one): opening it again answers 200 with it. Audited.
      tags: [chat]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OpenConversationRequest"}
      responses:
        "200":
          description: The existing conversation.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Conversation"}
        "201":
          description: The new conversation.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Conversation"}
        "400":
          $ref: "#/components/responses/ChatInvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`consent_required`: no active care consent; `forbidden`: an admin, or a patient without an appointment with the role."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: "`not_found`: staff without an appointment with the patient, or an encounter that is not the patient's in the clinic."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    get:
      operationId: listConversations
      summary: The caller's conversations, newest activity first, with their unread counts
      description: >-
        The conversations the caller takes part in, 50 a page; a practitioner's only while the patient's care consent
        is active. Audited as one search.
      tags: [chat]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: before
          in: query
          required: false
          description: The `next` of the previous page.
          schema: {type: string}
      responses:
        "200":
          description: A page of conversations.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConversationList"}
        "400":
          $ref: "#/components/responses/ChatInvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ChatForbidden"
  /conversations/{id}:
    get:
      operationId: getConversation
      summary: One conversation with its active participants
      tags: [chat]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationID"
      responses:
        "200":
          description: The conversation.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Conversation"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ChatForbidden"
        "404":
          $ref: "#/components/responses/ChatNotFound"
  /conversations/{id}/messages:
    get:
      operationId: listMessages
      summary: A page of the conversation's messages, newest first
      description: >-
        Before the `before` cursor, or the newest; `next` is the cursor of the older page and absent at the start. A
        practitioner added later reads from their `history_from_seq`. Audited as one read of the rows returned.
      tags: [chat]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationID"
        - name: before
          in: query
          required: false
          description: A message's `cursor`, or a page's `next`.
          schema: {type: string}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        "200":
          description: A page of messages.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessagePage"}
        "400":
          $ref: "#/components/responses/ChatInvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ChatForbidden"
        "404":
          $ref: "#/components/responses/ChatNotFound"
    post:
      operationId: sendMessage
      summary: Send a text message
      description: >-
        Idempotent by `client_message_id` per sender: a repeat answers 200 with the first message, which is not sent
        again. The patient writes while their care consent is active; a practitioner while they take part and the
        consent is active. Audited; the message goes to every open socket of the conversation.
      tags: [chat]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationID"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SendMessageRequest"}
      responses:
        "200":
          $ref: "#/components/responses/ChatMessage"
        "201":
          $ref: "#/components/responses/ChatMessage"
        "400":
          $ref: "#/components/responses/ChatInvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ChatForbidden"
        "404":
          $ref: "#/components/responses/ChatNotFound"
  /conversations/{id}/messages/{message_id}:
    patch:
      operationId: editMessage
      summary: Edit the body of one's own text message
      description: >-
        `If-Match` is the message's version (its ETag). The earlier body is kept (`.../revisions`); the edit goes to
        every open socket as `message_edited`. Audited.
      tags: [chat]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationID"
        - $ref: "#/components/parameters/MessageID"
        - $ref: "#/components/parameters/CSRF"
        - name: If-Match
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EditMessageRequest"}
      responses:
        "200":
          $ref: "#/components/responses/ChatMessage"
        "400":
          $ref: "#/components/responses/ChatInvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`forbidden`: someone else's message, a system message, or a caller who may not write; `consent_required`: the patient after their revocation."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          $ref: "#/components/responses/ChatNotFound"
        "412":
          description: "`version_conflict`: the message changed since it was read."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "428":
          description: "`if_match_required`: no or an unreadable If-Match."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /conversations/{id}/messages/{message_id}/revisions:
    get:
      operationId: listMessageRevisions
      summary: The earlier bodies of an edited message, oldest first
      tags: [chat]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationID"
        - $ref: "#/components/parameters/MessageID"
      responses:
        "200":
          description: The revisions; empty for a message never edited.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessageRevisions"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ChatForbidden"
        "404":
          $ref: "#/components/responses/ChatNotFound"
  /conversations/{id}/read:
    put:
      operationId: markConversationRead
      summary: Move the caller's read position
      description: The caller has read the messages up to `seq`; the position never goes back. Not audited.
      tags: [chat]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationID"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReadPosition"}
      responses:
        "204":
          description: Moved, or left where it was ahead.
        "400":
          $ref: "#/components/responses/ChatInvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ChatForbidden"
        "404":
          $ref: "#/components/responses/ChatNotFound"
  /conversations/{id}/attachments:
    post:
      operationId: uploadChatAttachment
      summary: Upload a file to send in the conversation
      description: >-
        A participant who may write uploads one file (SAL-30), then names it in `attachment_ids` of their next
        message. The body is the file's bytes, streamed; `Content-Length` is required. The type is detected from the
        bytes, never from `Content-Type` or the name: a photo (JPEG, PNG) or a PDF (lab results among them), at most
        20 MB. The file name is the `filename*` of `Content-Disposition` (RFC 6266), cut to 200 characters, the path
        removed; never put it in the query string. The file is encrypted, stored and `scanning` until the malware
        scan says it is `clean` (an image then gets a thumbnail) or `rejected`; only its uploader sees it before it is
        sent. A participant has at most 10 files waiting to be sent (scanning or clean, not yet in a message). A file
        never sent is deleted after 24 hours. Audited, also when refused.
      tags: [chat]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationID"
        - $ref: "#/components/parameters/CSRF"
        - name: Content-Length
          in: header
          required: true
          description: The file's size in bytes.
          schema: {type: integer, format: int64, minimum: 1}
        - name: Content-Disposition
          in: header
          required: false
          description: "`attachment; filename*=UTF-8''<percent-encoded name>`, the file's name."
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        "201":
          description: The file, `scanning`.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChatAttachment"}
        "400":
          description: "`invalid_request`: the body ended before `Content-Length` bytes, or an id that is no UUID."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ChatForbidden"
        "404":
          $ref: "#/components/responses/ChatNotFound"
        "409":
          description: "`too_many_files`: the caller already has 10 files waiting to be sent in the conversation."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "411":
          description: "`length_required`: no `Content-Length`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "413":
          description: "`too_large`: over 20 MB."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "415":
          description: "`unsupported_type`: the bytes are no JPEG, PNG or PDF."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /conversations/{id}/attachments/{attachment_id}/content:
    get:
      operationId: getChatAttachmentContent
      summary: Download a message's file
      description: >-
        The file's bytes, decrypted, once the scan says it is `clean`, for whoever may read its message (a
        participant who joined later only from their starting point; staff never after the patient's revocation),
        or, before it is sent, for its uploader. One `Range` gives 206 with that part. Shown inline, never sniffed,
        never cached. Every request is audited.
      tags: [chat]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationID"
        - $ref: "#/components/parameters/ChatAttachmentID"
        - name: Range
          in: header
          required: false
          description: One byte range, `bytes=<first>-<last>`, `bytes=<first>-` or `bytes=-<suffix length>`.
          schema: {type: string}
      responses:
        "200":
          $ref: "#/components/responses/BinaryContent"
        "206":
          $ref: "#/components/responses/BinaryContent"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ChatForbidden"
        "404":
          description: "`not_found`: no such file of the conversation, a rejected one, or the caller may not read it."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: "`scanning`: the file is still being checked; try again later."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "416":
          description: "`range_not_satisfiable`: the range starts past the end of the file."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /conversations/{id}/attachments/{attachment_id}/thumbnail:
    get:
      operationId: getChatAttachmentThumbnail
      summary: Download a message's image thumbnail
      description: >-
        A JPEG of at most 320 pixels a side, made by the server from the clean image (`thumbnail` true on the
        attachment); none for a PDF (404). Read as the file is, audited.
      tags: [chat]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationID"
        - $ref: "#/components/parameters/ChatAttachmentID"
      responses:
        "200":
          description: The thumbnail.
          headers:
            Cache-Control: {schema: {type: string, const: "private, no-store"}}
          content:
            image/jpeg:
              schema: {type: string, format: binary}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ChatForbidden"
        "404":
          description: "`not_found`: as for the content, or a file without a thumbnail."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: "`scanning`: the file is still being checked."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /conversations/{id}/search:
    get:
      operationId: searchConversation
      summary: Search a conversation's messages
      description: >-
        The messages of the conversation whose text has every word of `q`, each as a word's beginning, case and
        accents aside, in any of the app's languages; newest first, at most 50; only those the caller reads. Audited
        as a search; `q` is never logged or stored.
      tags: [chat]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationID"
        - $ref: "#/components/parameters/ChatSearchQuery"
      responses:
        "200":
          $ref: "#/components/responses/ChatSearchResults"
        "400":
          $ref: "#/components/responses/ChatInvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ChatForbidden"
        "404":
          $ref: "#/components/responses/ChatNotFound"
  /conversations/search:
    get:
      operationId: searchConversations
      summary: Search the caller's conversations
      description: >-
        As `searchConversation`, across the caller's conversations: a patient's own (never a doctor-only thread); a
        practitioner's, those they take part in, from their starting point, while the patient's care consent with
        the clinic is active. Audited as a search.
      tags: [chat]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ChatSearchQuery"
      responses:
        "200":
          $ref: "#/components/responses/ChatSearchResults"
        "400":
          $ref: "#/components/responses/ChatInvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ChatForbidden"
  /conversations/{id}/events:
    get:
      operationId: followConversation
      summary: The conversation's messages, live, over a WebSocket
      description: >-
        A WebSocket (RFC 6455) upgrade (ADR 0012). Every message after `after` is replayed from the record, in order,
        then the live ones follow as `message` frames, and edits as `message_edited` (`ChatFrame`); a client drops a
        message whose `seq` it has. Without `after`, only messages sent from now on. The handshake must come from the
        API's own origin, or carry no Origin (the mobile app, with its bearer token). Access is checked again at least
        every 5 seconds, the session too: when it ends the socket closes with 4401 `unauthenticated` (a logout, a
        revoked or expired session), 4403 `consent_required` or `forbidden`, or 4404 `not_found` (staff after the
        patient's revocation); 1011 on a server error. The subscription is audited. The client may send `send` frames
        (`ChatCommand`), answered with `send_ack`, or `command_error` with the code of the JSON API, or
        `rate_limited` past five at once and one every 200 ms. Pass the conversation's or the last message's
        `cursor` as `after`. Receipts and typing (SAL-30), ephemeral: once replayed, the socket sends a `receipt`
        frame per participant who has read (as kept for 7 days), then the others' `receipt` and `typing` frames as
        they come; a client drops its own. The client's `read` frame (`ChatReadCommand`) moves its read position as
        `markConversationRead` does and counts against the same limit as `send`; its `typing` frame
        (`ChatTypingCommand`) goes out at most once a second; neither is answered unless refused. An app shows a
        participant typing for 5 seconds after their last `typing` frame. Message frames carry their `attachments`
        but no `terms` (the JSON API's reads do).
      tags: [chat]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationID"
        - name: after
          in: query
          required: false
          description: The `cursor` of the last message the client has.
          schema: {type: string}
      responses:
        "101":
          description: "Switching protocols: the WebSocket, carrying `ChatFrame` text frames."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChatFrame"}
        "400":
          description: "`websocket_required`: no WebSocket handshake; `invalid_cursor`: an `after` the API did not give."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`origin`: another origin; `forbidden` or `consent_required` as for the page."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          $ref: "#/components/responses/ChatNotFound"
  /conversations/{id}/participants:
    post:
      operationId: addConversationParticipant
      summary: Add a practitioner of the clinic, or invite one of another clinic (SAL-28)
      description: >-
        The conversation's treating practitioner only, while they may write in it; never into a side thread. A role of
        the clinic, active, is added at once (`status` `active`); a role of another clinic in the public directory is
        invited (`pending_consent`) and sees nothing of the conversation, its participants, messages or side threads
        until the patient grants it (`POST /me/chat-invitations/{id}/decision`). `history` `full` gives the whole
        history, `from` the messages after `from_seq` (at most the conversation's `last_seq`). The conversation gets
        the system message `participant_added` or `participant_invited` (`practitioner_role_id`, `organization_id`,
        `reason`), on the socket like any message. Audited.
      tags: [chat]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationID"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AddParticipantRequest"}
      responses:
        "201":
          description: The participant, active or pending the patient's consent.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConversationParticipant"}
        "400":
          description: "`invalid_request`: a field the contract refuses, or a role that is no active role of the clinic or not in the public directory of the other."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ChatForbidden"
        "404":
          $ref: "#/components/responses/ChatNotFound"
        "409":
          description: "`already_participant`: the role takes part, or is invited, already."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /conversations/{id}/participants/{participant_id}:
    delete:
      operationId: removeConversationParticipant
      summary: Remove a practitioner, or withdraw an invitation (SAL-28)
      description: >-
        The treating practitioner only; never the patient or themselves. The practitioner leaves the conversation's
        side threads with it and sees nothing of it from then on. System message `participant_removed`
        (`practitioner_role_id`). Audited.
      tags: [chat]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationID"
        - name: participant_id
          in: path
          required: true
          description: The participant's id.
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/CSRF"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ChatForbidden"
        "404":
          $ref: "#/components/responses/ChatNotFound"
  /conversations/{id}/threads:
    post:
      operationId: openChatThread
      summary: Open a doctor-only side thread of the conversation (SAL-28)
      description: >-
        For a practitioner who may write in the conversation, or a doctor of another clinic the patient granted. The
        side thread is a conversation (`staff_only`, `parent_id`) whose participants are the conversation's active
        practitioners now: a doctor added later is not in it, one removed from the conversation leaves it. Its
        messages, socket and read position are those of any conversation. The patient never sees it: 404 on every
        path of the side thread, 403 here. No body. Audited.
      tags: [chat]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationID"
        - $ref: "#/components/parameters/CSRF"
      responses:
        "201":
          description: The side thread, with its participants.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Conversation"}
        "400":
          $ref: "#/components/responses/ChatInvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ChatForbidden"
        "404":
          $ref: "#/components/responses/ChatNotFound"
    get:
      operationId: listChatThreads
      summary: The side threads of the conversation the caller takes part in, newest first (SAL-28)
      description: For the practitioners of `POST`; never the patient (403). With the caller's unread counts. Audited as one search.
      tags: [chat]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationID"
      responses:
        "200":
          description: The side threads, without a `next`.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConversationList"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ChatForbidden"
        "404":
          $ref: "#/components/responses/ChatNotFound"
  /me/chat-invitations:
    get:
      operationId: listChatInvitations
      summary: The patient's invitations of doctors from other clinics, pending or granted (SAL-28)
      description: >-
        Oldest first: the pending invitations (`status` `pending_consent`, the default), or the granted ones
        (`status` `active`), whose `id` `POST /me/chat-invitations/{id}/revoke` takes, so a consent is withdrawn as
        easily as it was given (GDPR Art. 7(3)). A doctor of the conversation's own clinic is never one. The patient
        only (403 to staff). Audited as one search.
      tags: [chat]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Which invitations; `pending_consent` when absent.
          schema: {type: string, enum: [pending_consent, active], default: pending_consent}
      responses:
        "200":
          description: The invitations of that status.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChatInvitationList"}
        "400":
          $ref: "#/components/responses/ChatInvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ChatForbidden"
  /me/chat-invitations/{id}/decision:
    post:
      operationId: decideChatInvitation
      summary: Grant or decline an invitation (SAL-28)
      description: >-
        The patient's decision. `grant` records their FHIR Consent for that conversation and that practitioner role
        (revocable), needs their active care consent with the clinic (403 `consent_required` otherwise) and makes the
        doctor an active participant; `decline` ends the invitation. System message `consent_granted` or
        `consent_declined` (`practitioner_role_id`). Audited.
      tags: [chat]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ChatInvitationID"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChatInvitationDecision"}
      responses:
        "204":
          description: Decided.
        "400":
          $ref: "#/components/responses/ChatInvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ChatForbidden"
        "404":
          description: "`not_found`: no pending invitation of the patient with that id."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /me/chat-invitations/{id}/revoke:
    post:
      operationId: revokeChatInvitation
      summary: Revoke a granted invitation (SAL-28)
      description: >-
        The patient's chat consent for the doctor ends and the doctor leaves the conversation and its side threads:
        they see nothing of it from then on, and an open socket of theirs closes with 4404 at its next check (within
        5 seconds). System message `participant_removed` (`practitioner_role_id`). Audited.
      tags: [chat]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ChatInvitationID"
        - $ref: "#/components/parameters/CSRF"
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ChatForbidden"
        "404":
          description: "`not_found`: no granted invitation of the patient with that id."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /me/devices:
    put:
      operationId: registerDevice
      summary: Register the patient app's push token
      description: >-
        The patient app registers its FCM (Android) or APNs (iOS) token at every start (docs/plans/chat.md, SAL-29). A
        token is one device: registered by another account, it moves to this one. A push says only that there is a
        new message from the clinic; it carries no text, name or id. Staff get 403: the app is the patients'. Audited.
      tags: [chat]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PushDevice"}
      responses:
        "204":
          description: Registered.
        "400":
          $ref: "#/components/responses/NotificationInvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`forbidden`: a staff account."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    delete:
      operationId: unregisterDevice
      summary: Unregister the app's push token (on sign-out)
      description: Deletes the account's device of the token; nothing for a token it does not have. Audited.
      tags: [chat]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PushDevice"}
      responses:
        "204":
          description: Unregistered, or there was nothing to unregister.
        "400":
          $ref: "#/components/responses/NotificationInvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`forbidden`: a staff account."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /organizations/{id}/chat-hours:
    get:
      operationId: getChatHours
      summary: The clinic's chat hours, its response time, and whether it is within its hours now
      description: >-
        For the clinic's staff and for a patient with an active care consent with it; anyone else gets 404. `hours`
        are in the clinic's `time_zone`; `open_now` is computed there (true when the clinic states no hours). The app
        shows its out-of-hours notice from it.
      tags: [chat]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The clinic's id.
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: The chat hours.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChatHours"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: "`not_found`: not the caller's clinic, or no active care consent with it."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /clinic/chat-settings:
    get:
      operationId: getChatSettings
      summary: The admin's clinic's chat settings
      description: The defaults (no hours, 24 hours, 60 minutes) until the admin sets them.
      tags: [chat]
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The settings.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChatSettings"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ClinicAdminOnly"
        "404":
          $ref: "#/components/responses/ClinicNotFound"
    put:
      operationId: setChatSettings
      summary: Replace the admin's clinic's chat settings
      description: >-
        Every field required. `hours`: up to 21 stretches, each within one weekday, `start` before `end` (`24:00` for
        midnight), none overlapping. `response_time_hours` 1 to 168. `email_after_minutes` 5 to 10080: how long a
        message stays unread before its reader gets an e-mail. Audited, also when refused.
      tags: [chat]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChatSettings"}
      responses:
        "200":
          description: The settings stored.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChatSettings"}
        "400":
          description: "`invalid_request`: a body that is not the settings, or a value out of its range."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ClinicAdminOnly"
        "404":
          $ref: "#/components/responses/ClinicNotFound"
  /clinic/webhooks:
    get:
      operationId: listWebhooks
      summary: The admin's clinic's webhook endpoints, without their secrets
      tags: [chat]
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The endpoints, oldest first.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WebhookList"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ClinicAdminOnly"
        "404":
          $ref: "#/components/responses/ClinicNotFound"
    post:
      operationId: createWebhook
      summary: Add a webhook endpoint; its secret is shown in this answer only
      description: >-
        The clinic's own system receives each event as a `WebhookEvent`, POSTed as JSON with the headers
        `Salus-Event-Id` (the event's id, the same on every attempt: deduplicate on it) and `Salus-Signature`:
        `t=<unix seconds>,v1=<hex HMAC-SHA256 of "<t>.<body>" with the secret>` (check it, and refuse an old `t`). A
        status other than 2xx, or no answer within 10 seconds, is retried with backoff, 8 attempts in about an hour
        and a half, then recorded as a dead letter. `url` is https to a public host; addresses that are not public are
        refused at every connection. `include_clinical` (off by default) adds the message's text: the clinic is the
        controller of what it receives. At most 10 endpoints. Audited.
      tags: [chat]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewWebhook"}
      responses:
        "201":
          description: The endpoint, with its secret.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreatedWebhook"}
        "400":
          $ref: "#/components/responses/NotificationInvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ClinicAdminOnly"
        "404":
          $ref: "#/components/responses/ClinicNotFound"
  /clinic/webhooks/{id}:
    delete:
      operationId: deleteWebhook
      summary: Delete a webhook endpoint and its dead letters
      tags: [chat]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The endpoint's id.
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/CSRF"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ClinicAdminOnly"
        "404":
          description: "`not_found`: no such endpoint of the clinic, or not staff of a clinic."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
components:
  parameters:
    ChatAttachmentID:
      name: attachment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChatSearchQuery:
      name: q
      in: query
      required: true
      description: >-
        Words to find, 1 to 200 characters: runs of letters and digits, of two or more, the first eight count;
        anything else separates them.
      schema: {type: string, minLength: 1, maxLength: 200}
    PatientID:
      name: id
      in: path
      required: true
      description: The patient's id (FHIR Patient.id).
      schema: {type: string, format: uuid}
    EntryID:
      name: id
      in: path
      required: true
      description: The entry's id (FHIR AllergyIntolerance.id or MedicationStatement.id).
      schema: {type: string, format: uuid}
    SharingOrganizationID:
      name: organizationId
      in: path
      required: true
      description: The receiving clinic (FHIR Organization.id).
      schema: {type: string, format: uuid}
    HistoryCursor:
      name: cursor
      in: query
      required: false
      description: The `next` of the previous page; absent for the first.
      schema: {type: string, maxLength: 512}
    HistoryLimit:
      name: limit
      in: query
      required: false
      description: Items per page.
      schema: {type: integer, minimum: 1, maximum: 100, default: 30}
    HistoryFrom:
      name: from
      in: query
      required: false
      description: Only items on or after this instant.
      schema: {type: string, format: date-time}
    HistoryTo:
      name: to
      in: query
      required: false
      description: Only items before this instant.
      schema: {type: string, format: date-time}
    ConversationID:
      name: id
      in: path
      required: true
      description: The conversation's id.
      schema:
        type: string
        format: uuid
    ChatInvitationID:
      name: id
      in: path
      required: true
      description: The invitation's id (the invited participant's).
      schema:
        type: string
        format: uuid
    MessageID:
      name: message_id
      in: path
      required: true
      description: The message's id (FHIR Communication.id).
      schema:
        type: string
        format: uuid
    CSRF:
      name: X-Salus-CSRF
      in: header
      required: false
      description: >-
        Sent as `1` by the web app on every write. Required with the session cookie on POST, PUT, PATCH and
        DELETE (403 `csrf` without it). On the login steps it asks for the session in the cookie instead of
        the body.
      schema:
        type: string
        const: "1"
    QuestionnaireID:
      name: id
      in: path
      required: true
      description: The version's id (FHIR Questionnaire.id).
      schema:
        type: string
        format: uuid
    QuestionnaireResponseID:
      name: id
      in: path
      required: true
      description: The response's id (FHIR QuestionnaireResponse.id).
      schema:
        type: string
        format: uuid
    LinkID:
      name: linkId
      in: path
      required: true
      description: The attachment item's linkId.
      schema:
        type: string
        pattern: "^[A-Za-z0-9-]{1,64}$"
    BinaryID:
      name: id
      in: path
      required: true
      description: The file's id (FHIR Binary.id).
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The version read, as a weak ETag, `W/"<versionId>"`.
      schema:
        type: string
    TermID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    AppointmentID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EncounterID:
      name: id
      in: path
      required: true
      description: The encounter's id (FHIR Encounter.id).
      schema:
        type: string
        format: uuid
  responses:
    CSRFOnly:
      description: "`csrf`: the session cookie without the CSRF header."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    EntryWritten:
      description: The entry at its version; read it through the FHIR API. Its ETag is the version.
      headers:
        ETag: {schema: {type: string}, description: 'W/"<versionId>".'}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/EntryWritten"}
    EntryInvalid:
      description: "`invalid_request`: not the request, an unreadable If-Match, or a value outside its set or length."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    EntryForbidden:
      description: "`forbidden`: the caller sees the entry but may not make this change; or `csrf`."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    EntryNotFound:
      description: "`not_found`: no such entry or visit for the caller."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    EntryConflict:
      description: "`version_conflict`: the entry changed since it was read; read it again."
    ChatMessage:
      description: The message; its ETag is its version.
      headers:
        ETag: {schema: {type: string}}
        Cache-Control: {schema: {type: string, const: no-store}}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ChatMessage"}
    ChatSearchResults:
      description: The messages found, newest first.
      headers:
        Cache-Control: {schema: {type: string, const: no-store}}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ChatSearchResults"}
    ChatInvalidRequest:
      description: "`invalid_request`: a body that is not the request, an id that is no UUID, a body of 0 or over 4000 characters (0 only with files), a limit out of range, a `seq` past the last message, files that are not the sender's uploads to the conversation or more than 10, a search without a word; `invalid_cursor`: a cursor the API did not give."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    ChatForbidden:
      description: "`forbidden`: an admin, or a practitioner who does not take part; for a participant's add or removal, anyone but the treating practitioner; for a side thread, the patient; `consent_required`: a patient's write, or grant of an invitation, after their revocation."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    ChatNotFound:
      description: "`not_found`: no such conversation or message for the caller, also for staff after the patient's revocation."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    DocumentTemplate:
      description: The template; its ETag is its version.
      headers:
        ETag: {schema: {type: string}}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/DocumentTemplate"}
    Draft:
      description: The draft; its ETag is its version.
      headers:
        ETag: {schema: {type: string}}
        Cache-Control: {schema: {type: string, const: no-store}}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/DraftEvent"}
    DocumentInvalidRequest:
      description: "`invalid_request`: no or an unreadable If-Match where one is needed, or a body that is not the request, or over 1 MiB."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    DocumentForbidden:
      description: "`forbidden`: a patient."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    DocumentRecordForbidden:
      description: >-
        `consent_required`: the encounter's practitioner after the patient revoked their consent; `forbidden`:
        anyone else who sees the encounter.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    InvalidDocumentTemplate:
      description: "`invalid_template`: the template breaks a rule; `keys` names the offending fields (none for the template as a whole)."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/KeyedError"}
    GroupNameInvalid:
      description: "`invalid_request`: no If-Match, an unreadable body, a language the app does not have, a name outside 1 to 100 characters, or a decision other than approved or needs_changes."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    GroupNameForbidden:
      description: "`forbidden`: the caller is no reviewer of the term list."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    GroupNameNotFound:
      description: "`not_found`: no such group, or no name in the language."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    GroupNameConflict:
      description: "`version_conflict`: the name changed since it was read."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotificationInvalidRequest:
      description: "`invalid_request`: a body that is not the request, a platform other than android or ios, a token that is not 1 to 4096 visible ASCII characters, a webhook URL that is not https to a public host, no or an unknown event, or an eleventh webhook."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    ClinicAdminOnly:
      description: "`forbidden`: staff of the clinic who are not its admin."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    ClinicNotFound:
      description: "`not_found`: not staff of a clinic (a patient)."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthenticated:
      description: "`unauthenticated`: no valid session."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Questionnaire:
      description: The questionnaire's version.
      headers:
        ETag: {schema: {type: string}, description: 'The version, W/"<versionId>".'}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Questionnaire"}
    QuestionnaireDefault:
      description: The role's default questionnaire.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/QuestionnaireDefault"}
    QuestionnaireForbidden:
      description: "`forbidden`: the caller is not staff of a clinic (a patient); or `csrf`."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    QuestionnaireNotFound:
      description: "`not_found`: no such questionnaire in the caller's clinic."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    QuestionnaireChanged:
      description: "`version_conflict`: the version changed since it was read; read it again."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    InvalidQuestionnaire:
      description: >-
        `invalid_questionnaire`: the content breaks a rule of docs/questionnaire/SPEC.md §2 "Item model",
        "Limits" or "linkIds"; `linkIds` names the offending items (none when the title, the description, the
        number of items or a malformed linkId is at fault).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    QuestionnaireResponse:
      description: The questionnaire request and its answers.
      headers:
        ETag: {schema: {type: string}, description: 'The version, W/"<versionId>".'}
        Cache-Control: {schema: {type: string, const: no-store}}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/QuestionnaireResponse"}
    QuestionnaireResponseNotFound:
      description: "`not_found`: no such questionnaire request, or the caller may not see it."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    QuestionnaireResponseChanged:
      description: "`version_conflict`: the answers changed since they were read; read them again."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    AnswersForbidden:
      description: "`forbidden`: the caller sees the request but is not its patient (staff); or `csrf`."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    AnswersClosed:
      description: >-
        `submitted`: already submitted; `withdrawn`: the practitioner withdrew it; `appointment_closed`: the
        appointment is no longer booked (cancelled); `past_due`: the appointment has started;
        `consent_required`: the patient's consent with the clinic is not active.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    AnswersInvalid:
      description: >-
        `answers_invalid`: an answer does not fit its item's type or limits (docs/questionnaire/SPEC.md §2
        "Limits"), an answer is given to an attachment item (files go through
        `/questionnaire-responses/{id}/items/{linkId}/attachments`), or, on submit, a shown required question
        is unanswered; `linkIds` names them in document order (an answer to no item of the questionnaire is
        refused without being named).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Binary:
      description: The file, as stored.
      headers:
        Cache-Control: {schema: {type: string, const: no-store}}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Binary"}
    BinaryRetried:
      description: An identical file the item already holds; nothing new was stored.
      headers:
        Cache-Control: {schema: {type: string, const: no-store}}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Binary"}
    BinaryNotFound:
      description: "`not_found`: no such file, or the caller may not see it."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    BinaryContent:
      description: >-
        The whole file (200) or the requested range (206), in the type detected on upload. Served with
        `X-Content-Type-Options: nosniff`, `Cross-Origin-Resource-Policy: same-origin`, `Content-Disposition:
        inline` with the title as `filename*`, and `Content-Security-Policy: default-src 'none'`.
      headers:
        Content-Length: {schema: {type: integer, format: int64}}
        Content-Range: {schema: {type: string}, description: "206 only: `bytes <first>-<last>/<size>`."}
        Accept-Ranges: {schema: {type: string, const: bytes}}
        ETag: {schema: {type: string}, description: "The file's SHA-1, a strong ETag."}
        Cache-Control: {schema: {type: string, const: "private, no-store"}}
      content:
        application/pdf:
          schema: {type: string, format: binary}
        image/jpeg:
          schema: {type: string, format: binary}
        image/png:
          schema: {type: string, format: binary}
        video/mp4:
          schema: {type: string, format: binary}
    LoginStep:
      description: >-
        The next step (`verify` or `enrol`, with the challenge), or `done` with the session: in the
        `salus_session` cookie (HttpOnly, Secure, SameSite=Strict) when `X-Salus-CSRF: 1` was sent, else as
        `token`. Not cached.
      headers:
        Cache-Control: {schema: {type: string, const: no-store}}
        Set-Cookie: {schema: {type: string}, description: "salus_session, for the web app"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/LoginResponse"}
    RateLimited:
      description: "`rate_limited`: too many attempts; the password was not checked."
      headers:
        Retry-After: {schema: {type: integer}, description: Seconds until the window ends.}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    CSRF:
      description: "`csrf`: a write with the session cookie and no `X-Salus-CSRF: 1`."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    InternalError:
      description: "`internal error`."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: salus_session
      description: The web app's session (HttpOnly, Secure, SameSite=Strict).
    bearerAuth:
      type: http
      scheme: bearer
      description: The mobile app's session token.
    livekitWebhook:
      type: apiKey
      in: header
      name: Authorization
      description: LiveKit's webhook signature, a JWT of the API key pair with the body's SHA-256 (no Bearer prefix).
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
        password:
          type: string
        language:
          $ref: "#/components/schemas/Language"
          description: The language the user picked on the device before signing in; saved as their choice.
        detectedLanguage:
          $ref: "#/components/schemas/Language"
          description: >-
            The language the client matched from the browser's or the device's languages; saved for e-mails
            while the user has no choice of their own.
    LoginResponse:
      type: object
      required: [next]
      properties:
        next:
          type: string
          enum: [done, verify, enrol]
        challenge:
          type: string
          description: For `verify` and `enrol`; valid 5 minutes.
        token:
          type: string
          description: "The session token, for `done` without `X-Salus-CSRF`; send it as `Authorization: Bearer <token>`."
        expiresAt:
          type: string
          format: date-time
          description: For `done`. Absolute; 12 hours for staff, 30 days for patients.
    EnrolRequest:
      type: object
      additionalProperties: false
      properties:
        challenge:
          type: string
          description: The login challenge; omitted when enrolling from a session.
    Enrolment:
      type: object
      required: [secret, uri]
      properties:
        secret:
          type: string
          description: Base32, for manual entry.
        uri:
          type: string
          description: The otpauth:// URI, for a QR code.
    ConfirmRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        challenge:
          type: string
          description: The login challenge; omitted when enrolling from a session.
        code:
          type: string
          description: Six digits from the authenticator app.
    VerifyRequest:
      type: object
      required: [challenge, code]
      additionalProperties: false
      properties:
        challenge:
          type: string
        code:
          type: string
          description: Six digits from the authenticator app.
    RegisterRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: Counted in characters, not bytes.
        language:
          $ref: "#/components/schemas/Language"
          description: The language the user picked on the device before signing in; saved as their choice.
        detectedLanguage:
          $ref: "#/components/schemas/Language"
          description: >-
            The language the client matched from the browser's or the device's languages; saved for e-mails
            while the user has no choice of their own.
    InviteRequest:
      type: object
      required: [email, role]
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 254
        role:
          type: string
          enum: [admin, practitioner]
        givenName:
          type: string
          maxLength: 200
          description: Required for a practitioner; absent for an admin.
        familyName:
          type: string
          maxLength: 200
          description: Required for a practitioner; absent for an admin.
    Invite:
      type: object
      required: [id, email, role, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [admin, practitioner]
        givenName:
          type: string
        familyName:
          type: string
        expiresAt:
          type: string
          format: date-time
    InviteList:
      type: object
      required: [invites]
      properties:
        invites:
          type: array
          items: {$ref: "#/components/schemas/Invite"}
    AcceptInviteRequest:
      type: object
      required: [token, password]
      additionalProperties: false
      properties:
        token:
          type: string
          description: From the invite link's fragment.
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: Counted in characters, not bytes.
        language:
          $ref: "#/components/schemas/Language"
          description: The language the user picked on the device before signing in; saved as their choice.
        detectedLanguage:
          $ref: "#/components/schemas/Language"
          description: >-
            The language the client matched from the browser's or the device's languages; saved for e-mails
            while the user has no choice of their own.
    Acceptance:
      type: object
      required: [challenge, secret, uri]
      properties:
        challenge:
          type: string
          description: For `/auth/mfa/confirm`; valid 5 minutes.
        secret:
          type: string
          description: Base32, for manual entry.
        uri:
          type: string
          description: The otpauth:// URI, for a QR code.
    Account:
      type: object
      required: [id, email, role, mfaEnrolled]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [admin, practitioner, patient]
        organizationId:
          type: string
          format: uuid
          description: The clinic of a staff account; absent for a patient.
        practitionerId:
          type: string
          format: uuid
          description: >-
            The directory's Practitioner of a practitioner account, for searches by practitioner; absent
            otherwise.
        mfaEnrolled:
          type: boolean
        language:
          $ref: "#/components/schemas/Language"
          description: >-
            The language the user chose; absent while they follow the browser's or the device's language,
            which the client then matches itself.
        termReviewer:
          type: boolean
          description: >-
            True for a reviewer of the medical term list, a permission only the operator grants (salusctl
            term-reviewer); absent otherwise.
    UpdateMeRequest:
      type: object
      required: [language]
      additionalProperties: false
      properties:
        language:
          description: The language chosen, or `null` to follow the browser's or the device's language again.
          oneOf:
            - $ref: "#/components/schemas/Language"
            - type: "null"
    Language:
      type: string
      enum: [bs, hr, sr-Latn, sr-Cyrl, en, de, ar, tr, it, fr]
      description: >-
        A BCP 47 tag (docs/i18n/SPEC.md §3 "Tags"). Staff accounts and a clinic's default language take only
        the staff languages, the first five: bs, hr, sr-Latn, sr-Cyrl, en. Serbian is ijekavian in both scripts.
    DiagnosisGroupNameList:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items: {$ref: "#/components/schemas/DiagnosisGroupName"}
    DiagnosisGroupName:
      type: object
      required: [code, language, text, review, versionId]
      properties:
        code: {type: string}
        parent: {type: string, description: "The group of a subgroup; absent for a group and in a write's answer."}
        language: {$ref: "#/components/schemas/Language"}
        text: {type: string}
        review: {$ref: "#/components/schemas/Review"}
        versionId: {type: integer, format: int32}
    DiagnosisGroupList:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items: {$ref: "#/components/schemas/DiagnosisGroup"}
    DiagnosisGroup:
      type: object
      required: [code, name, reviewStatus]
      properties:
        code: {type: string, description: "A stable slug, such as respiratory-infections."}
        parent: {type: string, description: "The group of a subgroup; absent for a group."}
        name: {type: string}
        reviewStatus: {$ref: "#/components/schemas/ReviewStatus"}
    PlaceList:
      type: object
      required: [places]
      properties:
        places:
          type: array
          items: {$ref: "#/components/schemas/Place"}
    Place:
      type: object
      required: [id, kind, nameLatn, nameCyrl]
      properties:
        id: {type: string, description: "An ISO 3166-2:BA code (entity, region) or a Wikidata id (city)."}
        kind: {type: string, enum: [entity, region, city]}
        parent: {type: string, description: "Absent for the entity and for a region that is its own entity."}
        nameLatn: {type: string}
        nameCyrl: {type: string}
    TermLanguage:
      type: string
      enum: [la, bs, hr, sr-Latn, sr-Cyrl, en, de, ar, tr, it, fr]
      description: A label's language (docs/terminology/SPEC.md §3 "Database"), Latin then the ten app languages.
    TermCategory:
      type: string
      enum: [anatomy, diagnosis, symptom, procedure, drug]
    TermCodes:
      type: object
      description: >-
        The codes that identify the term, each absent when it has none; several codes of one kind are joined
        with ", ". Identifiers only, from Wikidata (docs/terminology/SOURCES.md).
      properties:
        wikidata: {type: string, description: "The Wikidata item, e.g. Q9368."}
        icd10: {type: string}
        ta98: {type: string, description: Terminologia Anatomica 98.}
        atc: {type: string}
        pcs: {type: string, description: An ICD-10-PCS or ICD-9-CM procedure code.}
    TermLabels:
      type: object
      required: [language, preferred, synonyms]
      properties:
        language: {$ref: "#/components/schemas/TermLanguage"}
        preferred: {type: string, description: "The preferred label in this language; the first alphabetically when none is marked."}
        synonyms:
          type: array
          description: The other labels in this language, alphabetically; empty when there are none.
          items: {type: string}
    Term:
      type: object
      required: [id, category, reviewStatus, codes, labels]
      properties:
        id: {type: string, format: uuid}
        category: {$ref: "#/components/schemas/TermCategory"}
        reviewStatus:
          allOf: [{$ref: "#/components/schemas/ReviewStatus"}]
          description: "Anything but `approved` is marked \"Not reviewed yet\" in the UI."
        codes: {$ref: "#/components/schemas/TermCodes"}
        labels:
          type: array
          description: >-
            One entry per requested language that has a label, in the order requested. A language with no label
            is absent: gaps are never filled by machine translation.
          items: {$ref: "#/components/schemas/TermLabels"}
    ReviewStatus:
      type: string
      enum: [unreviewed, approved, needs_changes]
      description: >-
        Where a term, a translation or an explanation is in its review (docs/plans/v1-finish.md "Contract"): one
        status for all three. Editing an approved entry sets it back to `unreviewed`.
    Review:
      type: object
      required: [status]
      properties:
        status: {$ref: "#/components/schemas/ReviewStatus"}
        reviewedBy:
          type: string
          format: uuid
          description: The account that last set the status; absent when the curator's file set it or before the first review.
        reviewedAt:
          type: string
          format: date-time
          description: When it was last approved or marked as needing changes; kept when the entry goes back to unreviewed.
        note: {type: string, description: "The reviewer's note, e.g. what needs to change."}
    TermTranslation:
      type: object
      required: [termId, language, review, versionId, lastUpdated]
      description: >-
        The review of a term's labels in one language. A term and language with labels and no translation stored is
        unreviewed.
      properties:
        termId: {type: string, format: uuid}
        language: {$ref: "#/components/schemas/TermLanguage"}
        review: {$ref: "#/components/schemas/Review"}
        versionId: {type: integer, format: int32, minimum: 1, description: "For If-Match on an edit."}
        lastUpdated: {type: string, format: date-time}
    ExplainedTerm:
      type: object
      description: >-
        A term's plain-language explanation as a viewer reads it (SAL-13): informational, never a diagnosis.
        Shown with "Not reviewed yet" unless `reviewStatus` is `approved`.
      required: [termId, language, text, reviewStatus]
      properties:
        termId: {type: string, format: uuid}
        language:
          $ref: "#/components/schemas/TermLanguage"
          description: The language of `text`; English when the viewer's language has no explanation of the term.
        text: {type: string, minLength: 1, maxLength: 500}
        reviewStatus:
          type: string
          enum: [unreviewed, approved]
          description: An explanation that needs changes is not given.
    ExplainedTermList:
      type: object
      required: [explanations]
      properties:
        explanations:
          type: array
          description: One per term with an explanation in the language or in English, by term id.
          items: {$ref: "#/components/schemas/ExplainedTerm"}
    DocumentTerms:
      type: object
      required: [sections]
      properties:
        sections:
          type: array
          description: One per field, in the Composition's section order.
          items: {$ref: "#/components/schemas/DocumentTermsSection"}
    DocumentTermsSection:
      type: object
      description: >-
        The explained terms of one field: per line of its value, as the Composition's section narrative has them
        (a paragraph or a list item per line), the spans in that line; no lines for a field left empty.
      required: [key, lines]
      properties:
        key: {type: string, description: The field's template key.}
        lines:
          type: array
          items:
            type: array
            items: {$ref: "#/components/schemas/TermSpan"}
    TermExplanation:
      type: object
      required: [termId, language, text, review, versionId, lastUpdated]
      description: >-
        A short plain-language explanation of a term in an app language, for patients and staff: informational,
        never a diagnosis (CLAUDE.md "Copy"), and labelled as such wherever it is shown.
      properties:
        termId: {type: string, format: uuid}
        language: {$ref: "#/components/schemas/Language"}
        text: {type: string, minLength: 1, maxLength: 500}
        review: {$ref: "#/components/schemas/Review"}
        versionId: {type: integer, format: int32, minimum: 1, description: "For If-Match on an edit."}
        lastUpdated: {type: string, format: date-time}
    TermList:
      type: object
      required: [terms]
      properties:
        terms:
          type: array
          items: {$ref: "#/components/schemas/Term"}
    TermLabelsEdit:
      type: object
      required: [preferred, synonyms]
      additionalProperties: false
      description: A term's labels in one language, each trimmed with its white space collapsed.
      properties:
        preferred: {type: string, minLength: 1, maxLength: 300}
        synonyms:
          type: array
          maxItems: 20
          items: {type: string, minLength: 1, maxLength: 300}
    TermExplanationEdit:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: {type: string, minLength: 1, maxLength: 500}
    ReviewDecision:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [approved, needs_changes]
        note: {type: string, maxLength: 500, description: "Needed with needs_changes: what has to change."}
    TermReviewEntry:
      type: object
      required: [term, status]
      description: >-
        A term in the queue's language: the term with its labels in that language (first, when it has any), Latin
        and English, the review of its labels in the language (absent while it has none) and its explanation there
        (absent while there is none).
      properties:
        term: {$ref: "#/components/schemas/Term"}
        status: {$ref: "#/components/schemas/ReviewStatus"}
        translation: {$ref: "#/components/schemas/TermTranslation"}
        explanation: {$ref: "#/components/schemas/TermExplanation"}
    TermReviewPage:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: {$ref: "#/components/schemas/TermReviewEntry"}
        next: {type: string, description: "Pass as `after` for the next page; absent on the last."}
    TermReviewProgress:
      type: object
      required: [languages]
      properties:
        languages:
          type: array
          items:
            type: object
            required: [language, terms, approved, needsChanges]
            properties:
              language: {$ref: "#/components/schemas/TermLanguage"}
              terms: {type: integer, format: int32, description: Every term.}
              approved: {type: integer, format: int32}
              needsChanges: {type: integer, format: int32}
    Patient:
      type: object
      required: [id, givenName, familyName, birthDate, versionId, lastUpdated]
      description: The patient's profile (docs/booking/SPEC.md "Profile"). Health data.
      properties:
        id:
          type: string
          format: uuid
        givenName:
          type: string
        familyName:
          type: string
        birthDate:
          type: string
          format: date
        phone:
          type: string
          description: E.164; absent when none was given.
        versionId:
          type: integer
          format: int32
        lastUpdated:
          type: string
          format: date-time
    SavePatientRequest:
      type: object
      required: [givenName, familyName, birthDate]
      additionalProperties: false
      properties:
        givenName:
          type: string
          description: 1 to 100 characters after trimming.
        familyName:
          type: string
          description: 1 to 100 characters after trimming.
        birthDate:
          type: string
          format: date
          description: Before today (UTC), not before 1900-01-01.
        phone:
          type: string
          pattern: "^\\+[0-9]{8,15}$"
          description: Optional, E.164 (+ and 8 to 15 digits, no spaces); absent for none.
        versionId:
          type: integer
          format: int32
          minimum: 1
          description: The version being updated; absent to create the profile.
    GrantConsentRequest:
      type: object
      required: [organizationId]
      additionalProperties: false
      properties:
        organizationId:
          type: string
          format: uuid
          description: The clinic the profile and appointments are shared with.
        kind:
          $ref: "#/components/schemas/ConsentKind"
    ConsentKind:
      type: string
      enum: [care, transcription]
      default: care
      description: >-
        What the consent is for: `care`, sharing the profile and appointments with the clinic; `transcription`,
        transcription and translation of the consultations with the clinic, with AI assistance for the
        practitioner (suggestions, document drafts), used only with an active care consent (SAL-12).
    Consent:
      type: object
      required: [id, organizationId, kind, status, dateTime]
      description: >-
        A patient's consent with a clinic (FHIR Consent): to share their profile and appointments with it for
        care, or to transcription. Health data: it shows whom the patient consults.
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ConsentKind"
        status:
          type: string
          enum: [active, inactive]
        dateTime:
          type: string
          format: date-time
          description: When it was granted.
        revokedAt:
          type: string
          format: date-time
          description: When it was revoked; absent while active.
    ConsentList:
      type: object
      required: [consents]
      properties:
        consents:
          type: array
          items: {$ref: "#/components/schemas/Consent"}
    AvailabilityRule:
      type: object
      required: [day, start, end]
      additionalProperties: false
      description: One weekly window, in the clinic's time zone.
      properties:
        day:
          type: integer
          minimum: 1
          maximum: 7
          description: ISO weekday, 1 Monday to 7 Sunday.
        start:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          examples: ["09:00"]
        end:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: After start.
          examples: ["12:00"]
    Availability:
      type: object
      required: [practitionerRoleId, availability, versionId]
      properties:
        id:
          type: string
          format: uuid
          description: The schedule's id (FHIR Schedule); absent before the first edit.
        practitionerRoleId:
          type: string
          format: uuid
        slotMinutes:
          type: integer
          format: int32
          description: Absent before the first edit.
        availability:
          type: array
          items: {$ref: "#/components/schemas/AvailabilityRule"}
          description: Sorted by day and start.
        versionId:
          type: integer
          format: int32
          description: 0 before the first edit.
    SaveAvailabilityRequest:
      type: object
      required: [slotMinutes, availability]
      additionalProperties: false
      properties:
        slotMinutes:
          type: integer
          format: int32
          minimum: 5
          maximum: 240
          multipleOf: 5
        availability:
          type: array
          items: {$ref: "#/components/schemas/AvailabilityRule"}
    SetSpecialtyRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          description: A SNOMED CT code, one of the directory's twelve specialties.
          examples: ["394579002"]
    Specialty:
      type: object
      required: [system, code, display, text]
      description: A practitioner role's specialty, a coding from FHIR R4 ValueSet c80-practice-codes.
      properties:
        system:
          type: string
          const: http://snomed.info/sct
        code:
          type: string
        display:
          type: string
          description: The concept's display in the value set.
        text:
          type: string
          description: The name the apps show.
    SpecialtyList:
      type: object
      required: [specialties]
      properties:
        specialties:
          type: array
          items: {$ref: "#/components/schemas/Specialty"}
    RoleSpecialty:
      type: object
      required: [id, versionId]
      properties:
        id:
          type: string
          format: uuid
        specialty:
          $ref: "#/components/schemas/Specialty"
        versionId:
          type: integer
          format: int32
    BookAppointmentRequest:
      type: object
      required: [slotId]
      additionalProperties: false
      properties:
        slotId:
          type: string
          format: uuid
          description: A free slot, as Slot?schedule=…&status=free gives it.
    SetAppointmentStatusRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [fulfilled, noshow]
    Appointment:
      type: object
      required: [id, organizationId, practitionerRoleId, slotId, start, end, status, versionId]
      description: >-
        An appointment after a booking or a change (FHIR Appointment; reads go through FHIR). Health data: it
        shows whom the patient consults. Neither the patient nor who cancelled is in it.
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        practitionerRoleId:
          type: string
          format: uuid
        slotId:
          type: string
          format: uuid
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        status:
          type: string
          enum: [booked, cancelled, fulfilled, noshow]
        cancellationReason:
          type: string
          enum: [pat, prov]
          description: >-
            http://terminology.hl7.org/CodeSystem/appointment-cancellation-reason: `pat` the patient (also by
            revoking consent), `prov` staff. Absent unless cancelled.
        cancelledAt:
          type: string
          format: date-time
          description: Absent unless cancelled.
        versionId:
          type: integer
          format: int32
    SaveQuestionnaireRequest:
      type: object
      required: [title, item]
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 200
          description: Not blank.
        description:
          type: string
          maxLength: 1000
        item:
          type: array
          maxItems: 200
          items: {$ref: "#/components/schemas/QuestionnaireItem"}
          description: At most 200 items in all, sections and instructions included.
        language:
          $ref: "#/components/schemas/Language"
          description: The original language; absent keeps the draft's (a new questionnaire's is the clinic's default language).
        translations:
          type: array
          items: {$ref: "#/components/schemas/QuestionnaireTranslation"}
          description: >-
            The draft's translations, all of them: one per language, none in the original language. A
            translation may be incomplete while the version is a draft; publishing refuses it until complete.
            Absent keeps the draft's.
    QuestionnaireItem:
      type: object
      required: [linkId, text, type]
      additionalProperties: false
      description: >-
        One item, as FHIR Questionnaire.item. Sections (`group`) are top level only and hold questions and
        instructions. Single and multiple choice are both `choice`; `repeats` tells them apart.
      properties:
        linkId:
          type: string
          pattern: "^[A-Za-z0-9-]{1,64}$"
          description: Opaque and random, unique within the questionnaire, kept by later versions.
        text:
          type: string
          maxLength: 500
          description: Not blank.
        type:
          type: string
          enum: [group, display, string, text, boolean, choice, integer, decimal, date, attachment]
        required:
          type: boolean
          description: Questions only.
        repeats:
          type: boolean
          description: Choice only, several answers.
        accept:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          description: >-
            Attachment only, required: the kinds of file it accepts, `photo` (JPEG, PNG), `document` (PDF),
            `video` (MP4).
          items:
            type: string
            enum: [photo, document, video]
        maxFiles:
          type: integer
          format: int32
          minimum: 1
          maximum: 10
          description: Attachment only, required, the number of files it takes.
        help:
          type: string
          maxLength: 500
          description: Help text, on questions and sections.
        answerOption:
          type: array
          minItems: 2
          maxItems: 50
          description: Choice only, each value different.
          items:
            type: object
            required: [valueString]
            additionalProperties: false
            properties:
              valueString:
                type: string
                minLength: 1
                maxLength: 200
        enableWhen:
          type: object
          required: [question]
          additionalProperties: false
          description: >-
            Shown only when the earlier item `question`, a boolean or a choice, is answered `answerBoolean` or
            `answerString` (one of its options); a choice with repeats when any answer matches.
          properties:
            question:
              type: string
            answerBoolean:
              type: boolean
            answerString:
              type: string
        item:
          type: array
          items: {$ref: "#/components/schemas/QuestionnaireItem"}
          description: A section's questions and instructions.
    Questionnaire:
      type: object
      required: [id, url, status, title, item, lastUpdated, version, versionId]
      description: A version of a questionnaire (FHIR Questionnaire; reads go through FHIR).
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          description: The canonical url, the same for every version of the questionnaire.
          examples: ["https://salus.invalid/fhir/Questionnaire/0b6f3a0e-1d1c-4c43-9a51-6d2b9b1d5e7a"]
        status:
          type: string
          enum: [draft, active, retired]
        title:
          type: string
        description:
          type: string
        item:
          type: array
          items: {$ref: "#/components/schemas/QuestionnaireItem"}
        language:
          $ref: "#/components/schemas/Language"
          description: The original language (Questionnaire.language).
        translations:
          type: array
          items: {$ref: "#/components/schemas/QuestionnaireTranslation"}
          description: >-
            Its translations, in the language list's order. A patient reads them through FHIR, as the
            translation extension on each translated element.
        lastUpdated:
          type: string
          format: date-time
        version:
          type: integer
          format: int32
          description: 1, 2, … within the questionnaire.
        versionId:
          type: integer
          format: int32
          description: The version of this row, for If-Match.
    QuestionnaireTranslation:
      type: object
      required: [language, title, items]
      additionalProperties: false
      description: A version's texts in another language (docs/i18n/SPEC.md §3 "Questionnaires").
      properties:
        language:
          $ref: "#/components/schemas/Language"
        title:
          type: string
          maxLength: 200
          description: Empty while not yet translated.
        description:
          type: string
          maxLength: 1000
        items:
          type: object
          description: The items' texts by linkId; an item missing here is not yet translated.
          additionalProperties: {$ref: "#/components/schemas/QuestionnaireItemTranslation"}
    QuestionnaireItemTranslation:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
          description: The item's text, within its limits as in the original.
        help:
          type: string
          description: The help text; for an item that has one.
        options:
          type: array
          items: {type: string}
          description: A choice item's option texts, by the options' position; as many as the item has.
    QuestionnaireDefault:
      type: object
      required: [practitionerRoleId, versionId]
      properties:
        practitionerRoleId:
          type: string
          format: uuid
        url:
          type: string
          description: The canonical url of the default questionnaire; absent while the role has none.
        versionId:
          type: integer
          format: int32
          description: 0 while the role has none.
    SetRoleQuestionnaireRequest:
      type: object
      required: [questionnaireId]
      additionalProperties: false
      properties:
        questionnaireId:
          type: string
          format: uuid
          description: Any version of the questionnaire.
    RequestQuestionnaireRequest:
      type: object
      required: [questionnaireId]
      additionalProperties: false
      properties:
        questionnaireId:
          type: string
          format: uuid
          description: The active version to ask.
    AnswerValue:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      description: >-
        One answer value, as FHIR QuestionnaireResponse.item.answer.value[x], of the item's type: `valueString`
        for string, text and choice (one of its options), `valueBoolean`, `valueInteger`, `valueDecimal`
        (written plainly, at most 15 significant digits), `valueDate` (YYYY-MM-DD).
      properties:
        valueString:
          type: string
          minLength: 1
          maxLength: 4000
        valueBoolean:
          type: boolean
        valueInteger:
          type: integer
          format: int32
        valueDecimal:
          type: number
        valueDate:
          type: string
          format: date
    Answer:
      type: object
      required: [linkId, values]
      additionalProperties: false
      description: The answer to one question; several values only for a choice with repeats.
      properties:
        linkId:
          type: string
        values:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/AnswerValue"}
    StartQuestionnaireRequest:
      type: object
      required: [language]
      additionalProperties: false
      properties:
        language:
          $ref: "#/components/schemas/Language"
    SaveAnswersRequest:
      type: object
      required: [answers]
      additionalProperties: false
      properties:
        answers:
          type: array
          description: Every saved answer; a question left out is unanswered.
          items: {$ref: "#/components/schemas/Answer"}
    QuestionnaireResponse:
      type: object
      required: [id, appointmentId, questionnaireId, status, source, answers, dueAt, lastUpdated, versionId]
      description: >-
        A questionnaire the patient is asked to fill in before an appointment, and their answers (FHIR
        QuestionnaireResponse; reads go through FHIR, the answers nested under the questionnaire's sections).
      properties:
        id:
          type: string
          format: uuid
        appointmentId:
          type: string
          format: uuid
        questionnaireId:
          type: string
          format: uuid
          description: The questionnaire version asked.
        status:
          type: string
          enum: [in-progress, completed, stopped]
          description: In progress, submitted, or withdrawn by the practitioner.
        source:
          type: string
          enum: [default, added]
          description: The practitioner role's default, with the booking, or added by the practitioner.
        answers:
          type: array
          items: {$ref: "#/components/schemas/Answer"}
        dueAt:
          type: string
          format: date-time
          description: The appointment's start; the answers are due before it.
        authored:
          type: string
          format: date-time
          description: When the patient submitted; absent before.
        language:
          $ref: "#/components/schemas/Language"
          description: The language the patient answers in; absent until they start.
        lastUpdated:
          type: string
          format: date-time
        versionId:
          type: integer
          format: int32
          description: The version of the answers, for If-Match.
    Binary:
      type: object
      required: [id, contentType, size, title, status]
      description: A file attached to a questionnaire answer (FHIR Binary; its bytes at `/binaries/{id}/content`).
      properties:
        id:
          type: string
          format: uuid
        contentType:
          type: string
          enum: [application/pdf, image/jpeg, image/png, video/mp4]
          description: Detected from the bytes on upload.
        size:
          type: integer
          format: int64
          description: Bytes.
        title:
          type: string
          maxLength: 200
          description: The file's name as uploaded; may be empty.
        status:
          type: string
          enum: [quarantined, clean, rejected]
          description: >-
            `quarantined` until the malware scan is done; `clean` may be opened; `rejected` was found to hold
            malware and is removed from the answer.
    Error:
      type: object
      required: [error]
      description: Every JSON API error. The code is fixed per case; it never carries internal text.
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_email
            - invalid_password
            - email_taken
            - unauthenticated
            - wrong_credentials
            - rate_limited
            - invalid_challenge
            - wrong_code
            - already_enrolled
            - not_enrolled
            - csrf
            - forbidden
            - invalid_role
            - invalid_name
            - invalid_invite
            - invalid_birth_date
            - invalid_phone
            - not_found
            - version_conflict
            - consent_active
            - consent_inactive
            - profile_required
            - invalid_specialty
            - invalid_slot_minutes
            - invalid_availability
            - consent_required
            - transcription_consent_required
            - slot_unavailable
            - cancellation_window_closed
            - appointment_closed
            - appointment_not_started
            - invalid_status
            - join_window_not_open
            - consultation_ended
            - practitioner_did_not_join
            - consultation_not_started
            - not_draft
            - not_active
            - draft_exists
            - invalid_questionnaire
            - already_requested
            - appointment_started
            - submitted
            - withdrawn
            - past_due
            - answers_invalid
            - not_attachment_item
            - length_required
            - too_large
            - response_full
            - too_many_files
            - unsupported_type
            - scanning
            - range_not_satisfiable
            - attachments_pending
            - language_unavailable
            - language_locked
            - translation_incomplete
            - note_required
            - internal error
            - timeout
            - invalid_cursor
            - if_match_required
            - websocket_required
            - origin
        linkIds:
          type: array
          items: {type: string}
          description: >-
            With `invalid_questionnaire`, `answers_invalid` and `translation_incomplete` only, the offending
            items' linkIds in document order.
        language:
          $ref: "#/components/schemas/Language"
          description: With `translation_incomplete` only, the translation that is incomplete.
    ConsultationJoin:
      type: object
      required: [url, token, expiresAt, peerName, role]
      description: >-
        What a client needs to join the room. The token is a secret: it is never logged or stored. Health
        data: it shows whom the patient consults.
      properties:
        url:
          type: string
          description: The LiveKit server the client connects to (ws:// locally, wss:// deployed).
        token:
          type: string
          description: The LiveKit join token, valid 5 minutes for joining.
        expiresAt:
          type: string
          format: date-time
        peerName:
          type: string
          description: >-
            The other person's display name; empty when the caller may not see it (the practitioner after a
            revocation, or a practitioner not in the public directory).
        role:
          type: string
          enum: [patient, practitioner]
          description: The caller's role in the consultation.
    ConsultationStatus:
      type: object
      required: [state]
      description: >-
        Where an appointment's video consultation stands. Health data: it shows that the patient attended. The
        times are absent until they happen.
      properties:
        state:
          type: string
          enum: [not_started, open, ended]
        patientJoinedAt:
          type: string
          format: date-time
          description: When the patient first joined the room.
        practitionerJoinedAt:
          type: string
          format: date-time
          description: When the practitioner first joined the room.
        endedAt:
          type: string
          format: date-time
        endReason:
          type: string
          enum: [practitioner, window_closed, practitioner_absent, time_limit, cancelled]
          description: >-
            Why it ended: the practitioner ended it; the window closed with the room empty; the practitioner never
            joined; the 2-hour limit after the scheduled end; the appointment was cancelled.
        reason:
          type: string
          enum: [consent_withdrawn, cancelled, left, ended, practitioner_did_not_join, time_limit]
          description: >-
            Why the patient was removed or the consultation ended, as the clients show it: the patient was removed
            because their consent was withdrawn (also when that cancelled the appointment), or because the
            appointment was cancelled; while open, the patient who joined left on their own; the practitioner ended
            it or the window closed with the room empty; the window closed without the practitioner; the 2-hour
            limit. Absent while nobody has joined or left.
        transcription:
          type: boolean
          description: >-
            True while the consultation may be transcribed and translated, with AI assistance for the
            practitioner: the patient's care and transcription consents with the clinic are both active (SAL-12).
            Absent otherwise: the call runs without the transcription agent.
    LiveKitWebhookEvent:
      type: object
      description: >-
        LiveKit's WebhookEvent in its JSON form (protojson); only `event`, `room.name`, the participant's
        `identity` and `joinedAt`/`joinedAtMs`, and `createdAt` are read.
      properties:
        event: {type: string, examples: [participant_joined]}
      additionalProperties: true
    WebhookReceived:
      type: object
      description: An empty object.
      additionalProperties: false
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Unavailable:
      type: object
      required: [status, failed]
      properties:
        status:
          type: string
          const: unavailable
        failed:
          type: array
          description: Names of the failing checks.
          items:
            type: string
            enum: [postgres, redis]
    # The consultation's live messages (docs/plans/consult-intelligence.md): pushed to the practitioner's
    # browser over a WebSocket, and carried on the encounter's Redis Stream as the same bytes. Each is a
    # pkg/wire envelope of one event; api/contract_test.go keeps these in step with the Go types.
    ConsultMessage:
      description: One live message of a consultation, told apart by `type`.
      oneOf:
        - {$ref: "#/components/schemas/TranscriptMessage"}
        - {$ref: "#/components/schemas/SuggestionMessage"}
        - {$ref: "#/components/schemas/DraftMessage"}
      discriminator:
        propertyName: type
        mapping:
          transcript: "#/components/schemas/TranscriptMessage"
          suggestion: "#/components/schemas/SuggestionMessage"
          draft: "#/components/schemas/DraftMessage"
    ConsultFrame:
      description: >-
        One text frame of GET /encounters/{id}/events: a live message (one of ConsultMessage's), or the cursor
        sent before each one, told apart by `type`.
      oneOf:
        - {$ref: "#/components/schemas/TranscriptMessage"}
        - {$ref: "#/components/schemas/SuggestionMessage"}
        - {$ref: "#/components/schemas/DraftMessage"}
        # The cursor last: the Dart generator gives the flat model the last variant's payload, as before SAL-7.
        - {$ref: "#/components/schemas/CommandErrorMessage"}
        - {$ref: "#/components/schemas/CursorMessage"}
      discriminator:
        propertyName: type
        mapping:
          transcript: "#/components/schemas/TranscriptMessage"
          suggestion: "#/components/schemas/SuggestionMessage"
          draft: "#/components/schemas/DraftMessage"
          cursor: "#/components/schemas/CursorMessage"
          command_error: "#/components/schemas/CommandErrorMessage"
    # What the client sends on GET /encounters/{id}/events, and the answer to one that failed (SAL-7).
    ConsultCommand:
      description: A text frame the client sends on GET /encounters/{id}/events, told apart by `type`.
      oneOf:
        - {$ref: "#/components/schemas/SuggestionStatusMessage"}
      discriminator:
        propertyName: type
        mapping:
          suggestion_status: "#/components/schemas/SuggestionStatusMessage"
    SuggestionStatusMessage:
      type: object
      description: The practitioner dismisses, pins or unpins (`shown`) a suggestion of the stream's encounter.
      required: [type, version, payload]
      properties:
        type: {type: string, const: suggestion_status}
        version: {type: integer, const: 1}
        payload: {$ref: "#/components/schemas/SuggestionStatus"}
    SuggestionStatus:
      type: object
      required: [id, status]
      properties:
        id: {type: string, format: uuid}
        status:
          type: string
          enum: [shown, dismissed, pinned]
    CommandErrorMessage:
      type: object
      description: Answers a client's message that failed; nothing changed.
      required: [type, version, payload]
      properties:
        type: {type: string, const: command_error}
        version: {type: integer, const: 1}
        payload: {$ref: "#/components/schemas/CommandError"}
    CommandError:
      type: object
      required: [command, error]
      properties:
        command:
          type: string
          description: The failed message's `type`; empty when it was no envelope.
        id:
          type: string
          description: The suggestion the message named, when it named one.
        error:
          type: string
          description: >-
            `invalid_message`: no envelope; `unknown_command`: a type or version the server does not take;
            `invalid`: a payload or status the contract does not allow; `not_found`: no such suggestion of the
            encounter, or an encounter the caller may not see; `consent_required`: after a revocation;
            `forbidden`: not the encounter's practitioner; `internal`: a server error.
          enum: [invalid_message, unknown_command, invalid, not_found, consent_required, forbidden, internal]
    CursorMessage:
      type: object
      description: Sent before each live message, with the stream id of its entry, which a client resumes after.
      required: [type, version, payload]
      properties:
        type: {type: string, const: cursor}
        version: {type: integer, const: 1}
        payload: {$ref: "#/components/schemas/Cursor"}
    Cursor:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: The entry's stream id, `<milliseconds>-<sequence>`.
    Transcript:
      type: object
      required: [segments]
      properties:
        segments:
          type: array
          description: The stored final segments in the order they were said.
          items: {$ref: "#/components/schemas/TranscriptEvent"}
    TranscriptMessage:
      type: object
      required: [type, version, payload]
      properties:
        type: {type: string, const: transcript}
        version: {type: integer, const: 1}
        payload: {$ref: "#/components/schemas/TranscriptEvent"}
    SuggestionMessage:
      type: object
      required: [type, version, payload]
      properties:
        type: {type: string, const: suggestion}
        version: {type: integer, const: 1}
        payload: {$ref: "#/components/schemas/SuggestionEvent"}
    DraftMessage:
      type: object
      required: [type, version, payload]
      properties:
        type: {type: string, const: draft}
        version: {type: integer, const: 1}
        payload: {$ref: "#/components/schemas/DraftEvent"}
    TranscriptEvent:
      type: object
      description: >-
        One segment as it is recognised. Partial segments (`is_final` false) revise each other under the same
        `segment_id` until the final one; only final segments are stored.
      required: [encounter_id, segment_id, speaker, lang, original, translation, is_final, ts_start, ts_end]
      properties:
        encounter_id: {type: string, format: uuid}
        segment_id: {type: string, format: uuid}
        speaker:
          type: string
          enum: [practitioner, patient]
        lang:
          type: string
          description: The language the segment was spoken in, a BCP 47 tag.
        original:
          type: string
        translation:
          type: string
          description: >-
            Into the other participant's language; empty until it is translated. Partial segments and segments
            said in the other participant's language are not translated.
        translation_failed:
          type: boolean
          description: >-
            Present and true on a final segment that should have been translated and was not: the original is
            all there is. Absent otherwise.
        terms:
          $ref: "#/components/schemas/TranscriptTerms"
        is_final:
          type: boolean
        ts_start:
          type: string
          format: date-time
        ts_end:
          type: string
          format: date-time
    TranscriptTerms:
      type: object
      description: >-
        Where the terms with a plain-language explanation are in a final segment (SAL-13), for the tooltip that
        explains them: an overlay, the texts are never changed. Present only when a term was found; never stored.
      properties:
        original:
          type: array
          description: In `original`, in the speaker's language.
          items: {$ref: "#/components/schemas/TermSpan"}
        translation:
          type: array
          description: In `translation`, in the listener's language.
          items: {$ref: "#/components/schemas/TermSpan"}
    TermSpan:
      type: object
      description: >-
        A term found in a text: the UTF-16 offsets [start, end) of the words it was found by (JavaScript and Dart
        index strings so), and the term, whose explanation getTermExplanations gives. Spans do not overlap.
      required: [term_id, start, end]
      properties:
        term_id: {type: string, format: uuid}
        start: {type: integer, minimum: 0}
        end: {type: integer, minimum: 1}
    SuggestionEvent:
      type: object
      description: >-
        AI assistance for the practitioner only: a suggestion from a language model, citing the segments it came
        from; a prompt the practitioner may ignore, never a diagnosis. Whatever shows one labels it as AI
        assistance (`origin`). Pushed when shown and on every change of its status.
      required: [id, encounter_id, type, text, confidence, source_segment_ids, status, origin]
      properties:
        id: {type: string, format: uuid}
        encounter_id: {type: string, format: uuid}
        type:
          type: string
          enum: [diagnosis, question, red_flag, term]
          description: >-
            What the suggestion prompts: a diagnosis to consider (not one made), a question to ask, a red flag to
            check, or a term to explain.
        text:
          type: string
          minLength: 1
          maxLength: 300
        origin:
          type: string
          enum: [ai]
          description: Always `ai`, an AI model's suggestion, shown as AI assistance.
        confidence:
          type: number
          minimum: 0
          maximum: 1
        source_segment_ids:
          type: array
          minItems: 1
          items: {type: string, format: uuid}
        status:
          type: string
          enum: [shown, dismissed, pinned]
    DraftEvent:
      type: object
      description: A document drafted from a clinic's template (a FHIR Composition), pushed on every change.
      required: [draft_id, encounter_id, template_id, status, fields]
      properties:
        draft_id: {type: string, format: uuid}
        encounter_id: {type: string, format: uuid}
        template_id: {type: string, format: uuid}
        status:
          type: string
          enum: [preliminary, final, entered-in-error]
        fields:
          type: array
          minItems: 1
          description: In the template's order.
          items: {$ref: "#/components/schemas/DraftField"}
        version_id:
          type: integer
          format: int32
          description: >-
            The draft's version (Composition meta.versionId): what a sign names in If-Match, and by which a page
            tells a redraft from a replay. Absent only in events from before SAL-8.
    DraftField:
      type: object
      description: >-
        One field by its template key. A filled field has a value and the segments it came from (none when the
        practitioner typed it); a missing one has neither.
      required: [key, value, missing]
      properties:
        key:
          type: string
        value:
          type: string
        source_segment_ids:
          type: array
          items: {type: string, format: uuid}
        missing:
          type: boolean
    DocumentTemplate:
      type: object
      description: >-
        A clinic's document template (no personal data): its fields in its original language, and its
        translations. `status` draft marks wording the clinic has not reviewed yet (the seeded examples are
        placeholders); both statuses can be drafted from.
      required: [id, title, language, status, typeCode, fields, translations, lastUpdated, versionId]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        language: {$ref: "#/components/schemas/Language"}
        status:
          type: string
          enum: [draft, active]
        typeCode:
          type: string
          description: The LOINC code of the document type (Composition.type), e.g. 11488-4 consult note, 57133-1 referral note.
        fields:
          type: array
          items: {$ref: "#/components/schemas/DocumentTemplateField"}
        translations:
          type: array
          items: {$ref: "#/components/schemas/DocumentTemplateTranslation"}
        lastUpdated: {type: string, format: date-time}
        versionId: {type: integer, format: int32}
    DocumentTemplateField:
      type: object
      description: >-
        One field: its key (lowercase letters, digits and underscores, stable across languages), its type (a list
        is one item per line, a date YYYY-MM-DD, a coded term one ICD-10 code), the label and instruction the
        model and the practitioner read, and whether the document needs it (a required field is never guessed:
        it stays missing until the transcript covers it, and a sign needs it).
      required: [key, type, label, required]
      properties:
        key: {type: string, pattern: "^[a-z][a-z0-9_]{0,39}$"}
        type:
          type: string
          enum: [text, list, date, coded]
        label: {type: string, maxLength: 200}
        instruction: {type: string, maxLength: 1000}
        required: {type: boolean}
    DocumentTemplateTranslation:
      type: object
      required: [language, title, fields]
      properties:
        language: {$ref: "#/components/schemas/Language"}
        title: {type: string}
        fields:
          type: object
          description: Each field's texts by key; every field, and an instruction exactly where the original has one.
          additionalProperties: {$ref: "#/components/schemas/DocumentFieldTexts"}
    DocumentFieldTexts:
      type: object
      required: [label]
      properties:
        label: {type: string}
        instruction: {type: string}
    DocumentTemplates:
      type: object
      required: [templates]
      properties:
        templates:
          type: array
          items: {$ref: "#/components/schemas/DocumentTemplate"}
    SaveDocumentTemplateRequest:
      type: object
      required: [title, language, status, typeCode, fields]
      properties:
        title: {type: string, maxLength: 200}
        language: {$ref: "#/components/schemas/Language"}
        status:
          type: string
          enum: [draft, active]
        typeCode: {type: string, pattern: "^[0-9]{1,7}-[0-9]$"}
        fields:
          type: array
          minItems: 1
          maxItems: 50
          items: {$ref: "#/components/schemas/DocumentTemplateField"}
        translations:
          type: array
          items: {$ref: "#/components/schemas/DocumentTemplateTranslation"}
    GenerateDraftRequest:
      type: object
      required: [templateId]
      properties:
        templateId: {type: string, format: uuid}
        language:
          $ref: "#/components/schemas/Language"
          description: The language to write in; the template's original language when absent.
    Drafts:
      type: object
      required: [drafts]
      properties:
        drafts:
          type: array
          items: {$ref: "#/components/schemas/DraftEvent"}
    SignDraftRequest:
      type: object
      required: [fields]
      properties:
        fields:
          type: array
          description: One value per field of the draft, as the practitioner left it; empty for none.
          items: {$ref: "#/components/schemas/DraftValue"}
    DraftValue:
      type: object
      required: [key, value]
      properties:
        key: {type: string}
        value: {type: string}
        confirmed:
          type: boolean
          description: >-
            The practitioner confirmed the value of a coded field (an ICD-10 diagnosis), whether it was suggested
            by the drafting or typed by them. Required for a filled coded field; ignored for the other types.
    KeyedError:
      type: object
      required: [error, keys]
      properties:
        error: {type: string}
        keys:
          type: array
          items: {type: string}
    HistoryItemType:
      type: string
      enum: [visit, document, questionnaire_response, attachment, communication]
      description: >-
        What a history item is; its reference opens the FHIR resource. `communication` is reserved for chats
        (SAL-26) and not served yet.
    HistoryClinic:
      type: object
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    HistoryItem:
      type: object
      required: [date, clinic, type, reference]
      description: One entry of a history. Health data.
      properties:
        date: {type: string, format: date-time}
        clinic: {$ref: "#/components/schemas/HistoryClinic"}
        type: {$ref: "#/components/schemas/HistoryItemType"}
        reference:
          type: string
          description: The FHIR resource to open, `Type/id`.
          examples: ["Composition/a1000000-0000-4000-8000-0000000000a1"]
        encounterId:
          type: string
          format: uuid
          description: The visit it belongs to.
        specialty:
          type: string
          description: The SNOMED CT code of the visit's practitioner role (`/specialties`).
        title: {type: string}
        diagnoses:
          type: array
          description: >-
            A signed document's diagnoses: the ICD-10 codes (http://hl7.org/fhir/sid/icd-10) of its filled coded
            fields.
          items: {type: string, examples: ["J06.9"]}
        shared:
          type: boolean
          description: For a practitioner, a visit of another clinic the patient shared, and everything of it.
    HistoryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/HistoryItem"}
        next:
          type: string
          description: The cursor of the next page; absent on the last.
    HistorySummary:
      type: object
      required: [allergies, medications, openItems]
      description: The pre-visit summary. Health data.
      properties:
        lastVisit: {$ref: "#/components/schemas/HistoryItem"}
        allergies:
          type: array
          items: {$ref: "#/components/schemas/SummaryAllergy"}
        medications:
          type: array
          items: {$ref: "#/components/schemas/SummaryMedication"}
        openItems:
          type: array
          items: {$ref: "#/components/schemas/OpenItem"}
    SummaryAllergy:
      type: object
      required: [reference, text, confirmed]
      properties:
        reference: {type: string, description: "AllergyIntolerance/id"}
        text: {type: string}
        reaction: {type: string}
        severity: {$ref: "#/components/schemas/AllergySeverity"}
        confirmed: {type: boolean}
    SummaryMedication:
      type: object
      required: [dosage, reference, text, confirmed]
      properties:
        dosage: {$ref: "#/components/schemas/Dosage"}
        reference: {type: string, description: "MedicationStatement/id"}
        text: {type: string}
        confirmed: {type: boolean}
    OpenItem:
      type: object
      required: [type, reference]
      properties:
        type:
          type: string
          enum: [questionnaire_pending, draft_unsigned]
        reference: {type: string}
    AllergyCategory:
      type: string
      enum: [food, medication, environment, biologic]
    AllergySeverity:
      type: string
      enum: [mild, moderate, severe]
    AllergyClinicalStatus:
      type: string
      enum: [active, inactive, resolved]
    AllergyIntoleranceInput:
      type: object
      required: [text, clinicalStatus]
      additionalProperties: false
      description: >-
        An allergy as the patient or a practitioner writes it. termId is a term of the terminology search
        (its label in the caller's language goes in text); without it text is what was typed. A severity needs a
        reaction.
      properties:
        termId: {type: string, format: uuid}
        text: {type: string, minLength: 1, maxLength: 200}
        category: {$ref: "#/components/schemas/AllergyCategory"}
        reaction: {type: string, minLength: 1, maxLength: 200}
        severity: {$ref: "#/components/schemas/AllergySeverity"}
        clinicalStatus: {$ref: "#/components/schemas/AllergyClinicalStatus"}
    DoseUnit:
      type: string
      enum: [mg, g, ug, mL, "[iU]", "{tablet}", "{capsule}", "{drop}", "{puff}", "{patch}"]
      description: A UCUM code.
    PeriodUnit:
      type: string
      enum: [h, d, wk, mo]
      description: A UCUM code, as FHIR Timing.repeat.periodUnit.
    Dosage:
      type: object
      additionalProperties: false
      description: >-
        How a medication is taken: a dose (doseValue and doseUnit, both or neither) and how often (frequency times
        per period periodUnit, all three or none), or as needed.
      properties:
        doseUnit: {$ref: "#/components/schemas/DoseUnit"}
        periodUnit: {$ref: "#/components/schemas/PeriodUnit"}
        doseValue: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 100000}
        period: {type: number, exclusiveMinimum: 0, maximum: 1000}
        frequency: {type: integer, minimum: 1, maximum: 100}
        asNeeded: {type: boolean}
    MedicationStatus:
      type: string
      enum: [active, stopped]
      description: Whether it is a current medication. (entered-in-error is a removal, never written.)
    MedicationStatementInput:
      type: object
      required: [text, status, dosage]
      additionalProperties: false
      properties:
        termId: {type: string, format: uuid}
        text: {type: string, minLength: 1, maxLength: 200}
        status: {$ref: "#/components/schemas/MedicationStatus"}
        dosage: {$ref: "#/components/schemas/Dosage"}
    EntryWritten:
      type: object
      required: [id, versionId]
      properties:
        id: {type: string, format: uuid}
        versionId: {type: string}
    SharingCandidate:
      type: object
      required: [date, encounterId, organizationId, organizationName, selected]
      description: >-
        A finished visit of the patient's at another clinic, exactly as the receiving clinic will see it marked.
        Health data.
      properties:
        date: {type: string, format: date-time}
        encounterId: {type: string, format: uuid}
        organizationId: {type: string, format: uuid}
        organizationName: {type: string}
        specialty: {type: string, description: SNOMED CT code (`/specialties`).}
        title: {type: string, description: The title of the visit's first signed document.}
        selected: {type: boolean, description: Shared with the clinic now.}
    SharingCandidateList:
      type: object
      required: [candidates]
      properties:
        candidates:
          type: array
          items: {$ref: "#/components/schemas/SharingCandidate"}
    SetHistorySharingRequest:
      type: object
      required: [encounterIds]
      additionalProperties: false
      properties:
        encounterIds:
          type: array
          maxItems: 500
          uniqueItems: true
          items: {type: string, format: uuid}
    HistorySharing:
      type: object
      required: [organizationId, shared]
      description: What the patient shares with one clinic now. Health data.
      properties:
        organizationId: {type: string, format: uuid}
        consentId:
          type: string
          format: uuid
          description: The history consent (FHIR Consent); absent when nothing is shared.
        versionId: {type: string}
        shared:
          type: array
          items: {type: string, format: uuid}
          description: The encounters shared.
    HistorySharingList:
      type: object
      required: [sharing]
      properties:
        sharing:
          type: array
          items: {$ref: "#/components/schemas/HistorySharing"}
    OpenConversationRequest:
      type: object
      description: Staff send `patient_id`; a patient sends `organization_id` and `practitioner_role_id`.
      properties:
        patient_id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        practitioner_role_id: {type: string, format: uuid}
        encounter_id: {type: string, format: uuid, description: The consultation the conversation is about.}
    Conversation:
      type: object
      required: [id, organization_id, patient_id, practitioner_role_id, created_at, last_seq, cursor, unread, staff_only]
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        patient_id: {type: string, format: uuid}
        practitioner_role_id: {type: string, format: uuid, description: The treating practitioner.}
        encounter_id: {type: string, format: uuid}
        parent_id: {type: string, format: uuid, description: A doctor-only side thread's conversation (SAL-28).}
        created_at: {type: string, format: date-time}
        last_sent_at: {type: string, format: date-time, description: Absent before the first message.}
        last_seq: {type: integer, format: int64, description: The number of the latest message; 0 before the first.}
        cursor: {type: string, description: "The latest message's cursor, or the start's for an empty conversation: the socket's `after`, so nothing sent since this was read is missed."}
        unread: {type: integer, format: int64, description: The caller's messages after their read position.}
        staff_only: {type: boolean, description: A doctor-only side thread (SAL-28); never shown to the patient.}
        participants:
          type: array
          description: The active participants, the patient first; absent in a list.
          items: {$ref: "#/components/schemas/ConversationParticipant"}
    ConversationParticipant:
      type: object
      description: >-
        A participant. Nobody's read position is shown to the others (that would be a stored read receipt); the
        caller's own is the conversation's `unread`.
      required: [id, role, status, added_at, history_from_seq]
      properties:
        id: {type: string, format: uuid}
        role: {type: string, enum: [patient, practitioner]}
        status:
          type: string
          enum: [active, pending_consent]
          description: "`pending_consent`: a doctor of another clinic waiting for the patient's consent, who sees nothing until then (SAL-28)."
        patient_id: {type: string, format: uuid}
        practitioner_role_id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid, description: "A practitioner's clinic: another than the conversation's for an invited doctor (SAL-28)."}
        reason:
          type: string
          enum: [second_opinion, specialist_review, handover]
          description: Why the practitioner was added; absent for the patient and the treating practitioner.
        added_at: {type: string, format: date-time}
        history_from_seq: {type: integer, format: int64, description: The participant reads the messages after this number; 0 for all.}
    AddParticipantRequest:
      type: object
      required: [practitioner_role_id, organization_id, reason, history]
      properties:
        practitioner_role_id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid, description: "The role's clinic: the conversation's to add, another to invite."}
        reason: {type: string, enum: [second_opinion, specialist_review, handover]}
        history: {type: string, enum: [full, from], description: "`full`: the whole history; `from`: the messages after `from_seq`."}
        from_seq: {type: integer, format: int64, minimum: 0, description: With `history` `from` only; at most the conversation's `last_seq`.}
    ChatInvitation:
      type: object
      description: >-
        A doctor of another clinic invited into the patient's conversation: waiting for their consent, or taking part
        since they granted it.
      required: [id, conversation_id, organization_id, practitioner_role_id, reason, invited_at]
      properties:
        id: {type: string, format: uuid, description: The invitation's id (the invited participant's).}
        conversation_id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid, description: The invited doctor's clinic.}
        practitioner_role_id: {type: string, format: uuid}
        reason: {type: string, enum: [second_opinion, specialist_review, handover]}
        invited_at: {type: string, format: date-time}
        status:
          type: string
          enum: [pending_consent, active]
          description: "`pending_consent` until the patient decides, `active` once they granted it. Always sent."
    ChatInvitationList:
      type: object
      required: [invitations]
      properties:
        invitations:
          type: array
          items: {$ref: "#/components/schemas/ChatInvitation"}
    ChatInvitationDecision:
      type: object
      required: [decision]
      properties:
        decision: {type: string, enum: [grant, decline]}
    ConversationList:
      type: object
      required: [conversations]
      properties:
        conversations:
          type: array
          items: {$ref: "#/components/schemas/Conversation"}
        next: {type: string, description: The cursor of the next page; absent at the end.}
    ChatMessage:
      type: object
      description: A message (FHIR Communication), a participant's text (`body`) or a system message (`system`).
      required: [id, conversation_id, seq, cursor, sender_role, kind, client_message_id, sent_at, version_id]
      properties:
        id: {type: string, format: uuid}
        conversation_id: {type: string, format: uuid}
        seq: {type: integer, format: int64, description: The message's number in the conversation, 1, 2, 3 and on.}
        cursor: {type: string, description: "Opaque: the `before` of a page, the `after` of the socket."}
        sender_participant_id: {type: string, format: uuid, description: Absent for a system message.}
        sender_role: {type: string, enum: [patient, practitioner, system]}
        kind: {type: string, enum: [text, system]}
        body: {type: string, description: "A text's body, 1 to 4000 characters; absent for a message of files alone."}
        system: {$ref: "#/components/schemas/SystemMessage"}
        client_message_id: {type: string, format: uuid}
        sent_at: {type: string, format: date-time}
        edited_at: {type: string, format: date-time, description: Absent for a message never edited.}
        version_id: {type: integer, format: int32}
        attachments:
          type: array
          description: The message's files, oldest first; absent for none (SAL-30).
          items: {$ref: "#/components/schemas/ChatAttachment"}
        terms:
          type: array
          description: >-
            The explained terms found in `body` (SAL-13), in the reader's language then English, as UTF-16 offsets;
            computed on read, never stored, the body unchanged; absent for none and in socket frames.
          items: {$ref: "#/components/schemas/TermSpan"}
    SystemMessage:
      type: object
      description: The code the apps render from their catalogs, and its opaque ids.
      required: [code]
      properties:
        code: {type: string, pattern: "^[a-z_]{1,64}$"}
        args:
          type: object
          additionalProperties: {type: string}
    MessagePage:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items: {$ref: "#/components/schemas/ChatMessage"}
        next: {type: string, description: The cursor of the older page; absent at the start of the conversation.}
    SendMessageRequest:
      type: object
      required: [client_message_id, body]
      properties:
        client_message_id: {type: string, format: uuid, description: The client's id of the message; a retry repeats it.}
        body: {type: string, minLength: 0, maxLength: 4000, description: "1 to 4000 characters after trimming; may be empty with `attachment_ids`."}
        attachment_ids:
          type: array
          description: "The sender's uploads to the conversation (`uploadChatAttachment`), scanning or clean, not yet sent; at most 10."
          maxItems: 10
          items: {type: string, format: uuid}
    EditMessageRequest:
      type: object
      required: [body]
      properties:
        body: {type: string, minLength: 1, maxLength: 4000}
    MessageRevision:
      type: object
      required: [edited_at, body, version_id]
      properties:
        edited_at: {type: string, format: date-time, description: When this body was written.}
        body: {type: string}
        version_id: {type: integer, format: int32}
    MessageRevisions:
      type: object
      required: [revisions]
      properties:
        revisions:
          type: array
          items: {$ref: "#/components/schemas/MessageRevision"}
    ReadPosition:
      type: object
      required: [seq]
      properties:
        seq: {type: integer, format: int64, minimum: 0}
    ChatMessageFrame:
      type: object
      required: [type, version, payload]
      properties:
        type: {type: string, enum: [message, message_edited]}
        version: {type: integer, const: 1}
        payload: {$ref: "#/components/schemas/ChatMessage"}
    SendAck:
      type: object
      required: [client_message_id, message]
      properties:
        client_message_id: {type: string, format: uuid}
        message: {$ref: "#/components/schemas/ChatMessage"}
    SendAckFrame:
      type: object
      required: [type, version, payload]
      properties:
        type: {type: string, const: send_ack}
        version: {type: integer, const: 1}
        payload: {$ref: "#/components/schemas/SendAck"}
    ChatCommandError:
      type: object
      required: [command, error]
      properties:
        command: {type: string, description: The type of the client's frame; empty when it was no envelope.}
        id: {type: string, description: The client message id the frame named.}
        error: {type: string}
    ChatCommandErrorFrame:
      type: object
      required: [type, version, payload]
      properties:
        type: {type: string, const: command_error}
        version: {type: integer, const: 1}
        payload: {$ref: "#/components/schemas/ChatCommandError"}
    ChatFrame:
      description: A frame the conversation's socket sends.
      oneOf:
        - $ref: "#/components/schemas/ChatMessageFrame"
        - $ref: "#/components/schemas/SendAckFrame"
        - $ref: "#/components/schemas/ChatCommandErrorFrame"
        - $ref: "#/components/schemas/ChatReceiptFrame"
        - $ref: "#/components/schemas/ChatTypingFrame"
    ChatCommand:
      type: object
      description: A frame the client sends on the conversation's socket; also `ChatReadCommand` and `ChatTypingCommand`.
      required: [type, version, payload]
      properties:
        type: {type: string, const: send}
        version: {type: integer, const: 1}
        payload: {$ref: "#/components/schemas/SendMessageRequest"}
    ChatAttachment:
      type: object
      description: >-
        A message's file (SAL-30): an image or a PDF, through the upload and malware scan pipeline. Its bytes
        (`getChatAttachmentContent`) and, for an image, its thumbnail open once `clean`; a `rejected` file never
        opens.
      required: [id, content_type, size, filename, status, thumbnail]
      properties:
        id: {type: string, format: uuid}
        content_type: {type: string, enum: [application/pdf, image/jpeg, image/png], description: Detected from the bytes.}
        size: {type: integer, format: int64, description: Bytes.}
        filename: {type: string, maxLength: 200, description: The name it was uploaded with.}
        status: {type: string, enum: [scanning, clean, rejected]}
        thumbnail: {type: boolean, description: An image's thumbnail is there to read (`getChatAttachmentThumbnail`).}
    ChatReadCommand:
      type: object
      description: "The client has read the messages up to `seq` (as `markConversationRead`); the others get a `receipt`."
      required: [type, version, payload]
      properties:
        type: {type: string, const: read}
        version: {type: integer, const: 1}
        payload: {$ref: "#/components/schemas/ReadPosition"}
    ChatTypingCommand:
      type: object
      description: The client's participant types; sent at most once a second, the others get a `typing` frame.
      required: [type, version, payload]
      properties:
        type: {type: string, const: typing}
        version: {type: integer, const: 1}
        payload: {$ref: "#/components/schemas/ChatTyping"}
    ChatReceipt:
      type: object
      description: How far a participant has read. Ephemeral, never stored as anyone's but the reader's own position.
      required: [participant_id, seq]
      properties:
        participant_id: {type: string, format: uuid}
        seq: {type: integer, format: int64}
    ChatReceiptFrame:
      type: object
      required: [type, version, payload]
      properties:
        type: {type: string, const: receipt}
        version: {type: integer, const: 1}
        payload: {$ref: "#/components/schemas/ChatReceipt"}
    ChatTyping:
      type: object
      description: The participant who types; the server's frame names them, the client's names none.
      properties:
        participant_id: {type: string, format: uuid}
    ChatTypingFrame:
      type: object
      required: [type, version, payload]
      properties:
        type: {type: string, const: typing}
        version: {type: integer, const: 1}
        payload: {$ref: "#/components/schemas/ChatTyping"}
    ChatSearchResult:
      type: object
      required: [conversation_id, message]
      properties:
        conversation_id: {type: string, format: uuid}
        message: {$ref: "#/components/schemas/ChatMessage"}
    ChatSearchResults:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: {$ref: "#/components/schemas/ChatSearchResult"}
    PushDevice:
      type: object
      required: [platform, token]
      properties:
        platform: {type: string, enum: [android, ios]}
        token: {type: string, minLength: 1, maxLength: 4096, description: "The FCM registration token or the APNs device token."}
    ChatHour:
      type: object
      required: [day, start, end]
      properties:
        day: {type: string, enum: [mon, tue, wed, thu, fri, sat, sun], description: "FHIR days-of-week."}
        start: {type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", description: "HH:MM in the clinic's time zone."}
        end: {type: string, pattern: "^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$", description: "HH:MM, after start; 24:00 for midnight."}
    ChatHours:
      type: object
      required: [time_zone, hours, response_time_hours, open_now]
      properties:
        time_zone: {type: string, description: "The clinic's IANA time zone, which the hours are in."}
        hours:
          type: array
          items: {$ref: "#/components/schemas/ChatHour"}
        response_time_hours: {type: integer, minimum: 1, maximum: 168, description: "The response time the clinic states."}
        open_now: {type: boolean, description: "Within the hours now, in the clinic's zone; true when it states none."}
    ChatSettings:
      type: object
      required: [hours, response_time_hours, email_after_minutes]
      properties:
        hours:
          type: array
          maxItems: 21
          items: {$ref: "#/components/schemas/ChatHour"}
        response_time_hours: {type: integer, minimum: 1, maximum: 168}
        email_after_minutes: {type: integer, minimum: 5, maximum: 10080, description: "How long a message stays unread before its reader gets an e-mail."}
    Webhook:
      type: object
      required: [created_at, id, url, events, include_clinical]
      properties:
        created_at: {type: string, format: date-time}
        id: {type: string, format: uuid}
        url: {type: string, format: uri}
        events:
          type: array
          items: {$ref: "#/components/schemas/WebhookEventType"}
        include_clinical: {type: boolean}
    WebhookList:
      type: object
      required: [webhooks]
      properties:
        webhooks:
          type: array
          items: {$ref: "#/components/schemas/Webhook"}
    NewWebhook:
      type: object
      required: [url, events]
      properties:
        url: {type: string, format: uri, maxLength: 2048, description: "https, to a public host."}
        events:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/WebhookEventType"}
        include_clinical: {type: boolean, default: false, description: "Adds the message's text to each event."}
    CreatedWebhook:
      type: object
      required: [created_at, id, url, secret, events, include_clinical]
      properties:
        created_at: {type: string, format: date-time}
        id: {type: string, format: uuid}
        url: {type: string, format: uri}
        secret: {type: string, description: "whsec_ and 43 characters: the HMAC key of the signatures. Shown only here."}
        events:
          type: array
          items: {$ref: "#/components/schemas/WebhookEventType"}
        include_clinical: {type: boolean}
    WebhookEventType:
      type: string
      enum: [message.created]
    WebhookEvent:
      type: object
      description: "What a clinic's endpoint receives (not served by this API): the event's type and ids; the message only with include_clinical."
      required: [id, type, organization_id, data]
      properties:
        id: {type: string, format: uuid, description: "The event's id, the same on every attempt."}
        type: {$ref: "#/components/schemas/WebhookEventType"}
        organization_id: {type: string, format: uuid}
        data:
          type: object
          required: [conversation_id, message_id]
          properties:
            conversation_id: {type: string, format: uuid}
            message_id: {type: string, format: uuid}
            message:
