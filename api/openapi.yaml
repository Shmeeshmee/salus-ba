      - $ref: "#/components/parameters/TermID"
      - name: language
        in: path
        required: true
        schema: {$ref: "#/components/schemas/Language"}
    post:
      operationId: reviewTermExplanation
      summary: Approve a term's explanation, or mark it as needing changes
      description: >-
        As reviewTermTranslation, for the explanation in the language. Reviewers only. Audited.
      tags: [terminology]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReviewDecision"}
      responses:
        "200":
          description: The explanation as stored.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TermExplanation"}
        "400":
          description: "`invalid_request`: no or an unreadable If-Match, a status other than approved or needs_changes, or a note longer than 500 characters."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`forbidden`: the caller is not a reviewer; `csrf`: a write with the session cookie and no `X-Salus-CSRF: 1`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: "`not_found`: no such term, or it has no explanation in the language."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "412":
          description: "`version_conflict`: the explanation changed since it was read."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422":
          description: "`note_required`: needs_changes without a note."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
