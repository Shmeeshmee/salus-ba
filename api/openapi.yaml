openapi: 3.1.0
info:
  title: Salus API
  version: 0.1.0
  description: >-
    Non-FHIR endpoints of the Salus API. FHIR endpoints live under /fhir/R4/ and are described by
    api/fhir/CapabilityStatement.json. The TypeScript and Dart clients are generated from this file
    (`make gen-clients`).
servers:
  - url: /
    description: Same origin as the client
security: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness
      description: The process serves requests. Touches no dependency.
      tags: [health]
      security: [] # public: used by orchestrators before any login
      responses:
        "200":
          description: Alive.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Status"}
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness
      description: >-
        Every dependency (Postgres, Redis) answers. A failing check is named; its error is only logged.
      tags: [health]
      security: [] # public: used by orchestrators before any login
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Status"}
        "503":
          description: A dependency is not available.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Unavailable"}
  /auth/register:
    post:
      operationId: register
      summary: Register a patient account
      description: >-
        Creates a patient account. The e-mail is trimmed and lower-cased; the password (12 to 128 characters,
        no composition rules) is stored only as its argon2id hash. A taken e-mail answers 409. Audited.
      tags: [auth]
      security: [] # public: there is no account yet
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegisterRequest"}
      responses:
        "201":
          description: The account was created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Account"}
        "400":
          description: "`invalid_request`, `invalid_email` or `invalid_password`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: "`email_taken`: the e-mail has an account."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          description: "`internal error`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /auth/me:
    get:
      operationId: getMe
      summary: The signed-in account
      description: The account of the session that made the request. Audited.
      tags: [auth]
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Account"}
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          description: "`internal error`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /auth/login:
    post:
      operationId: login
      summary: Sign in with e-mail and password
      description: >-
        Checks the password. A patient without MFA gets the session; an account with MFA gets a challenge
        with `next: verify`, and staff who have not set up MFA one with `next: enrol` (MFA is required for
        staff). The challenge lasts 5 minutes. The web app sends `X-Salus-CSRF: 1` and gets the session in the
        `salus_session` cookie; the mobile app gets the token in the body. Limited per e-mail (5 failures in
        15 minutes) and per client IP (30 attempts): over the limit the password is not checked and the answer
        is 429 with `Retry-After`. Audited.
      tags: [auth]
      security: [] # public: this is how a session starts
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginRequest"}
      responses:
        "200":
          $ref: "#/components/responses/LoginStep"
        "400":
          description: "`invalid_request`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          description: "`wrong_credentials`: an unknown e-mail or a wrong password, alike."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/mfa/enrol:
    post:
      operationId: enrolMfa
      summary: Start TOTP enrolment
      description: >-
        With a login challenge (staff at their first login) or, without one, with a patient's session:
        returns a new TOTP secret and its `otpauth://` URI. The secret is pending until confirmed. Audited.
      tags: [auth]
      security:
        - {}
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EnrolRequest"}
      responses:
        "200":
          description: The pending secret. Not cached.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Enrolment"}
        "400":
          description: "`invalid_request`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          description: "`invalid_challenge` or `unauthenticated`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          $ref: "#/components/responses/CSRF"
        "409":
          description: "`already_enrolled`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/mfa/confirm:
    post:
      operationId: confirmMfa
      summary: Confirm TOTP enrolment with the first code
      description: >-
        Marks MFA as set up. With a challenge it also opens the session (as `/auth/login` does); with a
        session it answers 204. A wrong code counts against the challenge; the fifth ends it. Audited.
      tags: [auth]
      security:
        - {}
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConfirmRequest"}
      responses:
        "200":
          $ref: "#/components/responses/LoginStep"
        "204":
          description: Enrolled from a session.
        "400":
          description: "`invalid_request`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          description: "`invalid_challenge`, `wrong_code` or `unauthenticated`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          $ref: "#/components/responses/CSRF"
        "409":
          description: "`already_enrolled`, or `not_enrolled` before `/auth/mfa/enrol`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/mfa/verify:
    post:
      operationId: verifyMfa
      summary: Finish signing in with a TOTP code
      description: >-
        With the challenge of `/auth/login` and a code: opens the session. A code is accepted one 30-second
        step either way, and only once. A wrong code counts against the challenge; the fifth ends it. Audited.
      tags: [auth]
      security: [] # the challenge is the credential
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VerifyRequest"}
      responses:
        "200":
          $ref: "#/components/responses/LoginStep"
        "400":
          description: "`invalid_request`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          description: "`invalid_challenge` or `wrong_code`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: "`not_enrolled`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/logout:
    post:
      operationId: logout
      summary: Sign out
      description: Ends the session; the next request with it is refused. Clears the cookie. Audited.
      tags: [auth]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "204":
          description: Signed out.
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          $ref: "#/components/responses/CSRF"
        "500":
          $ref: "#/components/responses/InternalError"
  /invites:
    post:
      operationId: createInvite
      summary: Invite a practitioner or an admin to the clinic
      description: >-
        An admin of the clinic invites someone by e-mail: a practitioner with their given and family name, or
        another admin. The invite is open for 72 hours; an open invite for the same e-mail in the clinic is
        replaced. The e-mail with the link (`<web>/invite#<token>`) is sent by the notifier. Whether the e-mail
        already has an account is not disclosed here. Audited.
      tags: [invites]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/InviteRequest"}
      responses:
        "201":
          description: The invite.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Invite"}
        "400":
          description: "`invalid_request`, `invalid_email`, `invalid_role` or `invalid_name`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: "`forbidden`: not an admin of the clinic; or `csrf`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listInvites
      summary: The clinic's open invites
      description: Invites of the admin's clinic that are neither accepted nor expired, oldest first. Audited.
      tags: [invites]
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The open invites.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InviteList"}
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: "`forbidden`: not an admin of the clinic."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /invites/accept:
    post:
      operationId: acceptInvite
      summary: Accept an invite
      description: >-
        With the token from the link's fragment and a password: creates the account (and, for a practitioner,
        the Practitioner and PractitionerRole) and returns a pending TOTP secret with a challenge. Confirm the
        first code with `/auth/mfa/confirm` and the challenge (valid 5 minutes) to finish enrolment and open the
        session; if the challenge lapses, sign in with the password to enrol again. Only the newest link of an
        invite works. Not cached. Audited.
      tags: [invites]
      security: [] # the token is the credential
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AcceptInviteRequest"}
      responses:
        "201":
          description: The account was created; MFA enrolment is pending.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Acceptance"}
        "400":
          description: "`invalid_request` or `invalid_password`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: "`invalid_invite`: the token is unknown, replaced, expired or used."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: "`email_taken`: the e-mail has an account."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /me/patient:
    get:
      operationId: getMyPatient
      summary: The signed-in patient's profile
      description: >-
        The profile of the signed-in patient account, or 404 before it is first saved (a profile exists only
        complete). Patients only. Not cached. Audited, also when refused.
      tags: [patient]
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The profile.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Patient"}
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: "`forbidden`: a staff account."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: "`not_found`: no profile yet."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: saveMyPatient
      summary: Save the signed-in patient's profile
      description: >-
        Creates the profile when `versionId` is absent, with every required field; updates it when
        `versionId` is the current version. Names are trimmed. Patients only. Not cached. Audited, also when
        refused.
      tags: [patient]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SavePatientRequest"}
      responses:
        "200":
          description: The updated profile.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Patient"}
        "201":
          description: The created profile.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Patient"}
        "400":
          description: "`invalid_request`, `invalid_name`, `invalid_birth_date` or `invalid_phone`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: "`forbidden`: a staff account; or `csrf`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: >-
            `version_conflict`: a create when the profile exists, or a `versionId` that is not the current
            one. Read the profile again and retry.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /consents:
    post:
      operationId: grantConsent
      summary: Consent to share the profile and appointments with a clinic
      description: >-
        The signed-in patient consents to share their profile and appointments with the clinic for care
        (FHIR Consent, docs/booking/SPEC.md "Consent shape"). At most one consent per clinic is active;
        granting again after a revocation creates a new consent, so the history is kept. Needs a profile.
        Patients only. Not cached. Audited, also when refused.
      tags: [consents]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GrantConsentRequest"}
      responses:
        "201":
          description: The active consent.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Consent"}
        "400":
          description: "`invalid_request`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: "`forbidden`: a staff account; or `csrf`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: "`not_found`: no such clinic."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: >-
            `consent_active`: a consent with the clinic is active already; `profile_required`: the patient has
            no profile yet.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /consents/{id}/revoke:
    post:
      operationId: revokeConsent
      summary: Revoke a consent
      description: >-
        The signed-in patient revokes their active consent. The clinic's access to the profile and to every
        future appointment ends at once; past appointments stay, as the clinic's records, with the name, times
        and status only. Patients only. Not cached. Audited, also when refused.
      tags: [consents]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The revoked consent.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Consent"}
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: "`forbidden`: a staff account; or `csrf`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: "`not_found`: no such consent of the patient."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: "`consent_inactive`: the consent is revoked already."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /me/consents:
    get:
      operationId: listMyConsents
      summary: The signed-in patient's consents
      description: >-
        Every consent of the signed-in patient, active and revoked, the latest granted first; none before the
        profile exists. Patients only. Not cached. Audited.
      tags: [consents]
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The consents.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConsentList"}
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: "`forbidden`: a staff account."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /practitioner-roles/{id}/specialty:
    put:
      operationId: setPractitionerRoleSpecialty
      summary: Set a practitioner role's specialty
      description: >-
        The clinic's admin sets the specialty of a role of the clinic: one of the twelve SNOMED CT codes the
        directory offers (FHIR R4 ValueSet c80-practice-codes). Patients see it when the clinic is listed.
        Send If-Match with the version the role was read at (`PractitionerRole.meta.versionId`); the answer
        carries the new version as its ETag. Audited, also when refused.
      tags: [directory]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          description: The role's version as a weak ETag, `W/"<versionId>"`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SetSpecialtyRequest"}
      responses:
        "200":
          description: The role with its specialty, at its new version.
          headers:
            ETag: {schema: {type: string}, description: 'The new version, W/"<versionId>".'}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RoleSpecialty"}
        "400":
          description: >-
            `invalid_request`: no or an unreadable If-Match, or a body that is not the request;
            `invalid_specialty`: a code that is not one of the directory's specialties.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: "`forbidden`: a member of the clinic who is not its admin; or `csrf`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: "`not_found`: no such role in the caller's clinic."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "412":
          description: "`version_conflict`: the role changed since it was read; read it again."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /specialties:
    get:
      operationId: listSpecialties
      summary: List the specialties a role can have
      description: >-
        The specialties an admin may give a practitioner role, in display order: the directory's SNOMED CT codes
        from FHIR R4 ValueSet c80-practice-codes, with the name the apps show. Fixed and public; needs no
        session. Not audited: it holds no personal data.
      tags: [directory]
      responses:
        "200":
          description: The specialties.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SpecialtyList"}
  /practitioner-roles/{id}/availability:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getAvailability
      summary: Read a practitioner role's weekly availability
      description: >-
        The role's schedule: its slot length and weekly rules, times of day in the clinic's time zone. Before
        the first edit it is empty at version 0 (no `id`, no `slotMinutes`). The practitioner reads their own
        role's, the clinic's admin any role's. The answer carries the version as its ETag. Audited, also when
        refused.
      tags: [scheduling]
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The role's availability.
          headers:
            ETag: {schema: {type: string}, description: 'The version, W/"<versionId>".'}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Availability"}
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: "`forbidden`: a member of the clinic who is neither the role's practitioner nor the admin."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: "`not_found`: no such role in the caller's clinic."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: saveAvailability
      summary: Set a practitioner role's weekly availability
      description: >-
        Sets the slot length and the weekly rules of the role; the first edit creates its schedule. Send
        If-Match with the version read (`W/"0"` before the first edit); the answer carries the new version as
        its ETag. The role's free slots for the next 28 days follow within seconds; booked slots are never
        changed. The practitioner edits their own role's, the clinic's admin any role's. Audited, also when
        refused.
      tags: [scheduling]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - name: If-Match
          in: header
          required: true
          description: The availability's version as a weak ETag, `W/"<versionId>"`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SaveAvailabilityRequest"}
      responses:
        "200":
          description: The availability at its new version.
          headers:
            ETag: {schema: {type: string}, description: 'The new version, W/"<versionId>".'}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Availability"}
        "400":
          description: >-
            `invalid_request`: no or an unreadable If-Match, or a body that is not the request;
            `invalid_slot_minutes`: a slot length outside 5 to 240 or not a multiple of 5;
            `invalid_availability`: a day outside 1 to 7, a time that is not HH:MM, an end not after its start,
            or rules that overlap on a day.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: "`forbidden`: a member of the clinic who is neither the role's practitioner nor the admin; or `csrf`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: "`not_found`: no such role in the caller's clinic."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "412":
          description: "`version_conflict`: the availability changed since it was read; read it again."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /questionnaires:
    post:
      operationId: createQuestionnaire
      summary: Create a questionnaire
      description: >-
        Creates a questionnaire of the caller's clinic as version 1, a draft (FHIR Questionnaire; reads go
        through FHIR). Staff of the clinic, practitioners and admins alike. The body is read up to 256 KiB and
        checked against docs/questionnaire/SPEC.md §2 "Item model", "Limits" and "linkIds". The answer carries
        the version as its ETag. Audited, also when refused.
      tags: [questionnaires]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SaveQuestionnaireRequest"}
      responses:
        "201":
          $ref: "#/components/responses/Questionnaire"
        "400":
          description: "`invalid_request`: a body that is not the request, or over 256 KiB."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/QuestionnaireForbidden"
        "422":
          $ref: "#/components/responses/InvalidQuestionnaire"
        "500":
          $ref: "#/components/responses/InternalError"
  /questionnaires/{id}:
    parameters:
      - $ref: "#/components/parameters/QuestionnaireID"
    put:
      operationId: updateQuestionnaire
      summary: Edit a draft
      description: >-
        Replaces the title, description and items of a draft. Send If-Match with the version read; the answer
        carries the new version as its ETag. A later version keeps each linkId's type (single and multiple
        choice count as different types). Staff of the clinic. Audited, also when refused.
      tags: [questionnaires]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SaveQuestionnaireRequest"}
      responses:
        "200":
          $ref: "#/components/responses/Questionnaire"
        "400":
          description: "`invalid_request`: no or an unreadable If-Match, or a body that is not the request, or over 256 KiB."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/QuestionnaireForbidden"
        "404":
          $ref: "#/components/responses/QuestionnaireNotFound"
        "409":
          description: "`not_draft`: the version is published and can no longer be changed."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "412":
          $ref: "#/components/responses/QuestionnaireChanged"
        "422":
          $ref: "#/components/responses/InvalidQuestionnaire"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteQuestionnaire
      summary: Discard a draft
      description: Deletes a draft. A published version is never deleted. Staff of the clinic. Audited, also when refused.
      tags: [questionnaires]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "204":
          description: The draft is deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/QuestionnaireForbidden"
        "404":
          $ref: "#/components/responses/QuestionnaireNotFound"
        "409":
          description: "`not_draft`: the version is published."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /questionnaires/{id}/publish:
    parameters:
      - $ref: "#/components/parameters/QuestionnaireID"
    post:
      operationId: publishQuestionnaire
      summary: Publish a draft
      description: >-
        Makes the draft, as it was read (If-Match), the questionnaire's active version, and retires the version
        that was active, in one transaction. A published version never changes. Staff of the clinic. Audited,
        also when refused.
      tags: [questionnaires]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          $ref: "#/components/responses/Questionnaire"
        "400":
          description: "`invalid_request`: no or an unreadable If-Match."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/QuestionnaireForbidden"
        "404":
          $ref: "#/components/responses/QuestionnaireNotFound"
        "409":
          description: "`not_draft`: the version is already published."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "412":
          $ref: "#/components/responses/QuestionnaireChanged"
        "500":
          $ref: "#/components/responses/InternalError"
  /questionnaires/{id}/retire:
    parameters:
      - $ref: "#/components/parameters/QuestionnaireID"
    post:
      operationId: retireQuestionnaire
      summary: Retire the active version
      description: >-
        Retires an active version: it is no longer requested, also as a role's default; requests already made
        keep it. Staff of the clinic. Audited, also when refused.
      tags: [questionnaires]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "200":
          $ref: "#/components/responses/Questionnaire"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/QuestionnaireForbidden"
        "404":
          $ref: "#/components/responses/QuestionnaireNotFound"
        "409":
          description: "`not_active`: the version is not active."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /questionnaires/{id}/revise:
    parameters:
      - $ref: "#/components/parameters/QuestionnaireID"
    post:
      operationId: reviseQuestionnaire
      summary: Edit as new version
      description: >-
        Copies an active version into the next version, a draft with the same items and linkIds. The active
        version stays active until the draft is published. Staff of the clinic. Audited, also when refused.
      tags: [questionnaires]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "201":
          $ref: "#/components/responses/Questionnaire"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/QuestionnaireForbidden"
        "404":
          $ref: "#/components/responses/QuestionnaireNotFound"
        "409":
          description: "`not_active`: the version is not active; `draft_exists`: the questionnaire already has a draft."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /practitioner-roles/{id}/questionnaire:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getRoleQuestionnaire
      summary: Read a practitioner role's default questionnaire
      description: >-
        The questionnaire requested with every booking with the role, as its canonical url (its active version
        is requested); no url while the role has none. The practitioner reads their own role's, the clinic's
        admin any role's. Audited, also when refused.
      tags: [questionnaires]
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/QuestionnaireDefault"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/QuestionnaireForbidden"
        "404":
          description: "`not_found`: no such role in the caller's clinic, or another practitioner's."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: setRoleQuestionnaire
      summary: Set a practitioner role's default questionnaire
      description: >-
        Makes the questionnaire of `questionnaireId` (any of its versions) the role's default: from now on its
        active version is requested with every booking with the role. Who may is as for the read. Audited, also
        when refused.
      tags: [questionnaires]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SetRoleQuestionnaireRequest"}
      responses:
        "200":
          $ref: "#/components/responses/QuestionnaireDefault"
        "400":
          description: "`invalid_request`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/QuestionnaireForbidden"
        "404":
          description: "`not_found`: no such role or questionnaire in the caller's clinic, or another practitioner's role."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: "`not_active`: the questionnaire has no active version."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: clearRoleQuestionnaire
      summary: Clear a practitioner role's default questionnaire
      description: Removes the role's default, if it has one. Who may is as for the read. Audited, also when refused.
      tags: [questionnaires]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "204":
          description: The role has no default.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/QuestionnaireForbidden"
        "404":
          description: "`not_found`: no such role in the caller's clinic, or another practitioner's."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /appointments:
    post:
      operationId: bookAppointment
      summary: Book a free slot
      description: >-
        The signed-in patient books a free slot of a listed clinic (FHIR Appointment, docs/booking/SPEC.md
        "Booking rules"): booked at once, the slot held in the same transaction. Needs a profile and an active
        consent with the clinic. A confirmation is e-mailed, and a reminder 24 hours before the start when that
        is ahead. Patients only. Not cached. Audited, also when refused.
      tags: [appointments]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BookAppointmentRequest"}
      responses:
        "201":
          description: The booked appointment.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Appointment"}
        "400":
          description: "`invalid_request`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: "`forbidden`: a staff account; or `csrf`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: >-
            `profile_required`: the patient has no profile yet; `consent_required`: no active consent with the
            slot's clinic (consent, then book again); `slot_unavailable`: the slot is not free, has started, or
            its clinic is not listed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /appointments/{id}/cancel:
    post:
      operationId: cancelAppointment
      summary: Cancel an appointment
      description: >-
        Cancels a booked appointment: the patient their own up to 24 hours before the start (reason `pat`), the
        appointment's practitioner and the clinic's admin at any time (reason `prov`). The slot is freed while
        its start is ahead, and the patient is e-mailed. Not cached. Audited, also when refused.
      tags: [appointments]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The cancelled appointment.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Appointment"}
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: >-
            `forbidden`: the clinic sees the appointment at the name, times and status only (a past one after a
            revocation); or `csrf`.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: "`not_found`: no such appointment the caller may see."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: >-
            `cancellation_window_closed`: a patient, less than 24 hours before the start; `appointment_closed`:
            the appointment is no longer booked.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /appointments/{id}/status:
    post:
      operationId: setAppointmentStatus
      summary: Mark an appointment fulfilled or no-show
      description: >-
        The appointment's practitioner marks it `fulfilled` or `noshow` once its start has passed, once. Not
        cached. Audited, also when refused.
      tags: [appointments]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SetAppointmentStatusRequest"}
      responses:
        "200":
          description: The appointment in its new status.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Appointment"}
        "400":
          description: "`invalid_request`; `invalid_status`: a status other than fulfilled and noshow."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: >-
            `forbidden`: a patient or an admin; the clinic sees the appointment at the name, times and status
            only; or `csrf`.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: "`not_found`: no such appointment of the practitioner."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: >-
            `appointment_not_started`: the start has not passed; `appointment_closed`: the appointment is no
            longer booked.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /appointments/{id}/consultation:
    get:
      operationId: getConsultation
      summary: Where an appointment's video consultation stands
      description: >-
        The state of the consultation (`not_started` before anyone asked for a token, `open` while its room
        exists, `ended`), when the patient and the practitioner first joined, when and why it ended, and why the
        patient was removed. For the appointment's patient, its practitioner and the clinic's admin, as they may
        see the appointment (after a revocation, a past one too); and for its practitioner once they joined the
        room, also after a revocation hid the appointment from the clinic. The clients read `reason` when the
        other side leaves or the room closes. Not cached. Audited as a read of the appointment, also when
        refused.
      tags: [consultation]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppointmentID"
      responses:
        "200":
          description: The consultation's state.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConsultationStatus"}
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: "`not_found`: no such appointment the caller may see."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /appointments/{id}/consultation/join:
    post:
      operationId: joinConsultation
      summary: A token to join an appointment's video consultation
      description: >-
        A LiveKit join token for the appointment's room, to its patient or to its practitioner only, while the
        appointment is booked, the patient's consent with the clinic is active, and the join window is open
        (10 minutes before the start to 30 minutes after the end). The token grants that one room, camera and
        microphone, for 5 minutes. The first request creates the room. `peerName` is the other person's name:
        the practitioner's public name for the patient, the patient's name for the practitioner (a read of the
        patient, audited). Not cached. Audited, also when refused.
      tags: [consultation]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/AppointmentID"
      responses:
        "200":
          description: The token and what the client needs with it.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConsultationJoin"}
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          description: >-
            `not_found`: no such appointment, or the caller is not its patient or its practitioner (the clinic's
            admin included).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: >-
            `consent_required`: the patient's consent with the clinic is not active; `join_window_not_open`: more
            than 10 minutes before the start; `consultation_ended`: the consultation ended, the window closed, or
            the appointment is no longer booked; `practitioner_did_not_join`: the consultation ended because the
            practitioner never joined.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /appointments/{id}/consultation/end:
    post:
      operationId: endConsultation
      summary: End an appointment's video consultation
      description: >-
        The appointment's practitioner ends the consultation once they joined (also after the patient revoked
        the consent): the room is closed for both, the Encounter finishes and the appointment becomes
        `fulfilled`, or `noshow` if the patient never joined (unless it was marked by hand). Repeated, it
        answers 200 again. Not cached. Audited, also when refused.
      tags: [consultation]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/AppointmentID"
      responses:
        "200":
          description: The ended consultation.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConsultationStatus"}
        "401":
          description: "`unauthenticated`: no valid session."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          description: "`not_found`: no such appointment, or the caller is not its practitioner."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: "`consultation_not_started`: the practitioner has not joined the consultation."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /appointments/{id}/questionnaires:
    post:
      operationId: requestQuestionnaire
      summary: Ask the patient to fill in a questionnaire
      description: >-
        The appointment's practitioner asks the patient to fill in an active questionnaire of the clinic before
        the appointment starts (FHIR QuestionnaireResponse, in progress, no answers; reads go through FHIR).
        The appointment must be booked and not started, and the patient's consent with the clinic active. Not
        cached. Audited, also when refused.
      tags: [questionnaires]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/AppointmentID"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RequestQuestionnaireRequest"}
      responses:
        "201":
          $ref: "#/components/responses/QuestionnaireResponse"
        "400":
          description: "`invalid_request`: a body that is not the request."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          description: "`not_found`: no such appointment or questionnaire, or the caller is not the appointment's practitioner."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: >-
            `already_requested`: the appointment has a request of that questionnaire (a withdrawn one may be
            requested again); `not_active`: the version is a draft or retired; `appointment_started`: the
            appointment has started; `appointment_closed`: it is no longer booked; `consent_required`: the
            patient's consent with the clinic is not active.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /questionnaire-responses/{id}/answers:
    parameters:
      - $ref: "#/components/parameters/QuestionnaireResponseID"
    put:
      operationId: saveQuestionnaireAnswers
      summary: Save the answers
      description: >-
        The patient replaces the saved answers of their questionnaire while it is in progress, before the
        appointment starts, with an active consent. Send If-Match with the version read; the answer carries the
        new version as its ETag. Each answer is checked against its item's type and limits; required questions
        and conditions are checked on submit. The body is read up to 256 KiB. Not cached. Audited, also when
        refused.
      tags: [questionnaires]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SaveAnswersRequest"}
      responses:
        "200":
          $ref: "#/components/responses/QuestionnaireResponse"
        "400":
          description: >-
            `invalid_request`: no or an unreadable If-Match, a body that is not the request (an integer outside
            32 bits included), or over 256 KiB.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AnswersForbidden"
        "404":
          $ref: "#/components/responses/QuestionnaireResponseNotFound"
        "409":
          $ref: "#/components/responses/AnswersClosed"
        "412":
          $ref: "#/components/responses/QuestionnaireResponseChanged"
        "422":
          $ref: "#/components/responses/AnswersInvalid"
        "500":
          $ref: "#/components/responses/InternalError"
  /questionnaire-responses/{id}/submit:
    parameters:
      - $ref: "#/components/parameters/QuestionnaireResponseID"
    post:
      operationId: submitQuestionnaireAnswers
      summary: Submit the answers
      description: >-
        The patient submits the saved answers, as they were read (If-Match): every shown required question
        must be answered; the answers of hidden questions are removed. Final: no later change. The appointment's
        practitioner reads the answers from then on. Not cached. Audited, also when refused.
      tags: [questionnaires]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          $ref: "#/components/responses/QuestionnaireResponse"
        "400":
          description: "`invalid_request`: no or an unreadable If-Match."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AnswersForbidden"
        "404":
          $ref: "#/components/responses/QuestionnaireResponseNotFound"
        "409":
          $ref: "#/components/responses/AnswersClosed"
        "412":
          $ref: "#/components/responses/QuestionnaireResponseChanged"
        "422":
          $ref: "#/components/responses/AnswersInvalid"
        "500":
          $ref: "#/components/responses/InternalError"
  /questionnaire-responses/{id}/withdraw:
    parameters:
      - $ref: "#/components/parameters/QuestionnaireResponseID"
    post:
      operationId: withdrawQuestionnaire
      summary: Withdraw a questionnaire request
      description: >-
        The appointment's practitioner withdraws a request the patient has not submitted: it is stopped and its
        answers are cleared at once. Not cached. Audited, also when refused.
      tags: [questionnaires]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "200":
          $ref: "#/components/responses/QuestionnaireResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`forbidden`: the caller sees the request but may not withdraw it (the patient, the clinic's admin); or `csrf`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          $ref: "#/components/responses/QuestionnaireResponseNotFound"
        "409":
          description: "`submitted`: the patient has submitted it; `withdrawn`: it is already withdrawn."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
  /webhooks/livekit:
    post:
      operationId: receiveLiveKitWebhook
      summary: LiveKit's webhook
      description: >-
        Called only by our LiveKit server, never by the clients. No session and no CSRF header: the
        `Authorization` header is LiveKit's JWT, signed with the API key pair and carrying the body's SHA-256,
        verified before the body is read. The body is read up to 64 KiB. Handled idempotently and in any
        order: a participant's join is recorded (the practitioner's first one starts the Encounter; a patient
        whose access has gone is removed from the room), and once the join window has closed the last one
        leaving ends the consultation. Every other event, and one for a room we do not know, has no effect.
      tags: [consultation]
      security:
        - livekitWebhook: []
      requestBody:
        required: true
        content:
          application/webhook+json:
            schema: {$ref: "#/components/schemas/LiveKitWebhookEvent"}
      responses:
        "200":
          description: Handled, also when it had no effect.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WebhookReceived"}
        "400":
          description: "`invalid_request`: a body over 64 KiB."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          description: "`unauthenticated`: a missing, expired or wrong signature, or one for another body."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          $ref: "#/components/responses/InternalError"
components:
  parameters:
    CSRF:
      name: X-Salus-CSRF
      in: header
      required: false
      description: >-
        Sent as `1` by the web app on every write. Required with the session cookie on POST, PUT, PATCH and
        DELETE (403 `csrf` without it). On the login steps it asks for the session in the cookie instead of
        the body.
      schema:
        type: string
        const: "1"
    QuestionnaireID:
      name: id
      in: path
      required: true
      description: The version's id (FHIR Questionnaire.id).
      schema:
        type: string
        format: uuid
    QuestionnaireResponseID:
      name: id
      in: path
      required: true
      description: The response's id (FHIR QuestionnaireResponse.id).
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The version read, as a weak ETag, `W/"<versionId>"`.
      schema:
        type: string
    AppointmentID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthenticated:
      description: "`unauthenticated`: no valid session."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Questionnaire:
      description: The questionnaire's version.
      headers:
        ETag: {schema: {type: string}, description: 'The version, W/"<versionId>".'}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Questionnaire"}
    QuestionnaireDefault:
      description: The role's default questionnaire.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/QuestionnaireDefault"}
    QuestionnaireForbidden:
      description: "`forbidden`: the caller is not staff of a clinic (a patient); or `csrf`."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    QuestionnaireNotFound:
      description: "`not_found`: no such questionnaire in the caller's clinic."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    QuestionnaireChanged:
      description: "`version_conflict`: the version changed since it was read; read it again."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    InvalidQuestionnaire:
      description: >-
        `invalid_questionnaire`: the content breaks a rule of docs/questionnaire/SPEC.md §2 "Item model",
        "Limits" or "linkIds"; `linkIds` names the offending items (none when the title, the description, the
        number of items or a malformed linkId is at fault).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    QuestionnaireResponse:
      description: The questionnaire request and its answers.
      headers:
        ETag: {schema: {type: string}, description: 'The version, W/"<versionId>".'}
        Cache-Control: {schema: {type: string, const: no-store}}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/QuestionnaireResponse"}
    QuestionnaireResponseNotFound:
      description: "`not_found`: no such questionnaire request, or the caller may not see it."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    QuestionnaireResponseChanged:
      description: "`version_conflict`: the answers changed since they were read; read them again."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    AnswersForbidden:
      description: "`forbidden`: the caller sees the request but is not its patient (staff); or `csrf`."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    AnswersClosed:
      description: >-
        `submitted`: already submitted; `withdrawn`: the practitioner withdrew it; `past_due`: the appointment
        has started; `consent_required`: the patient's consent with the clinic is not active.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    AnswersInvalid:
      description: >-
        `answers_invalid`: an answer does not fit its item's type or limits (docs/questionnaire/SPEC.md §2
        "Limits"), or, on submit, a shown required question is unanswered; `linkIds` names them in document
        order (an answer to no item of the questionnaire is refused without being named).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    LoginStep:
      description: >-
        The next step (`verify` or `enrol`, with the challenge), or `done` with the session: in the
        `salus_session` cookie (HttpOnly, Secure, SameSite=Strict) when `X-Salus-CSRF: 1` was sent, else as
        `token`. Not cached.
      headers:
        Cache-Control: {schema: {type: string, const: no-store}}
        Set-Cookie: {schema: {type: string}, description: "salus_session, for the web app"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/LoginResponse"}
    RateLimited:
      description: "`rate_limited`: too many attempts; the password was not checked."
      headers:
        Retry-After: {schema: {type: integer}, description: Seconds until the window ends.}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    CSRF:
      description: "`csrf`: a write with the session cookie and no `X-Salus-CSRF: 1`."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    InternalError:
      description: "`internal error`."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: salus_session
      description: The web app's session (HttpOnly, Secure, SameSite=Strict).
    bearerAuth:
      type: http
      scheme: bearer
      description: The mobile app's session token.
    livekitWebhook:
      type: apiKey
      in: header
      name: Authorization
      description: LiveKit's webhook signature, a JWT of the API key pair with the body's SHA-256 (no Bearer prefix).
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      required: [next]
      properties:
        next:
          type: string
          enum: [done, verify, enrol]
        challenge:
          type: string
          description: For `verify` and `enrol`; valid 5 minutes.
        token:
          type: string
          description: "The session token, for `done` without `X-Salus-CSRF`; send it as `Authorization: Bearer <token>`."
        expiresAt:
          type: string
          format: date-time
          description: For `done`. Absolute; 12 hours for staff, 30 days for patients.
    EnrolRequest:
      type: object
      additionalProperties: false
      properties:
        challenge:
          type: string
          description: The login challenge; omitted when enrolling from a session.
    Enrolment:
      type: object
      required: [secret, uri]
      properties:
        secret:
          type: string
          description: Base32, for manual entry.
        uri:
          type: string
          description: The otpauth:// URI, for a QR code.
    ConfirmRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        challenge:
          type: string
          description: The login challenge; omitted when enrolling from a session.
        code:
          type: string
          description: Six digits from the authenticator app.
    VerifyRequest:
      type: object
      required: [challenge, code]
      additionalProperties: false
      properties:
        challenge:
          type: string
        code:
          type: string
          description: Six digits from the authenticator app.
    RegisterRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: Counted in characters, not bytes.
    InviteRequest:
      type: object
      required: [email, role]
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 254
        role:
          type: string
          enum: [admin, practitioner]
        givenName:
          type: string
          maxLength: 200
          description: Required for a practitioner; absent for an admin.
        familyName:
          type: string
          maxLength: 200
          description: Required for a practitioner; absent for an admin.
    Invite:
      type: object
      required: [id, email, role, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [admin, practitioner]
        givenName:
          type: string
        familyName:
          type: string
        expiresAt:
          type: string
          format: date-time
    InviteList:
      type: object
      required: [invites]
      properties:
        invites:
          type: array
          items: {$ref: "#/components/schemas/Invite"}
    AcceptInviteRequest:
      type: object
      required: [token, password]
      additionalProperties: false
      properties:
        token:
          type: string
          description: From the invite link's fragment.
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: Counted in characters, not bytes.
    Acceptance:
      type: object
      required: [challenge, secret, uri]
      properties:
        challenge:
          type: string
          description: For `/auth/mfa/confirm`; valid 5 minutes.
        secret:
          type: string
          description: Base32, for manual entry.
        uri:
          type: string
          description: The otpauth:// URI, for a QR code.
    Account:
      type: object
      required: [id, email, role, mfaEnrolled]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [admin, practitioner, patient]
        organizationId:
          type: string
          format: uuid
          description: The clinic of a staff account; absent for a patient.
        practitionerId:
          type: string
          format: uuid
          description: >-
            The directory's Practitioner of a practitioner account, for searches by practitioner; absent
            otherwise.
        mfaEnrolled:
          type: boolean
    Patient:
      type: object
      required: [id, givenName, familyName, birthDate, versionId, lastUpdated]
      description: The patient's profile (docs/booking/SPEC.md "Profile"). Health data.
      properties:
        id:
          type: string
          format: uuid
        givenName:
          type: string
        familyName:
          type: string
        birthDate:
          type: string
          format: date
        phone:
          type: string
          description: E.164; absent when none was given.
        versionId:
          type: integer
          format: int32
        lastUpdated:
          type: string
          format: date-time
    SavePatientRequest:
      type: object
      required: [givenName, familyName, birthDate]
      additionalProperties: false
      properties:
        givenName:
          type: string
          description: 1 to 100 characters after trimming.
        familyName:
          type: string
          description: 1 to 100 characters after trimming.
        birthDate:
          type: string
          format: date
          description: Before today (UTC), not before 1900-01-01.
        phone:
          type: string
          pattern: "^\\+[0-9]{8,15}$"
          description: Optional, E.164 (+ and 8 to 15 digits, no spaces); absent for none.
        versionId:
          type: integer
          format: int32
          minimum: 1
          description: The version being updated; absent to create the profile.
    GrantConsentRequest:
      type: object
      required: [organizationId]
      additionalProperties: false
      properties:
        organizationId:
          type: string
          format: uuid
          description: The clinic the profile and appointments are shared with.
    Consent:
      type: object
      required: [id, organizationId, status, dateTime]
      description: >-
        A patient's consent to share their profile and appointments with a clinic for care (FHIR Consent).
        Health data: it shows whom the patient consults.
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, inactive]
        dateTime:
          type: string
          format: date-time
          description: When it was granted.
        revokedAt:
          type: string
          format: date-time
          description: When it was revoked; absent while active.
    ConsentList:
      type: object
      required: [consents]
      properties:
        consents:
          type: array
          items: {$ref: "#/components/schemas/Consent"}
    AvailabilityRule:
      type: object
      required: [day, start, end]
      additionalProperties: false
      description: One weekly window, in the clinic's time zone.
      properties:
        day:
          type: integer
          minimum: 1
          maximum: 7
          description: ISO weekday, 1 Monday to 7 Sunday.
        start:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          examples: ["09:00"]
        end:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: After start.
          examples: ["12:00"]
    Availability:
      type: object
      required: [practitionerRoleId, availability, versionId]
      properties:
        id:
          type: string
          format: uuid
          description: The schedule's id (FHIR Schedule); absent before the first edit.
        practitionerRoleId:
          type: string
          format: uuid
        slotMinutes:
          type: integer
          format: int32
          description: Absent before the first edit.
        availability:
          type: array
          items: {$ref: "#/components/schemas/AvailabilityRule"}
          description: Sorted by day and start.
        versionId:
          type: integer
          format: int32
          description: 0 before the first edit.
    SaveAvailabilityRequest:
      type: object
      required: [slotMinutes, availability]
      additionalProperties: false
      properties:
        slotMinutes:
          type: integer
          format: int32
          minimum: 5
          maximum: 240
          multipleOf: 5
        availability:
          type: array
          items: {$ref: "#/components/schemas/AvailabilityRule"}
    SetSpecialtyRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          description: A SNOMED CT code, one of the directory's twelve specialties.
          examples: ["394579002"]
    Specialty:
      type: object
      required: [system, code, display, text]
      description: A practitioner role's specialty, a coding from FHIR R4 ValueSet c80-practice-codes.
      properties:
        system:
          type: string
          const: http://snomed.info/sct
        code:
          type: string
        display:
          type: string
          description: The concept's display in the value set.
        text:
          type: string
          description: The name the apps show.
    SpecialtyList:
      type: object
      required: [specialties]
      properties:
        specialties:
          type: array
          items: {$ref: "#/components/schemas/Specialty"}
    RoleSpecialty:
      type: object
      required: [id, versionId]
      properties:
        id:
          type: string
          format: uuid
        specialty:
          $ref: "#/components/schemas/Specialty"
        versionId:
          type: integer
          format: int32
    BookAppointmentRequest:
      type: object
      required: [slotId]
      additionalProperties: false
      properties:
        slotId:
          type: string
          format: uuid
          description: A free slot, as Slot?schedule=…&status=free gives it.
    SetAppointmentStatusRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [fulfilled, noshow]
    Appointment:
      type: object
      required: [id, organizationId, practitionerRoleId, slotId, start, end, status, versionId]
      description: >-
        An appointment after a booking or a change (FHIR Appointment; reads go through FHIR). Health data: it
        shows whom the patient consults. Neither the patient nor who cancelled is in it.
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        practitionerRoleId:
          type: string
          format: uuid
        slotId:
          type: string
          format: uuid
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        status:
          type: string
          enum: [booked, cancelled, fulfilled, noshow]
        cancellationReason:
          type: string
          enum: [pat, prov]
          description: >-
            http://terminology.hl7.org/CodeSystem/appointment-cancellation-reason: `pat` the patient (also by
            revoking consent), `prov` staff. Absent unless cancelled.
        cancelledAt:
          type: string
          format: date-time
          description: Absent unless cancelled.
        versionId:
          type: integer
          format: int32
    SaveQuestionnaireRequest:
      type: object
      required: [title, item]
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 200
          description: Not blank.
        description:
          type: string
          maxLength: 1000
        item:
          type: array
          maxItems: 200
          items: {$ref: "#/components/schemas/QuestionnaireItem"}
          description: At most 200 items in all, sections and instructions included.
    QuestionnaireItem:
      type: object
      required: [linkId, text, type]
      additionalProperties: false
      description: >-
        One item, as FHIR Questionnaire.item. Sections (`group`) are top level only and hold questions and
        instructions. Single and multiple choice are both `choice`; `repeats` tells them apart.
      properties:
        linkId:
          type: string
          pattern: "^[A-Za-z0-9-]{1,64}$"
          description: Opaque and random, unique within the questionnaire, kept by later versions.
        text:
          type: string
          maxLength: 500
          description: Not blank.
        type:
          type: string
          enum: [group, display, string, text, boolean, choice, integer, decimal, date]
        required:
          type: boolean
          description: Questions only.
        repeats:
          type: boolean
          description: Choice only, several answers.
        help:
          type: string
          maxLength: 500
          description: Help text, on questions and sections.
        answerOption:
          type: array
          minItems: 2
          maxItems: 50
          description: Choice only, each value different.
          items:
            type: object
            required: [valueString]
            additionalProperties: false
            properties:
              valueString:
                type: string
                minLength: 1
                maxLength: 200
        enableWhen:
          type: object
          required: [question]
          additionalProperties: false
          description: >-
            Shown only when the earlier item `question`, a boolean or a choice, is answered `answerBoolean` or
            `answerString` (one of its options); a choice with repeats when any answer matches.
          properties:
            question:
              type: string
            answerBoolean:
              type: boolean
            answerString:
              type: string
        item:
          type: array
          items: {$ref: "#/components/schemas/QuestionnaireItem"}
          description: A section's questions and instructions.
    Questionnaire:
      type: object
      required: [id, url, status, title, item, lastUpdated, version, versionId]
      description: A version of a questionnaire (FHIR Questionnaire; reads go through FHIR).
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          description: The canonical url, the same for every version of the questionnaire.
          examples: ["https://salus.invalid/fhir/Questionnaire/0b6f3a0e-1d1c-4c43-9a51-6d2b9b1d5e7a"]
        status:
          type: string
          enum: [draft, active, retired]
        title:
          type: string
        description:
          type: string
        item:
          type: array
          items: {$ref: "#/components/schemas/QuestionnaireItem"}
        lastUpdated:
          type: string
          format: date-time
        version:
          type: integer
          format: int32
          description: 1, 2, … within the questionnaire.
        versionId:
          type: integer
          format: int32
          description: The version of this row, for If-Match.
    QuestionnaireDefault:
      type: object
      required: [practitionerRoleId, versionId]
      properties:
        practitionerRoleId:
          type: string
          format: uuid
        url:
          type: string
          description: The canonical url of the default questionnaire; absent while the role has none.
        versionId:
          type: integer
          format: int32
          description: 0 while the role has none.
    SetRoleQuestionnaireRequest:
      type: object
      required: [questionnaireId]
      additionalProperties: false
      properties:
        questionnaireId:
          type: string
          format: uuid
          description: Any version of the questionnaire.
    RequestQuestionnaireRequest:
      type: object
      required: [questionnaireId]
      additionalProperties: false
      properties:
        questionnaireId:
          type: string
          format: uuid
          description: The active version to ask.
    AnswerValue:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      description: >-
        One answer value, as FHIR QuestionnaireResponse.item.answer.value[x], of the item's type: `valueString`
        for string, text and choice (one of its options), `valueBoolean`, `valueInteger`, `valueDecimal`
        (written plainly, at most 15 significant digits), `valueDate` (YYYY-MM-DD).
      properties:
        valueString:
          type: string
          minLength: 1
          maxLength: 4000
        valueBoolean:
          type: boolean
        valueInteger:
          type: integer
          format: int32
        valueDecimal:
          type: number
        valueDate:
          type: string
          format: date
    Answer:
      type: object
      required: [linkId, values]
      additionalProperties: false
      description: The answer to one question; several values only for a choice with repeats.
      properties:
        linkId:
          type: string
        values:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/AnswerValue"}
    SaveAnswersRequest:
      type: object
      required: [answers]
      additionalProperties: false
      properties:
        answers:
          type: array
          description: Every saved answer; a question left out is unanswered.
          items: {$ref: "#/components/schemas/Answer"}
    QuestionnaireResponse:
      type: object
      required: [id, appointmentId, questionnaireId, status, source, answers, dueAt, lastUpdated, versionId]
      description: >-
        A questionnaire the patient is asked to fill in before an appointment, and their answers (FHIR
        QuestionnaireResponse; reads go through FHIR, the answers nested under the questionnaire's sections).
      properties:
        id:
          type: string
          format: uuid
        appointmentId:
          type: string
          format: uuid
        questionnaireId:
          type: string
          format: uuid
          description: The questionnaire version asked.
        status:
          type: string
          enum: [in-progress, completed, stopped]
          description: In progress, submitted, or withdrawn by the practitioner.
        source:
          type: string
          enum: [default, added]
          description: The practitioner role's default, with the booking, or added by the practitioner.
        answers:
          type: array
          items: {$ref: "#/components/schemas/Answer"}
        dueAt:
          type: string
          format: date-time
          description: The appointment's start; the answers are due before it.
        authored:
          type: string
          format: date-time
          description: When the patient submitted; absent before.
        lastUpdated:
          type: string
          format: date-time
        versionId:
          type: integer
          format: int32
          description: The version of the answers, for If-Match.
    Error:
      type: object
      required: [error]
      description: Every JSON API error. The code is fixed per case; it never carries internal text.
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_email
            - invalid_password
            - email_taken
            - unauthenticated
            - wrong_credentials
            - rate_limited
            - invalid_challenge
            - wrong_code
            - already_enrolled
            - not_enrolled
            - csrf
            - forbidden
            - invalid_role
            - invalid_name
            - invalid_invite
            - invalid_birth_date
            - invalid_phone
            - not_found
            - version_conflict
            - consent_active
            - consent_inactive
            - profile_required
            - invalid_specialty
            - invalid_slot_minutes
            - invalid_availability
            - consent_required
            - slot_unavailable
            - cancellation_window_closed
            - appointment_closed
            - appointment_not_started
            - invalid_status
            - join_window_not_open
            - consultation_ended
            - practitioner_did_not_join
            - consultation_not_started
            - not_draft
            - not_active
            - draft_exists
            - invalid_questionnaire
            - already_requested
            - appointment_started
            - submitted
            - withdrawn
            - past_due
            - answers_invalid
            - internal error
            - timeout
        linkIds:
          type: array
          items: {type: string}
          description: With `invalid_questionnaire` and `answers_invalid` only, the offending items' linkIds in document order.
    ConsultationJoin:
      type: object
      required: [url, token, expiresAt, peerName, role]
      description: >-
        What a client needs to join the room. The token is a secret: it is never logged or stored. Health
        data: it shows whom the patient consults.
      properties:
        url:
          type: string
          description: The LiveKit server the client connects to (ws:// locally, wss:// deployed).
        token:
          type: string
          description: The LiveKit join token, valid 5 minutes for joining.
        expiresAt:
          type: string
          format: date-time
        peerName:
          type: string
          description: >-
            The other person's display name; empty when the caller may not see it (the practitioner after a
            revocation, or a practitioner not in the public directory).
        role:
          type: string
          enum: [patient, practitioner]
          description: The caller's role in the consultation.
    ConsultationStatus:
      type: object
      required: [state]
      description: >-
        Where an appointment's video consultation stands. Health data: it shows that the patient attended. The
        times are absent until they happen.
      properties:
        state:
          type: string
          enum: [not_started, open, ended]
        patientJoinedAt:
          type: string
          format: date-time
          description: When the patient first joined the room.
        practitionerJoinedAt:
          type: string
          format: date-time
          description: When the practitioner first joined the room.
        endedAt:
          type: string
          format: date-time
        endReason:
          type: string
          enum: [practitioner, window_closed, practitioner_absent, time_limit, cancelled]
          description: >-
            Why it ended: the practitioner ended it; the window closed with the room empty; the practitioner never
            joined; the 2-hour limit after the scheduled end; the appointment was cancelled.
        reason:
          type: string
          enum: [consent_withdrawn, cancelled, left, ended, practitioner_did_not_join, time_limit]
          description: >-
            Why the patient was removed or the consultation ended, as the clients show it: the patient was removed
            because their consent was withdrawn (also when that cancelled the appointment), or because the
            appointment was cancelled; while open, the patient who joined left on their own; the practitioner ended
            it or the window closed with the room empty; the window closed without the practitioner; the 2-hour
            limit. Absent while nobody has joined or left.
    LiveKitWebhookEvent:
      type: object
      description: >-
        LiveKit's WebhookEvent in its JSON form (protojson); only `event`, `room.name`, the participant's
        `identity` and `joinedAt`/`joinedAtMs`, and `createdAt` are read.
      properties:
        event: {type: string, examples: [participant_joined]}
      additionalProperties: true
    WebhookReceived:
      type: object
      description: An empty object.
      additionalProperties: false
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Unavailable:
      type: object
      required: [status, failed]
      properties:
        status:
          type: string
          const: unavailable
        failed:
          type: array
          description: Names of the failing checks.
          items:
            type: string
            enum: [postgres, redis]
