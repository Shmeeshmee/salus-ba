  /me/history-sharing:
    get:
      operationId: listMyHistorySharing
      summary: The clinics the signed-in patient shares history with
      description: >-
        SAL-42. Every clinic with an active history consent of the patient's, with the visits it lists now. Patients
        only. Not cached. Audited.
      tags: [history]
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
