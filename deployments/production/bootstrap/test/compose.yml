# The backup test (run.sh): a source Postgres with the repository's migrations (real roles, grants, row-level
# security) and synthetic rows, a throwaway Postgres to restore into, a source Garage and one to restore into (the
# production garage.toml, synthetic keys), an SFTP server standing in for the Storage Box, and the runner. No host
# ports. The runner talks to the host's Docker daemon to `docker exec` into this project's postgres containers and
# to run rclone on this project's network, as salus-backup does on the server.
name: ${TEST_PROJECT:?set TEST_PROJECT}

x-postgres: &postgres
  image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
  environment:
    POSTGRES_USER: salus
    POSTGRES_PASSWORD: synthetic-test-only
    POSTGRES_DB: salus
  healthcheck:
    test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "salus", "-d", "salus"]
    interval: 1s
    timeout: 3s
    retries: 60

services:
  postgres:
    <<: *postgres
    volumes: [./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro]

  restore-db: *postgres

  # The real schema: cmd/migrate from this checkout, on the dev toolchain image (build/package/dev.Dockerfile).
  migrate:
    build:
      context: ../../../..
      dockerfile: build/package/dev.Dockerfile
    image: salus-backup-test-tools:local
    working_dir: /src
    volumes: [../../../..:/src:ro]
    environment:
      DATABASE_URL: postgres://salus:synthetic-test-only@postgres:5432/salus?sslmode=disable
      APP_DATABASE_PASSWORD: synthetic-test-app
      RETENTION_DATABASE_PASSWORD: synthetic-test-retention
      STATS_DATABASE_PASSWORD: synthetic-test-stats
    command: ["go", "run", "./cmd/migrate", "up"]
    depends_on:
      postgres: {condition: service_healthy}

  objectstore: &garage
    image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: 5a1a5eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
      GARAGE_DEFAULT_ACCESS_KEY: GK5a1a5e000000000000000001
      GARAGE_DEFAULT_SECRET_KEY: 5a1a5e0000000000000000000000000000000000000000000000000000000001
      GARAGE_DEFAULT_BUCKET: salus-binaries
      RUST_LOG: garage=warn
    volumes: [../../garage.toml:/etc/garage.toml:ro]
    tmpfs: [/var/lib/garage]
    healthcheck:
      test: ["CMD", "/garage", "bucket", "info", "salus-binaries"]
      interval: 1s
      timeout: 5s
      retries: 60

  restore-objectstore: *garage

  sftp:
    build: .
    image: salus-backup-test:local
    command: ["sh", "-c", "until [ -s /keys/backup.pub ]; do sleep 0.2; done; install -d -m 700 -o storagebox -g storagebox /home/storagebox/.ssh && install -m 600 -o storagebox -g storagebox /keys/backup.pub /home/storagebox/.ssh/authorized_keys && exec /usr/sbin/sshd -D -e"]
    volumes: [keys:/keys:ro]

  runner:
    image: salus-backup-test:local
    depends_on:
      migrate: {condition: service_completed_successfully}
      restore-db: {condition: service_healthy}
      objectstore: {condition: service_healthy}
      restore-objectstore: {condition: service_healthy}
      sftp: {condition: service_started}
    environment:
      TEST_PROJECT: ${TEST_PROJECT}
    volumes:
      - keys:/keys
      - objects:/objects # shared with the rclone containers the test runs (seed and restore)
      - ..:/bootstrap:ro
      - ../../../../migrations:/migrations:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["bash", "/bootstrap/test/backup-test.sh"]

volumes:
  keys:
  objects:
