# The local stack and the dev toolchain. Run everything through make (see the Makefile); the host needs
# only Docker and make. Toolchain services (tools, node, flutter) sit behind profiles, so `docker compose up`
# starts the stack only. Postgres and Redis publish no host ports: everything reaches them on the compose
# network (`make psql` opens a client). Published ports bind to 127.0.0.1 and can be moved with the SALUS_*_PORT
# variables in deployments/.env (see configs/.env.example) when another project holds the defaults.
# Every long-running service has `restart: unless-stopped`, so the stack comes back after a host reboot; the
# one-shot migrate and the profile toolchains do not.
name: salus

x-app: &app
  build:
    context: ..
    dockerfile: build/package/Dockerfile
  image: salus:${SALUS_IMAGE_TAG:-dev}
  environment: &app-env
    # The app binaries log in as salus_app: no superuser, no BYPASSRLS, owner of nothing, so grants and
    # row-level security apply. Only migrate (and salusctl) connect as the owner, salus. Local only.
    DATABASE_URL: postgres://salus_app:local-app-password@postgres:5432/salus?sslmode=disable
    REDIS_URL: redis://redis:6379/0
  restart: unless-stopped
  depends_on: &app-deps
    migrate: {condition: service_completed_successfully}
    redis: {condition: service_healthy}

# The LiveKit settings (docs/consultation/SPEC.md §2 "Configuration"): only the api, the worker and the agent load
# them.
# The key pair is deployments/livekit.yaml's synthetic dev pair, local only.
x-livekit-env: &livekit-env
  LIVEKIT_URL: http://livekit:7880
  LIVEKIT_PUBLIC_URL: ws://localhost:${SALUS_LIVEKIT_PORT:-7880}
  LIVEKIT_API_KEY: devkey
  LIVEKIT_API_SECRET: local-only-synthetic-livekit-secret-0123456789

# The object store and the files' key-encryption key (docs/attachments/SPEC.md §2 "Configuration"): only the api
# and the worker load them (config.LoadObjectStore). The access key pair and the KEK are synthetic, local only;
# production's KEK is the root-only key file on the encrypted volume (BINARY_KEK_FILE, ADR 0011).
x-objectstore-env: &objectstore-env
  S3_ENDPOINT: http://objectstore:3900
  S3_REGION: garage
  S3_BUCKET: salus-binaries
  S3_ACCESS_KEY_ID: GK5a1a50000000000000000001
  S3_SECRET_ACCESS_KEY: 5a1a500000000000000000000000000000000000000000000000000000000001
  BINARY_KEK: bG9jYWwtb25seS1zeW50aGV0aWMtYmluYXJ5LWtlayE= # base64 of 32 synthetic bytes
  BINARY_KEK_ID: local-1

# The clinics' webhook secrets are sealed with WEBHOOK_KEY (SAL-29): only the api (which seals a new one) and the
# worker (which delivers) load it. Synthetic, local only; production's is the root-only key file on the encrypted
# volume (WEBHOOK_KEY_FILE, ADR 0011).
x-webhook-env: &webhook-env
  WEBHOOK_KEY: bG9jYWwtb25seS1zeW50aGV0aWMtd2ViaG9vay1rZXk= # base64 of 32 synthetic bytes

x-host-user: &host-user
  # Files the toolchains write into the repo stay owned by the host user. make exports HOST_UID/HOST_GID.
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

services:
  postgres:
    image: postgres:18.6
    # The default 100 connections is too few for `make cover`: every test package runs in parallel, each
    # test with its own pools (River clients included); 87 were measured at the peak, and one run failed with
    # 53300 (docs/accounts/PROGRESS.md, package 5). With the booking packages the uncached suite went past
    # 200 and failed with 53300 again; the measured peak is in docs/booking/PROGRESS.md, package 6.
    command: ["postgres", "-c", "max_connections=400"]
    environment:
      POSTGRES_USER: salus
      POSTGRES_PASSWORD: salus # local only; synthetic data only
      POSTGRES_DB: salus
    volumes: [postgres:/var/lib/postgresql]
    restart: unless-stopped
    # Over TCP, as every client connects: on a fresh volume the image first runs a setup server on its Unix
    # socket only, then restarts; a socket check passed during setup and migrate failed to connect.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "salus", "-d", "salus"]
      interval: 1s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.10.3
    # Temporary state only (ADR 0005): nothing is written to disk. 256 logical databases so redistest can
    # give each parallel test its own.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--databases", "256"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  # Applies the embedded goose migrations, then exits; the app services start after it succeeds.
  migrate:
    <<: *app
    command: ["/usr/local/bin/migrate", "up"]
    environment:
      DATABASE_URL: postgres://salus:salus@postgres:5432/salus?sslmode=disable # the owner; local only
      APP_DATABASE_PASSWORD: local-app-password # set on salus_app after the migrations; synthetic, local only
      RETENTION_DATABASE_PASSWORD: local-retention-password # set on salus_retention likewise
      STATS_DATABASE_PASSWORD: local-stats-password # set on salus_stats likewise (the aggregate builds, ADR 0013)
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *app
    command: ["/usr/local/bin/api"]
    environment:
      <<: [*app-env, *livekit-env, *objectstore-env, *webhook-env]
      HTTP_ADDR: ":8080"
      # Synthetic, local only. TOTP_KEY seals TOTP secrets (production: the root-only key file on the encrypted
      # volume, ADR 0011);
      # RATE_LIMIT_KEY names the login rate-limit counters in Redis by HMAC.
      TOTP_KEY: bG9jYWwtb25seS1zeW50aGV0aWMtdG90cC1rZXktMzI=
      RATE_LIMIT_KEY: bG9jYWwtb25seS1zeW50aGV0aWMtcmF0ZWxpbWl0LWs=
      # The FHIR API's public base, for the links and fullUrls of a search's Bundle.
      FHIR_BASE_URL: http://localhost:${SALUS_API_PORT:-8080}/fhir/R4
    ports: ["127.0.0.1:${SALUS_API_PORT:-8080}:8080"]
    depends_on:
      <<: *app-deps
      objectstore: {condition: service_healthy}

  worker:
    <<: *app
    command: ["/usr/local/bin/worker"]
    environment:
      <<: [*app-env, *livekit-env, *objectstore-env, *webhook-env]
      CLAMD_ADDR: clamd:3310 # the binary_scan job's scanner (config.LoadClamd)
      # The retention_apply job's own login, salus_retention (BYPASSRLS, SELECT and DELETE on the tables whose
      # rule is delete). Only this service has it (internal/worker's tests check). Synthetic, local only.
      RETENTION_DATABASE_URL: postgres://salus_retention:local-retention-password@postgres:5432/salus?sslmode=disable
      # The live suggestions' model (SAL-7): the fake suggests nothing, no text leaves the stack. Anthropic is
      # not enabled (docs/privacy/processors.md).
      LLM_ENGINE: fake
    depends_on:
      <<: *app-deps
      objectstore: {condition: service_healthy}
      clamd: {condition: service_healthy}

  # Enqueues the periodic jobs (retention_apply daily at 03:00 UTC) and is River's only leader.
  scheduler:
    <<: *app
    command: ["/usr/local/bin/scheduler"]

  # Sends e-mail: works only River's email queue. SMTP to Mailpit locally, in plaintext without a login
  # (SMTP_TLS=none); production sends through an EU relay with TLS and a login (ADR 0011).
  notifier:
    <<: *app
    command: ["/usr/local/bin/notifier"]
    environment:
      <<: *app-env
      SMTP_ADDR: mailpit:1025
      SMTP_TLS: none
      SMTP_FROM: Salus <no-reply@salus.invalid> # .invalid: nothing can reply to a local e-mail
      WEB_BASE_URL: http://localhost:${SALUS_WEB_PORT:-5173} # invite links: <WEB_BASE_URL>/invite#<token>
      # Appointment e-mails link to <PATIENT_APP_URL>/appointments. A placeholder (.invalid resolves nowhere)
      # until the patient app has a link domain (docs/booking/PROGRESS.md, "Waiting on people").
      PATIENT_APP_URL: ${PATIENT_APP_URL:-https://patient.salus.invalid}
    depends_on:
      <<: *app-deps
      mailpit: {condition: service_healthy}

  # The transcription agent (SAL-4): works only River's transcription queue, joins each consultation's LiveKit room
  # once the practitioner is in, and puts the transcript events on the encounter's Redis Stream. STT_ENGINE is
  # fake: placeholder captions, no audio leaves the stack. LLM_ENGINE is fake: each final line is "translated" by
  # marking it with its target language, no text leaves the stack. Neither Azure nor Anthropic is enabled
  # (docs/privacy/processors.md).
  agent:
    <<: *app
    command: ["/usr/local/bin/agent"]
    environment:
      <<: [*app-env, *livekit-env]
      STT_ENGINE: fake
      LLM_ENGINE: fake
    depends_on:
      <<: *app-deps
      livekit: {condition: service_healthy}

  # Video (ADR 0006), configured by livekit.yaml: the synthetic dev key pair, rooms created only by the api, JSON
  # logs, the ICE settings for clients on the host and on the compose network, and TURN (TLS on 443, UDP on 3478,
  # on the compose network only). Published on 127.0.0.1 for a local browser: signalling on 7880, media on
  # 7882/udp and 7881/tcp (SALUS_LIVEKIT_PORT, SALUS_LIVEKIT_UDP_PORT and SALUS_LIVEKIT_TCP_PORT move them).
  livekit:
    image: livekit/livekit-server:v1.13.11
    command: ["--config", "/etc/livekit.yaml"]
    volumes: ["./livekit.yaml:/etc/livekit.yaml:ro", "./livekit-turn:/etc/livekit-turn:ro"]
    networks:
      default:
        aliases: [turn.salus.test] # the TURN domain of livekit.yaml and its local certificate
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SALUS_LIVEKIT_PORT:-7880}:7880"
      - "127.0.0.1:${SALUS_LIVEKIT_TCP_PORT:-7881}:7881"
      - "127.0.0.1:${SALUS_LIVEKIT_UDP_PORT:-7882}:7882/udp"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880"]
      interval: 1s
      timeout: 3s
      retries: 30

  # The S3-compatible object store for the files patients attach (ADR 0010): Garage, one node, on the compose
  # network only (the api serves the files). --single-node lays the cluster out at start, --default-bucket creates
  # the bucket salus-binaries and the synthetic access key of x-objectstore-env and grants it the bucket, so no
  # init service is needed. Configured inline (configs: below), with no bind mount, so every worktree resolves the
  # same service. The RPC secret is synthetic, local only. The health check passes once the bucket exists.
  objectstore:
    image: dxflrs/garage:v2.5.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: 5a1a5fffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
      GARAGE_DEFAULT_ACCESS_KEY: GK5a1a50000000000000000001
      GARAGE_DEFAULT_SECRET_KEY: 5a1a500000000000000000000000000000000000000000000000000000000001
      GARAGE_DEFAULT_BUCKET: salus-binaries
    configs: [{source: garage, target: /etc/garage.toml}]
    volumes: [objectstore:/var/lib/garage]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/garage", "bucket", "info", "salus-binaries"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The malware scanner (ADR 0010): clamd on TCP 3310, compose network only. The image carries a signature
  # database, copied into the clamav volume on its first start; freshclam then updates it (needs the internet,
  # once a day; it sends no personal data). The stream and scan limits are 250 MB, above the 200 MB video limit;
  # ConcurrentDatabaseReload off, so a signature reload does not double clamd's memory (about 1.5 GB) on a
  # developer machine. Set through the image's CLAMD_CONF_* variables, no bind mount. Healthy once clamd
  # answers PING with PONG, which waits for the signatures to load.
  clamd:
    image: clamav/clamav:1.5.4
    environment:
      CLAMD_CONF_StreamMaxLength: 250M
      CLAMD_CONF_MaxFileSize: 250M
      CLAMD_CONF_MaxScanSize: 250M
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
    volumes: [clamav:/var/lib/clamav]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5m

  # Catches every e-mail sent locally; web UI on 127.0.0.1:8025 (SMTP 1025 on the compose network only).
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports: ["127.0.0.1:${SALUS_MAILPIT_PORT:-8025}:8025"]
    restart: unless-stopped

  # Two more Mailpits for the SMTP sender's tests of TLS and authentication (ADR 0011: a relay takes STARTTLS on 587
  # or implicit TLS on 465, with AUTH): mailpit-starttls refuses mail before STARTTLS, mailpit-tls speaks TLS from
  # the first byte; both refuse mail without the synthetic login and accept AUTH only over TLS. Their certificate
  # (deployments/mailpit-tls, `make mailpit-tls-cert`) names both services and is signed by a throwaway CA that only
  # the tools service trusts. Compose network only, nothing published; the dev stack sends through mailpit above.
  mailpit-starttls:
    image: axllent/mailpit:v1.33.1
    command: ["--smtp-tls-cert", "/etc/mailpit-tls/smtp.crt", "--smtp-tls-key", "/etc/mailpit-tls/smtp.key", "--smtp-require-starttls"]
    environment: &mailpit-auth
      MP_SMTP_AUTH: "salus-test:local-only-synthetic-smtp-password"
    volumes: ["./mailpit-tls:/etc/mailpit-tls:ro"]
    restart: unless-stopped
  mailpit-tls:
    image: axllent/mailpit:v1.33.1
    command: ["--smtp-tls-cert", "/etc/mailpit-tls/smtp.crt", "--smtp-tls-key", "/etc/mailpit-tls/smtp.key", "--smtp-require-tls"]
    environment: *mailpit-auth
    volumes: ["./mailpit-tls:/etc/mailpit-tls:ro"]
    restart: unless-stopped

  # Marketing landing page (landing/): the prerendered React app on nginx, 127.0.0.1:8090. Fonts are bundled,
  # so the page makes no third-party request. `make landing` starts it alone.
  landing:
    build:
      context: ../landing
      dockerfile: ../build/package/landing.Dockerfile
    image: salus-landing:dev
    ports: ["127.0.0.1:${SALUS_LANDING_PORT:-8090}:8080"]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Go toolchain: tests, lint, migrations, sqlc. `make test` runs `docker compose run --rm tools go test ./...`.
  tools:
    profiles: [tools]
    build:
      context: ..
      dockerfile: build/package/dev.Dockerfile
    image: salus-tools:dev
    <<: *host-user
    working_dir: /src
    environment:
      TEST_DATABASE_URL: postgres://salus:salus@postgres:5432/salus?sslmode=disable
      # salus_app is cluster-wide: the same synthetic password migrate sets, so tests and the stack agree.
      TEST_APP_DATABASE_PASSWORD: local-app-password
      # salus_retention, the retention job's login, is cluster-wide too: the value migrate sets.
      TEST_RETENTION_DATABASE_PASSWORD: local-retention-password
      # salus_stats, the aggregate builds' login (ADR 0013), likewise.
      TEST_STATS_DATABASE_PASSWORD: local-stats-password
      TEST_REDIS_URL: redis://redis:6379/0
      # The SMTP sender's tests deliver to the compose Mailpit and read its API, then delete what they sent.
      TEST_SMTP_ADDR: mailpit:1025
      TEST_MAILPIT_URL: http://mailpit:8025
      # Its TLS tests deliver through STARTTLS and implicit TLS with the synthetic login of mailpit-starttls and
      # mailpit-tls, whose certificate's CA (deployments/mailpit-tls/ca) is trusted beside the system roots.
      TEST_SMTP_STARTTLS_ADDR: mailpit-starttls:1025
      TEST_SMTP_STARTTLS_MAILPIT_URL: http://mailpit-starttls:8025
      TEST_SMTP_TLS_ADDR: mailpit-tls:1025
      TEST_SMTP_TLS_MAILPIT_URL: http://mailpit-tls:8025
      TEST_SMTP_USERNAME: salus-test
      TEST_SMTP_PASSWORD: local-only-synthetic-smtp-password
      SSL_CERT_DIR: /etc/ssl/certs:/src/deployments/mailpit-tls/ca
      # The LiveKit provider's tests run against the compose LiveKit (its server API and its WebSocket for the
      # Go SDK's test participants), with livekit.yaml's synthetic dev pair; without them they fail.
      TEST_LIVEKIT_URL: http://livekit:7880
      TEST_LIVEKIT_API_KEY: devkey
      TEST_LIVEKIT_API_SECRET: local-only-synthetic-livekit-secret-0123456789
      # The object store's and clamd's tests (pkg/clamd, internal/binary) run against the compose Garage and clamd,
      # with x-objectstore-env's synthetic key pair; object keys are prefixed per test. Without them they fail.
      TEST_S3_ENDPOINT: http://objectstore:3900
      TEST_S3_REGION: garage
      TEST_S3_BUCKET: salus-binaries
      TEST_S3_ACCESS_KEY_ID: GK5a1a50000000000000000001
      TEST_S3_SECRET_ACCESS_KEY: 5a1a500000000000000000000000000000000000000000000000000000000001
      TEST_CLAMD_ADDR: clamd:3310
      DATABASE_URL: postgres://salus:salus@postgres:5432/salus?sslmode=disable # make migrate: the owner
      APP_DATABASE_PASSWORD: local-app-password
      RETENTION_DATABASE_PASSWORD: local-retention-password # make migrate sets it on salus_retention
      STATS_DATABASE_PASSWORD: local-stats-password # and on salus_stats
    volumes:
      - ..:/src
      # The git directory at its host path (make exports GIT_COMMON_DIR): a worktree's .git file points there, so
      # git (scripts/check-migrations.sh) works in a worktree as in the main checkout. Without make, /src/.git again.
      - ${GIT_COMMON_DIR:-../.git}:${GIT_COMMON_DIR:-/src/.git}
      - gomod:/cache/gomod
      - gobuild:/cache/gobuild
      - golangci:/cache/golangci
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      mailpit: {condition: service_healthy}
      mailpit-starttls: {condition: service_healthy}
      mailpit-tls: {condition: service_healthy}
      livekit: {condition: service_healthy}
      objectstore: {condition: service_healthy}
      clamd: {condition: service_healthy}

  # `make turn-check` (docs/consultation/PROGRESS.md, package 10): the tools image with NET_ADMIN, so
  # scripts/turn-check.sh can block UDP and LiveKit's ICE/TCP port in this container only, then run test/turn as
  # the host user. It trusts the local TURN CA (deployments/livekit-turn/ca) beside the system roots.
  turn-check:
    profiles: [tools]
    image: salus-tools:dev
    user: "0:0"
    cap_add: [NET_ADMIN]
    working_dir: /src
    command: ["bash", "scripts/turn-check.sh"]
    environment:
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
      SSL_CERT_DIR: /etc/ssl/certs:/src/deployments/livekit-turn/ca
      TEST_LIVEKIT_URL: http://livekit:7880
      TEST_LIVEKIT_API_KEY: devkey
      TEST_LIVEKIT_API_SECRET: local-only-synthetic-livekit-secret-0123456789
    volumes:
      - ..:/src
      - gomod:/cache/gomod
      - gobuild:/cache/gobuild
    depends_on:
      livekit: {condition: service_healthy}

  # The end-to-end runner: `make e2e` (build/package/playwright/Dockerfile). The Go journeys reach the API,
  # Mailpit, Postgres (salusctl and the appointment's start, as the owner) and LiveKit on the compose network; the
  # consultation journey starts the web journey in Chromium (test/e2e/web), which runs the Vite dev server on its
  # own localhost (a secure context, as on a developer's host) and reaches LiveKit's media ports directly
  # (docs/consultation/PROGRESS.md, package 8). /e2e holds the run's LiveKit log check.
  playwright:
    profiles: [e2e]
    build:
      context: ..
      dockerfile: build/package/playwright/Dockerfile
    image: salus-playwright:1.65.0
    <<: *host-user
    init: true
    working_dir: /src
    environment:
      E2E_BASE_URL: http://api:8080
      E2E_MAILPIT_URL: http://mailpit:8025
      E2E_SALUSCTL: /tmp/salusctl
      E2E_LIVEKIT_CHECK: /e2e/livekit-check.tsv
      E2E_LATENCY_REPORT: /e2e/consult-latency.md # the consultation pipeline's latency, per run (make e2e-report)
      TEST_LIVEKIT_URL: http://livekit:7880
      E2E_REDIS_URL: redis://redis:6379/0 # the encounter's event stream the transcription agent writes (SAL-4)
      DATABASE_URL: postgres://salus:salus@postgres:5432/salus?sslmode=disable # salusctl and startAt: the owner
      API_URL: http://api:8080 # the Vite dev server proxies API calls here
    volumes:
      - ..:/src
      - gomod:/cache/gomod
      - gobuild:/cache/gobuild
      - npm:/cache/npm
      - e2e:/e2e
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      mailpit: {condition: service_healthy}
      livekit: {condition: service_healthy}

  # HL7 FHIR validator: `make fhir-validate`. Reads the repo only.
  fhir-validator:
    profiles: [tools]
    build:
      context: ..
      dockerfile: build/package/fhir-validator.Dockerfile
    image: salus-fhir-validator:7.0.2
    volumes:
      - ..:/src:ro
      - fhir:/cache

  # Generates the Dart client from api/openapi.yaml: `make gen-clients`.
  openapi-generator:
    profiles: [tools]
    image: openapitools/openapi-generator-cli:v7.27.0
    <<: *host-user
    working_dir: /src
    environment:
      HOME: /tmp
    volumes:
      - ..:/src

  # Web toolchain and the Vite dev server (port 5173): `make web-dev`.
  node:
    profiles: [web]
    build:
      context: ..
      dockerfile: build/package/node.Dockerfile
    image: salus-node:24.22.0
    <<: *host-user
    working_dir: /src/web
    environment:
      API_URL: http://api:8080 # the Vite dev server proxies API calls here
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    ports: ["127.0.0.1:${SALUS_WEB_PORT:-5173}:5173"]
    volumes:
      - ..:/src
      - npm:/cache/npm

  # Vite dev server for the landing page (landing/): `make landing-dev`, on 127.0.0.1:5174.
  landing-dev:
    profiles: [landing]
    build:
      context: ..
      dockerfile: build/package/node.Dockerfile
    image: salus-node:24.22.0
    <<: *host-user
    working_dir: /src/landing
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5174"]
    ports: ["127.0.0.1:${SALUS_LANDING_DEV_PORT:-5174}:5174"]
    volumes:
      - ..:/src
      - npm:/cache/npm

  # Flutter toolchain: analyze, test, codegen. Devices and emulators stay on the host (README.md).
  flutter:
    profiles: [mobile]
    build:
      context: ..
      dockerfile: build/package/flutter.Dockerfile
    image: salus-flutter:3.47.7
    <<: *host-user
    working_dir: /src/mobile
    volumes:
      - ..:/src
      - pub:/cache/pub

# Garage's configuration, inline so that no worktree bind-mounts its own copy (ADR 0010). The RPC secret is in
# the service's environment.
configs:
  garage:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "sqlite"
      replication_factor = 1
      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "127.0.0.1:3901"

      [s3_api]
      s3_region = "garage"
      api_bind_addr = "[::]:3900"

volumes:
  postgres:
  objectstore:
  clamav:
  gomod:
  gobuild:
  golangci:
  npm:
  pub:
  fhir:
  e2e:
