# The local stack and the dev toolchain. Run everything through make (see the Makefile); the host needs
# only Docker and make. Toolchain services (tools, node, flutter) sit behind profiles, so `docker compose up`
# starts the stack only. Postgres and Redis publish no host ports: everything reaches them on the compose
# network (`make psql` opens a client). Published ports bind to 127.0.0.1 and can be moved with the SALUS_*_PORT
# variables in deployments/.env (see configs/.env.example) when another project holds the defaults.
name: salus

x-app: &app
  build:
    context: ..
    dockerfile: build/package/Dockerfile
  image: salus:dev
  environment: &app-env
    # The app binaries log in as salus_app: no superuser, no BYPASSRLS, owner of nothing, so grants and
    # row-level security apply. Only migrate (and salusctl) connect as the owner, salus. Local only.
    DATABASE_URL: postgres://salus_app:local-app-password@postgres:5432/salus?sslmode=disable
    REDIS_URL: redis://redis:6379/0
  restart: unless-stopped
  depends_on: &app-deps
    migrate: {condition: service_completed_successfully}
    redis: {condition: service_healthy}

x-host-user: &host-user
  # Files the toolchains write into the repo stay owned by the host user. make exports HOST_UID/HOST_GID.
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

services:
  postgres:
    image: postgres:18.6
    # The default 100 connections is too few for `make cover`: every test package runs in parallel, each
    # test with its own pools (River clients included); 87 were measured at the peak, and one run failed with
    # 53300 (docs/accounts/PROGRESS.md, package 5).
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: salus
      POSTGRES_PASSWORD: salus # local only; synthetic data only
      POSTGRES_DB: salus
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "salus", "-d", "salus"]
      interval: 1s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.10.2
    # Temporary state only (ADR 0005): nothing is written to disk. 256 logical databases so redistest can
    # give each parallel test its own.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--databases", "256"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  # Applies the embedded goose migrations, then exits; the app services start after it succeeds.
  migrate:
    <<: *app
    command: ["/usr/local/bin/migrate", "up"]
    environment:
      DATABASE_URL: postgres://salus:salus@postgres:5432/salus?sslmode=disable # the owner; local only
      APP_DATABASE_PASSWORD: local-app-password # set on salus_app after the migrations; synthetic, local only
      RETENTION_DATABASE_PASSWORD: local-retention-password # set on salus_retention likewise
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *app
    command: ["/usr/local/bin/api"]
    environment:
      <<: *app-env
      HTTP_ADDR: ":8080"
      # Synthetic, local only. TOTP_KEY seals TOTP secrets (production: the KMS, not decided yet);
      # RATE_LIMIT_KEY names the login rate-limit counters in Redis by HMAC.
      TOTP_KEY: bG9jYWwtb25seS1zeW50aGV0aWMtdG90cC1rZXktMzI=
      RATE_LIMIT_KEY: bG9jYWwtb25seS1zeW50aGV0aWMtcmF0ZWxpbWl0LWs=
      # The FHIR API's public base, for the links and fullUrls of a search's Bundle.
      FHIR_BASE_URL: http://localhost:${SALUS_API_PORT:-8080}/fhir/R4
    ports: ["127.0.0.1:${SALUS_API_PORT:-8080}:8080"]

  worker:
    <<: *app
    command: ["/usr/local/bin/worker"]
    environment:
      <<: *app-env
      # The retention_apply job's own login, salus_retention (BYPASSRLS, SELECT and DELETE on the tables whose
      # rule is delete). Only this service has it (internal/worker's tests check). Synthetic, local only.
      RETENTION_DATABASE_URL: postgres://salus_retention:local-retention-password@postgres:5432/salus?sslmode=disable

  # Enqueues the periodic jobs (retention_apply daily at 03:00 UTC) and is River's only leader.
  scheduler:
    <<: *app
    command: ["/usr/local/bin/scheduler"]

  # Sends e-mail (ADR 0007): works only River's email queue. SMTP to Mailpit locally; SES is not wired (needs
  # its DPA, docs/privacy/processors.md).
  notifier:
    <<: *app
    command: ["/usr/local/bin/notifier"]
    environment:
      <<: *app-env
      SMTP_ADDR: mailpit:1025
      WEB_BASE_URL: http://localhost:${SALUS_WEB_PORT:-5173} # invite links: <WEB_BASE_URL>/invite#<token>
    depends_on:
      <<: *app-deps
      mailpit: {condition: service_healthy}

  agent:
    <<: *app
    command: ["/usr/local/bin/agent"]

  # Video, dev mode only: API key `devkey`, secret `secret`, published on 127.0.0.1 for a local browser.
  livekit:
    image: livekit/livekit-server:v1.13.11
    command: ["--dev", "--bind", "0.0.0.0"]
    ports:
      - "127.0.0.1:${SALUS_LIVEKIT_PORT:-7880}:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"

  # Catches every e-mail sent locally; web UI on 127.0.0.1:8025 (SMTP 1025 on the compose network only).
  mailpit:
    image: axllent/mailpit:v1.33.0
    ports: ["127.0.0.1:${SALUS_MAILPIT_PORT:-8025}:8025"]

  # Marketing landing page (landing/): the prerendered React app on nginx, 127.0.0.1:8090. Fonts are bundled,
  # so the page makes no third-party request. `make landing` starts it alone.
  landing:
    build:
      context: ../landing
      dockerfile: ../build/package/landing.Dockerfile
    image: salus-landing:dev
    ports: ["127.0.0.1:${SALUS_LANDING_PORT:-8090}:8080"]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Go toolchain: tests, lint, migrations, sqlc. `make test` runs `docker compose run --rm tools go test ./...`.
  tools:
    profiles: [tools]
    build:
      context: ..
      dockerfile: build/package/dev.Dockerfile
    image: salus-tools:dev
    <<: *host-user
    working_dir: /src
    environment:
      TEST_DATABASE_URL: postgres://salus:salus@postgres:5432/salus?sslmode=disable
      # salus_app is cluster-wide: the same synthetic password migrate sets, so tests and the stack agree.
      TEST_APP_DATABASE_PASSWORD: local-app-password
      # salus_retention, the retention job's login, is cluster-wide too: the value migrate sets.
      TEST_RETENTION_DATABASE_PASSWORD: local-retention-password
      TEST_REDIS_URL: redis://redis:6379/0
      # The SMTP sender's tests deliver to the compose Mailpit and read its API, then delete what they sent.
      TEST_SMTP_ADDR: mailpit:1025
      TEST_MAILPIT_URL: http://mailpit:8025
      DATABASE_URL: postgres://salus:salus@postgres:5432/salus?sslmode=disable # make migrate: the owner
      APP_DATABASE_PASSWORD: local-app-password
      RETENTION_DATABASE_PASSWORD: local-retention-password # make migrate sets it on salus_retention
    volumes:
      - ..:/src
      - gomod:/cache/gomod
      - gobuild:/cache/gobuild
      - golangci:/cache/golangci
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      mailpit: {condition: service_healthy}

  # HL7 FHIR validator: `make fhir-validate`. Reads the repo only.
  fhir-validator:
    profiles: [tools]
    build:
      context: ..
      dockerfile: build/package/fhir-validator.Dockerfile
    image: salus-fhir-validator:7.0.2
    volumes:
      - ..:/src:ro
      - fhir:/cache

  # Generates the Dart client from api/openapi.yaml: `make gen-clients`.
  openapi-generator:
    profiles: [tools]
    image: openapitools/openapi-generator-cli:v7.26.0
    <<: *host-user
    working_dir: /src
    environment:
      HOME: /tmp
    volumes:
      - ..:/src

  # Web toolchain and the Vite dev server (port 5173): `make web-dev`.
  node:
    profiles: [web]
    build:
      context: ..
      dockerfile: build/package/node.Dockerfile
    image: salus-node:24.22.0
    <<: *host-user
    working_dir: /src/web
    environment:
      API_URL: http://api:8080 # the Vite dev server proxies API calls here
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    ports: ["127.0.0.1:${SALUS_WEB_PORT:-5173}:5173"]
    volumes:
      - ..:/src
      - npm:/cache/npm

  # Vite dev server for the landing page (landing/): `make landing-dev`, on 127.0.0.1:5174.
  landing-dev:
    profiles: [landing]
    build:
      context: ..
      dockerfile: build/package/node.Dockerfile
    image: salus-node:24.22.0
    <<: *host-user
    working_dir: /src/landing
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5174"]
    ports: ["127.0.0.1:${SALUS_LANDING_DEV_PORT:-5174}:5174"]
    volumes:
      - ..:/src
      - npm:/cache/npm

  # Flutter toolchain: analyze, test, codegen. Devices and emulators stay on the host (README.md).
  flutter:
    profiles: [mobile]
    build:
      context: ..
      dockerfile: build/package/flutter.Dockerfile
    image: salus-flutter:3.47.7
    <<: *host-user
    working_dir: /src/mobile
    volumes:
      - ..:/src
      - pub:/cache/pub

volumes:
  postgres:
  gomod:
  gobuild:
  golangci:
  npm:
  pub:
  fhir:
